<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chiffres mensuels – Artik &amp; Chassaing</title>
<meta name="robots" content="noindex,nofollow">
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : en-tête, sélecteurs année et société, indicateurs, graphiques mensuels et cumulés, tableau ; saisie par société ; objectifs */
:root{
  --bg:#F3F4F6;--surface:#FFFFFF;--ink:#1F2328;--muted:#5D6670;--line:#DDE1E6;--soft:#F7F8FA;
  --c1:#E4670A;--c2:#1F7FC4;--c3:#8E2344;--c4:#B8901A;--c1s:#FCEBDD;
  --ok:#2E8B57;--okS:#E3F2EA;--mid:#C98A0B;--midS:#FBF1DA;--ko:#C5372C;--koS:#F9E3E1;--hi:#1F7FC4;--hiS:#E1EEF8;
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-b:"Barlow",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181C;--surface:#1E2227;--ink:#ECEEF0;--muted:#A3ABB4;--line:#323840;--soft:#252A30;--c1s:#3A2618;--okS:#173327;--midS:#3A2F14;--koS:#3D1C19;--hiS:#16293A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181C;--surface:#1E2227;--ink:#ECEEF0;--muted:#A3ABB4;--line:#323840;--soft:#252A30;--c1s:#3A2618;--okS:#173327;--midS:#3A2F14;--koS:#3D1C19;--hiS:#16293A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b)}
.wrap{max-width:1360px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.btn.pri{background:var(--c1);border-color:var(--c1);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{color:var(--ko)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px}.x:hover{background:var(--soft);color:var(--ko)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--surface);width:100%;min-width:0}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.hint{color:var(--muted);font-size:13px;margin:0}
/* en-tête */
.head{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bar{display:grid;grid-template-columns:repeat(4,1fr);height:5px}.bar i:nth-child(1){background:var(--c1)}.bar i:nth-child(2){background:var(--c2)}.bar i:nth-child(3){background:var(--c3)}.bar i:nth-child(4){background:var(--c4)}
.hin{display:flex;gap:16px;align-items:center;padding:12px 18px;flex-wrap:wrap}
.logos{display:flex;gap:8px}.logo{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;height:50px}.logo img{height:38px;width:auto;display:block}
.ht{flex:1;min-width:220px}.ht h1{font:700 30px/1 var(--f-d);margin:0}.ht p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;font:600 18px var(--f-d);padding:8px 14px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--c1)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font:700 21px var(--f-d);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font:500 13px var(--f-b);color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;z-index:50}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--c1s);color:var(--ink);box-shadow:inset 0 -2px 0 var(--c1)}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar2 select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--kc,var(--c1));border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 32px/1 var(--f-d);font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.up{color:var(--ok)}.dn{color:var(--ko)}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}.gauge u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.charts{display:grid;grid-template-columns:3fr 2fr;gap:14px;align-items:start}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:600 11px var(--f-b);fill:var(--muted)}
.chart .v{font:700 11px var(--f-b);fill:var(--ink)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:12px;height:12px;border-radius:3px;background:var(--lc)}
.legend i.ln{height:3px;border-radius:2px}.legend i.dash{height:0;border-top:2px dashed var(--lc);background:none}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.35;z-index:60;max-width:260px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cur td{background:var(--c1s)}
tr.fut td{color:var(--muted)}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.sl{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center}
.sl label{font-size:14px;display:flex;gap:8px;align-items:center}.sl label i{width:10px;height:10px;border-radius:3px;background:var(--lc)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line);padding-top:6px;font-variant-numeric:tabular-nums}
.note{background:var(--c1s);border-radius:10px;padding:8px 10px;font-size:13px}
.mois{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.mois label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize}
.lock{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:9px 12px;font-size:14px}
.empty{padding:26px 10px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.ex{font-size:11px;font-weight:700;background:var(--c1s);border-radius:5px;padding:1px 6px}
@media (max-width:1000px){.charts,.sgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.mois{grid-template-columns:repeat(6,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}.mois{grid-template-columns:repeat(3,1fr)}.sl{grid-template-columns:1fr 110px}}
</style>

<style>
#gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 40px;overflow:auto}
[hidden]{display:none!important}
.gatecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;max-width:460px;width:100%;display:grid;gap:12px}
.gatecard h2{font:700 30px/1.1 var(--f-d);margin:0}.gatecard p{margin:0;color:var(--muted)}.gatecard .btn{justify-self:start}
</style>

(function(){
const CFG={tenantId:"14b03bce-aec8-408e-9686-c43ea4a503d8",clientId:"f66f2711-d9e4-4fd3-be11-57367c333c87",

let app=null,account=null,siteId=null;const L={},ids={},timers={};
const gate=document.createElement("div");gate.id="gate";gate.hidden=true;document.body.appendChild(gate);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showGate(t,x,btn,fn){gate.innerHTML=`<div class="gatecard"><h2>${esc(t)}</h2><p>${x}</p>${btn?`<button class="btn pri" type="button" id="gb">${esc(btn)}</button>`:""}</div>`;gate.hidden=false;if(btn)document.getElementById("gb").onclick=fn}
async function tok(sc){try{return (await app.acquireTokenSilent({scopes:sc,account})).accessToken}catch(e){await app.acquireTokenRedirect({scopes:sc,account});throw new Error("redirect")}}
async function gx(method,path,body,sc){const r=await fetch(path.startsWith("http")?path:"https://graph.microsoft.com/v1.0"+path,{method,headers:{Authorization:"Bearer "+await tok(sc||SC),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error&&j.error.message)||("Erreur "+r.status));e.status=r.status;throw e}return j}
async function lists(){let u=`/sites/${siteId}/lists?$select=id,displayName&$top=200`;while(u){const r=await gx("GET",u);(r.value||[]).forEach(l=>L[l.displayName]=l.id);u=r["@odata.nextLink"]}}
async function items(name){const out=[];if(!L[name])return out;let u=`/sites/${siteId}/lists/${L[name]}/items?$expand=fields($select=Title,Valeur)&$top=500`;
  while(u){const r=await gx("GET",u);(r.value||[]).forEach(it=>{const t=it.fields&&it.fields.Title;if(!t)return;let v={};try{v=JSON.parse(it.fields.Valeur||"{}")}catch(e){}out.push({id:it.id,t,v})});u=r["@odata.nextLink"]}return out}

  else{const r=await gx("POST",`/sites/${siteId}/lists/${L[list]}/items`,{fields:{Title:key,...f}});ids[k]=r.id}}

  async load(){

    account=(res&&res.account)||app.getAllAccounts()[0]||null;
    if(!account){showGate("Chiffres mensuels","Connectez-vous avec votre compte Microsoft de l'entreprise.","Se connecter",()=>app.loginRedirect({scopes:SC}));throw new Error("stop")}
    showGate("Chargement…","Lecture des chiffres.");

    siteId=(await gx("GET","/sites/root?$select=id")).id;await lists();
    if(!L[CFG.liste]){if(email!==CFG.owner){showGate("Pas encore ouvert","Les chiffres mensuels n'ont pas encore été activés par Dimitri.");throw new Error("stop")}
      const l=await gx("POST",`/sites/${siteId}/lists`,{displayName:CFG.liste,list:{template:"genericList"},columns:[{name:"Valeur",text:{allowMultipleLines:true,textType:"plain"}}]},SC_ADMIN);L[CFG.liste]=l.id;
      /* première ouverture : on reprend l'historique du tableau Excel (2024 → 2026) */

      for(const k of ks)await put(CFG.liste,"mois/"+k,H[k]);
      await put(CFG.liste,"config/objectifs",{obj:{},saison:{}})}
    const mine=await items(CFG.liste),D={obj:{},saison:{},mois:{}};
    mine.forEach(x=>{ids[CFG.liste+"|"+x.t]=x.id;if(x.t.startsWith("mois/"))D.mois[x.t.slice(5)]=x.v;else if(x.t==="config/objectifs"){D.obj=x.v.obj||{};D.saison=x.v.saison||{}}});
    gate.hidden=true;
    return {data:D,me:{email,owner:email===CFG.owner,saisie:true}};
  },
  save(D,key){const k=key==="params"?"config/objectifs":"mois/"+key,v=key==="params"?{obj:D.obj,saison:D.saison}:D.mois[key];if(key==="params"&&email!==CFG.owner)return;
    clearTimeout(timers[k]);timers[k]=setTimeout(()=>put(CFG.liste,k,v).catch(err=>{if(err.message!=="redirect")warn("Enregistrement impossible : "+err.message)}),600)}
};
})();

function ex(y,m,k){return socs().reduce((a,s)=>a+num(cell(y,m,s)[k]),0)}
const hasS=(y,m,s)=>{const c=cell(y,m,s);return ACT.some(x=>c[x.k]!==undefined&&c[x.k]!=="")};
const has=(y,m)=>socs().every(s=>hasS(y,m,s)); /* un mois compte quand toutes les sociétés affichées sont saisies */
const saisonOf=y=>{const s=D.saison[y];return s&&s.length===12?s:EQ()};
const objOf=(y,s)=>{const o=(D.obj[y]||{})[s];return o&&typeof o==="object"?o:(o==null||o==="")?{}:{chantier:num(o)}};
const objAn=(y,act)=>socs().reduce((a,s)=>{const o=objOf(y,s);return a+(act?num(o[act]):OBJA.reduce((b,k)=>b+num(o[k]),0))},0);
const objM=(y,m,act)=>objAn(y,act)*saisonOf(y)[m]/100;
function lastIdx(y){let L=-1;for(let m=0;m<12;m++)if(has(y,m))L=m;return L}

/* ---------- en-tête ---------- */
function head(){return `<header class="head"><div class="bar"><i></i><i></i><i></i><i></i></div><div class="hin"><div class="logos">${LOGOS.map((l,i)=>`<div class="logo"><img src="${l}" alt="${i?"Chassaing Technologies":"Artik Frigoriste"}"></div>`).join("")}</div>

  <nav class="tabs" role="tablist">${[["analyse","📊 Analyse"],["saisie","✏️ Saisie du mois"],["objectifs","🎯 Objectifs"]].filter(([k])=>k!=="saisie"||canSaisie()).map(([k,n])=>`<button type="button" role="tab" data-view="${k}" aria-selected="${view===k}">${n}</button>`).join("")}</nav>
  <div class="bar2"><label class="hint" style="display:flex;gap:6px;align-items:center;font-weight:600">Année <select id="year">${years().map(y=>`<option${y===Y?" selected":""}>${y}</option>`).join("")}</select></label>
   ${view!=="saisie"?`<div class="seg" role="group" aria-label="Société">${[["groupe","Groupe"],...SOCS].map(([k,n])=>`<button type="button" data-soc="${k}" aria-pressed="${SOC===k}">${n}</button>`).join("")}</div>`:""}
   </div>`}
function years(){const s=new Set([String(now.getFullYear()-1),String(now.getFullYear()),String(now.getFullYear()+1)]);Object.keys(D.mois).forEach(k=>s.add(k.slice(0,4)));Object.keys(D.obj).forEach(k=>s.add(k));return [...s].sort()}

/* ---------- analyse ---------- */
function analyseHTML(){const y=Y,yp=String(+y-1),L=lastIdx(y),A=objAn(y);
  if(L<0&&!A)return `<section class="card"><div class="empty"><p><b>Rien de saisi pour ${y}.</b></p><p class="hint">Commence par l'onglet 🎯 Objectifs, puis saisis le CA de chaque mois dans ✏️ Saisie du mois.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${canObj()?`<button type="button" class="btn pri" data-view="objectifs">🎯 Fixer les objectifs</button>`:""}${canSaisie()?`<button type="button" class="btn" data-view="saisie">✏️ Saisir un mois</button>`:""}</div></div></section>`;
  const M=[...Array(12)].map((_,m)=>({m,ca:ca(y,m),o:objM(y,m),n1:ca(yp,m),has:has(y,m),act:ACT.map(a=>ca(y,m,a.k))}));
  const upto=L<0?-1:L,cum=M.slice(0,upto+1).reduce((a,x)=>a+x.ca,0),oCum=M.slice(0,upto+1).reduce((a,x)=>a+x.o,0),n1Cum=M.slice(0,upto+1).reduce((a,x)=>a+x.n1,0);
  const sCum=saisonOf(y).slice(0,upto+1).reduce((a,b)=>a+b,0)/100,proj=sCum>0?cum/sCum:0,reste=Math.max(0,A-cum),nRest=11-upto,parMois=nRest>0?reste/nRest:0;
  const lm=upto>=0?M[upto]:null;
  const k1=lm?`<div class="kpi" style="--kc:${!lm.o?"var(--c1)":lm.ca>=lm.o?"var(--ok)":"var(--ko)"}"><span class="l">${MOISL[upto]} ${y}</span><span class="v">${keur(lm.ca)}</span><span class="s">${lm.o?`objectif ${keur(lm.o)} · <b class="${lm.ca>=lm.o?"up":"dn"}">${sgn(lm.ca-lm.o,keur)}</b>`:"pas d'objectif fixé"}${lm.n1?` · N-1 ${sgn((lm.ca-lm.n1)/lm.n1*100,x=>Math.round(x)+" %")}`:""}</span></div>`:"";
  const k2=`<div class="kpi" style="--kc:${!oCum?"var(--c1)":cum>=oCum?"var(--ok)":"var(--ko)"}"><span class="l">Cumul ${upto>=0?"janv. → "+MOIS[upto]:""}</span><span class="v">${keur(cum)}</span><span class="s">${oCum?`objectif à date ${keur(oCum)} · <b class="${cum>=oCum?"up":"dn"}">${sgn(cum-oCum,keur)}</b>`:"pas d'objectif fixé"}${n1Cum?` · N-1 ${keur(n1Cum)}`:""}</span></div>`;
  const pA=A?cum/A:NaN,pT=A?oCum/A:0;
  const k3=`<div class="kpi" style="--kc:var(--c2)"><span class="l">Objectif annuel ${keur(A)}</span><span class="v">${pct(pA)}</span><div class="gauge" title="trait = où on devrait en être"><i style="width:${Math.min(100,(pA||0)*100)}%;background:${pA>=pT?"var(--ok)":"var(--c1)"}"></i><u style="left:${Math.min(99.5,pT*100)}%"></u></div><span class="s">${A?(pA>=pT?"en avance sur le rythme 👍":"en dessous du rythme prévu"):"objectif à fixer"}</span></div>`;
  const k4=`<div class="kpi" style="--kc:var(--c4)"><span class="l">Si le rythme continue</span><span class="v">${upto>=0?keur(proj):"—"}</span><span class="s">${A&&upto>=0?(proj>=A?`fin d'année au-dessus de l'objectif (${sgn(proj-A,keur)})`:`il faut ${keur(parMois)} par mois sur les ${nRest} mois restants`):"projection selon la saisonnalité"}</span></div>`;
  const HC=HORS.map(h=>({...h,v:M.slice(0,upto+1).reduce((a,x)=>a+ex(y,x.m,h.k),0)})),hcT=HC.reduce((a,h)=>a+h.v,0);
  const reunion=`<section class="card"><h2>🧾 Hors CA <small>garanties, offert, infacturable · pour info, ne compte pas dans le CA</small></h2>
    ${hcT?`<div class="kpis">${HC.map(h=>`<div class="kpi" style="--kc:var(--c3)"><span class="l">${h.n}</span><span class="v">${keur(h.v)}</span><span class="s">${cum?pct(h.v/cum)+" du CA facturé":""}</span></div>`).join("")}</div><div class="tot"><span>Total hors CA ${upto>=0?"janv. → "+MOIS[upto]:""}</span><span>${eur(hcT)}</span></div>`:`<p class="hint">Rien de saisi pour ${y}. Ces montants se saisissent en bas de la Saisie du mois (et viendront plus tard des cases Garantie / Offert client d'Organilog).</p>`}</section>`;
  const yrs=[...new Set(Object.keys(D.mois).map(k=>k.slice(0,4)))].sort(),YR=yrs.map(yy=>{const r={y:yy};SOCS.forEach(([sx])=>{r[sx]=0;for(let m=0;m<12;m++){const c=cell(yy,m,sx);r[sx]+=ACT.reduce((b,a)=>b+num(c[a.k]),0)}});r.t=r.artik+r.chassaing;r.n=[...Array(12)].filter((_,m)=>SOCS.every(([sx])=>hasS(yy,m,sx))).length;return r}),yMax=Math.max(1,...YR.map(r=>r.t));
  const pluri=YR.length>1?`<section class="card"><h2>📆 Comparatif pluriannuel</h2><div class="tbl"><table><thead><tr><th>Année</th><th class="n">Artik</th><th class="n">Chassaing</th><th class="n">Groupe</th><th style="width:40%"></th></tr></thead><tbody>
    ${YR.map((r,i)=>`<tr class="${r.y===y?"cur":""}"><td><b>${r.y}</b>${r.n<12?` <span class="hint">(${r.n} mois complets)</span>`:""}</td><td class="n">${eur(r.artik)}</td><td class="n">${eur(r.chassaing)}</td><td class="n"><b>${eur(r.t)}</b>${i&&YR[i-1].t&&r.n===12&&YR[i-1].n===12?` <span class="${r.t>=YR[i-1].t?"up":"dn"}">${sgn((r.t-YR[i-1].t)/YR[i-1].t*100,v=>Math.round(v)+" %")}</span>`:""}</td>
     <td><div style="display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--soft);width:${r.t/yMax*100}%"><i style="width:${r.t?r.artik/r.t*100:0}%;background:#E4670A"></i><i style="width:${r.t?r.chassaing/r.t*100:0}%;background:#1F7FC4"></i></div></td></tr>`).join("")}</tbody></table></div>
    <div class="legend"><span><i style="--lc:#E4670A"></i>Artik</span><span><i style="--lc:#1F7FC4"></i>Chassaing</span></div></section>`:"";
  const actY=ACT.map((a,i)=>({...a,v:M.slice(0,upto+1).reduce((s,x)=>s+x.act[i],0)})),actT=actY.reduce((s,a)=>s+a.v,0)||1;
  const actObj=OBJA.map(k=>{const a=ACT.find(x=>x.k===k),i=ACT.indexOf(a),cum=M.slice(0,upto+1).reduce((s,x)=>s+x.act[i],0),an=objAn(y,k),od=[...Array(upto+1)].reduce((s,_,m)=>s+objM(y,m,k),0);return {...a,cum,an,od}});
  const objBlock=actObj.some(a=>a.an)?`<section class="card"><h2>🎯 Objectifs par activité <small>${upto>=0?"cumul janv. → "+MOIS[upto]:""} · trait = où on devrait en être</small></h2>
    ${actObj.map(a=>{const p=a.an?a.cum/a.an:0,t=a.an?a.od/a.an:0;return `<div style="display:grid;grid-template-columns:180px 1fr 230px;gap:12px;align-items:center"><b><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${a.c};margin-right:6px"></span>${a.n}</b>
      <div class="gauge" style="height:14px"><i style="width:${Math.min(100,p*100)}%;background:${a.c}"></i><u style="left:${Math.min(99.5,t*100)}%"></u></div>
      <span style="text-align:right;font-variant-numeric:tabular-nums">${a.an?`<b>${keur(a.cum)}</b> / ${keur(a.an)} · ${pct(p)} <span class="${a.cum>=a.od?"up":"dn"}">(${sgn(a.cum-a.od,keur)})</span>`:'<span class="hint">pas d\'objectif</span>'}</span></div>`}).join("")}</section>`:"";
  return `<div class="kpis">${k1}${k2}${k3}${k4}</div>${objBlock}
   <div class="charts"><section class="card chart"><h2>📊 CA facturé par mois <small>barres empilées par activité · trait noir = objectif du mois</small></h2>${barsSVG(M)}
     <div class="legend">${ACT.map(a=>`<span><i style="--lc:${a.c}"></i>${a.n}</span>`).join("")}<span><i class="ln" style="--lc:var(--ink);background:var(--ink)"></i>Objectif</span></div></section>
    <section class="card chart"><h2>📈 Cumul de l'année</h2>${cumSVG(M,upto)}
     <div class="legend"><span><i class="ln" style="background:#E4670A"></i>${y}</span><span><i class="dash" style="--lc:var(--ink)"></i>Objectif cumulé</span><span><i class="ln" style="background:#9AA3AD"></i>${yp}</span></div>
     <h2 style="font-size:18px;margin-top:6px">Répartition ${upto>=0?"janv. → "+MOIS[upto]:""}</h2>${actY.map(a=>`<div style="display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:13px"><span>${a.n}</span><div class="gauge"><i style="width:${a.v/actT*100}%;background:${a.c}"></i></div><b style="text-align:right">${keur(a.v)}</b></div>`).join("")}</section></div>
   ${reunion}${pluri}
   <section class="card"><h2>🧾 Mois par mois</h2><div class="tbl"><table><thead><tr><th>Mois</th><th class="n">CA facturé</th><th class="n">Objectif</th><th class="n">Écart</th><th class="n">Atteint</th><th class="n">N-1</th><th class="n">Évol.</th></tr></thead><tbody>
    ${M.map(x=>`<tr class="${x.m===upto?"cur":""}${x.m>upto&&!x.has?" fut":""}"><td>${MOISL[x.m]}</td><td class="n"><b>${x.has?eur(x.ca):x.ca?`<span class="hint" title="toutes les sociétés ne sont pas encore saisies">incomplet · </span>`+eur(x.ca):"—"}</b></td><td class="n">${x.o?eur(x.o):"—"}</td>
     <td class="n">${x.has&&x.o?`<span class="${x.ca>=x.o?"up":"dn"}">${sgn(x.ca-x.o,eur)}</span>`:""}</td><td class="n">${x.has&&x.o?pct(x.ca/x.o):""}</td><td class="n">${x.n1?eur(x.n1):"—"}</td>
     <td class="n">${x.has&&x.n1?`<span class="${x.ca>=x.n1?"up":"dn"}">${sgn((x.ca-x.n1)/x.n1*100,v=>Math.round(v)+" %")}</span>`:""}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total ${y}</td><td class="n">${eur(M.reduce((a,x)=>a+x.ca,0))}</td><td class="n">${eur(A)}</td><td></td><td class="n">${pct(pA)}</td><td class="n">${eur(M.reduce((a,x)=>a+x.n1,0))}</td><td></td></tr></tfoot></table></div></section>`}
function barsSVG(M){const W=640,H=260,pl=46,pb=24,pt=14,mx=Math.max(1,...M.map(x=>Math.max(x.ca,x.o)))*1.08,bw=(W-pl)/12,yv=v=>pt+(H-pt-pb)*(1-v/mx);
  const ticks=[0,.25,.5,.75,1].map(f=>mx/1.08*f);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CA facturé par mois et objectif"><g class="grid">${ticks.map(t=>`<line x1="${pl}" x2="${W}" y1="${yv(t)}" y2="${yv(t)}"/><text x="${pl-6}" y="${yv(t)+4}" text-anchor="end">${keur(t)}</text>`).join("")}</g>
   ${M.map((x,i)=>{let y0=yv(0);const segs=ACT.map((a,j)=>{const v=x.act[j];if(!v)return "";const h=(H-pt-pb)*v/mx;y0-=h;return `<rect x="${pl+i*bw+bw*.18}" y="${y0+1}" width="${bw*.64}" height="${Math.max(0,h-2)}" rx="3" fill="${a.c}"/>`}).join("");
     const tip=`<b>${MOISL[i]}</b><br>CA ${eur(x.ca)}${x.o?`<br>Objectif ${eur(x.o)}`:""}${ACT.map((a,j)=>x.act[j]?`<br>· ${a.n} ${eur(x.act[j])}`:"").join("")}`;
     return `<g data-tip="${esc(tip)}">${segs}${x.o?`<line x1="${pl+i*bw+bw*.1}" x2="${pl+i*bw+bw*.9}" y1="${yv(x.o)}" y2="${yv(x.o)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`:""}<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/><text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${MOIS[i]}</text></g>`}).join("")}</svg>`}
function cumSVG(M,upto){const W=420,H=230,pl=46,pb=24,pt=12;let a=0,o=0,n=0;const C=M.map(x=>({ca:(a+=x.ca),o:(o+=x.o),n1:(n+=x.n1)}));
  const mx=Math.max(1,...C.map(x=>Math.max(x.o,x.n1,x.ca)))*1.05,xv=i=>pl+(W-pl-8)*i/11,yv=v=>pt+(H-pt-pb)*(1-v/mx);
  const path=(arr)=>arr.map((v,i)=>(i?"L":"M")+xv(i).toFixed(1)+" "+yv(v).toFixed(1)).join(" ");
  const ticks=[0,.5,1].map(f=>mx/1.05*f);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CA cumulé, objectif cumulé et année précédente"><g class="grid">${ticks.map(t=>`<line x1="${pl}" x2="${W-8}" y1="${yv(t)}" y2="${yv(t)}"/><text x="${pl-6}" y="${yv(t)+4}" text-anchor="end">${keur(t)}</text>`).join("")}</g>
   ${C.some(x=>x.o)?`<path d="${path(C.map(x=>x.o))}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 5"/>`:""}
   ${C.some(x=>x.n1)?`<path d="${path(C.map(x=>x.n1))}" fill="none" stroke="#9AA3AD" stroke-width="2"/>`:""}
   ${upto>=0?`<path d="${path(C.slice(0,upto+1).map(x=>x.ca))}" fill="none" stroke="#E4670A" stroke-width="3"/><circle cx="${xv(upto)}" cy="${yv(C[upto].ca)}" r="5" fill="#E4670A" stroke="var(--surface)" stroke-width="2"/><text class="v" x="${xv(upto)-8}" y="${yv(C[upto].ca)-10}" text-anchor="end">${keur(C[upto].ca)}</text>`:""}
   ${M.map((x,i)=>`<rect x="${xv(i)-(W-pl)/24}" y="${pt}" width="${(W-pl)/12}" height="${H-pt-pb}" fill="transparent" data-tip="${esc(`<b>fin ${MOISL[i]}</b><br>Cumul ${i<=upto?eur(C[i].ca):"—"}<br>Objectif ${eur(C[i].o)}<br>N-1 ${eur(C[i].n1)}`)}"/>`).join("")}
   ${[0,3,6,9,11].map(i=>`<text x="${xv(i)}" y="${H-6}" text-anchor="middle">${MOIS[i]}</text>`).join("")}</svg>`}

/* ---------- saisie ---------- */

  const socCard=([s,n])=>{const c=cell(y,m,s),tot=ACT.reduce((a,x)=>a+num(c[x.k]),0);

     ${ACT.map(a=>`<div class="sl"><label style="--lc:${a.c}"><i></i>${a.n}</label><input type="text" inputmode="decimal" class="num" data-c="${s}|${a.k}" value="${esc(inV(c[a.k]))}" placeholder="0 €" autocomplete="off"></div>`).join("")}
     <div class="tot"><span>Total CA ${n}</span><span id="tot-${s}">${eur(tot)}</span></div>
     <div class="hint" style="font-weight:700;margin-top:6px">Hors CA <span style="font-weight:400">(pour info, ne compte pas dans le CA)</span></div>
     ${HORS.map(x=>`<div class="sl"><label>${x.n}</label><input type="text" inputmode="decimal" class="num" data-c="${s}|${x.k}" value="${esc(inV(c[x.k]))}" placeholder="0 €" autocomplete="off"></div>`).join("")}</section>`};
  return `<section class="card"><h2>✏️ Quel mois ?</h2><div class="mois">${MOIS.map((mm,i)=>`<button type="button" class="btn sm" data-ms="${i}" style="${i===m?"background:var(--c1);border-color:var(--c1);color:#fff":hasS(y,i,"artik")&&hasS(y,i,"chassaing")?"background:var(--okS)":""}" title="${SOCS.map(([sx,n])=>n+(hasS(y,i,sx)?" ✓":" à saisir")).join(" · ")}">${mm}${hasS(y,i,"artik")&&hasS(y,i,"chassaing")?" ✓":hasS(y,i,"artik")||hasS(y,i,"chassaing")?" ½":""}</button>`).join("")}</div>
   <p class="note">Saisis le <b>CA facturé HT</b> du mois (factures émises, avoirs déduits). Les <b>acomptes ne comptent pas</b> : ils entrent dans le CA quand la facture de situation ou la facture finale est émise. Tout s'enregistre au fil de la frappe.</p></section>
   <div class="sgrid">${SOCS.map(socCard).join("")}</div>
   <div class="kpis" id="z-cmp"></div>`}
function refreshSaisie(){SOCS.forEach(([s])=>{const c=cell(Y,MS,s),el=$("#tot-"+s);if(el)el.textContent=eur(ACT.reduce((a,x)=>a+num(c[x.k]),0))});
  const z=$("#z-cmp");if(!z)return;const keep=SOC;SOC="groupe";const v=ca(Y,MS),o=objM(Y,MS),n1=ca(String(+Y-1),MS);SOC=keep;
  z.innerHTML=`<div class="kpi" style="--kc:${v>=o?"var(--ok)":"var(--ko)"}"><span class="l">Groupe · ${MOISL[MS]}</span><span class="v">${eur(v)}</span><span class="s">${o?`objectif ${eur(o)} · <b class="${v>=o?"up":"dn"}">${sgn(v-o,eur)}</b>`:"objectif à fixer"}</span></div>
   <div class="kpi" style="--kc:#9AA3AD"><span class="l">${MOISL[MS]} ${+Y-1}</span><span class="v">${n1?eur(n1):"—"}</span><span class="s">${n1&&v?sgn((v-n1)/n1*100,x=>Math.round(x)+" %")+" par rapport à l'an dernier":""}</span></div>`}

/* ---------- objectifs ---------- */
function objHTML(){const y=Y,S=saisonOf(y),sum=S.reduce((a,b)=>a+b,0),dis=canObj()?"":" disabled",yp=String(+y-1);
  const hasN1=[...Array(12)].some((_,m)=>has(yp,m)),A=OBJA.map(k=>ACT.find(a=>a.k===k));
  const tot=(s,k)=>s==="groupe"?SOCS.reduce((a,[x])=>a+(k?num(objOf(y,x)[k]):OBJA.reduce((b,kk)=>b+num(objOf(y,x)[kk]),0)),0):(k?num(objOf(y,s)[k]):OBJA.reduce((b,kk)=>b+num(objOf(y,s)[kk]),0));
  return `${canObj()?"":`<div class="lock">🔒 Seul Dimitri fixe les objectifs. Tu peux les consulter.</div>`}
  <section class="card"><h2>🎯 Objectifs de CA ${y} <small>les objectifs communs, par activité et par société</small></h2>
   <div class="tbl"><table><thead><tr><th>Activité</th>${SOCS.map(([s,n])=>`<th class="n">${n}</th>`).join("")}<th class="n">Groupe</th></tr></thead><tbody>
    ${A.map(a=>`<tr><td><b><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${a.c};margin-right:6px"></span>${a.n}</b></td>${SOCS.map(([s])=>`<td class="n"><input type="text" inputmode="decimal" class="num" style="max-width:150px" data-obj="${s}|${a.k}" value="${esc(inV(objOf(y,s)[a.k]))}" placeholder="0 €"${dis}></td>`).join("")}<td class="n" id="og-${a.k}"><b>${eur(tot("groupe",a.k))}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total</td>${SOCS.map(([s])=>`<td class="n" id="ot-${s}">${eur(tot(s))}</td>`).join("")}<td class="n" id="ot-groupe">${eur(tot("groupe"))}</td></tr></tfoot></table></div>
   <p class="hint">Les trois activités du tableau de CA : Chantier, SAV, Maintenance.</p></section>
  <div class="sgrid"><section class="card"><h2>📅 Saisonnalité <small>part de l'année réalisée chaque mois</small></h2>
    <div class="mois">${MOIS.map((mm,i)=>`<label>${mm}<input type="text" inputmode="decimal" class="num" data-sai="${i}" value="${esc(inV(Math.round(S[i]*10)/10))}"${dis}></label>`).join("")}</div>
    <div class="tot"><span>Total</span><span id="sai-tot" class="${Math.abs(sum-100)<0.6?"up":"dn"}">${inV(Math.round(sum*10)/10)} %${Math.abs(sum-100)<0.6?"":" (doit faire 100 %)"}</span></div>
    ${canObj()?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" data-eq>Répartir également</button>${hasN1?`<button type="button" class="btn sm" data-n1>Reprendre le profil de ${yp}</button>`:""}</div>`:""}
    <p class="hint">Si août pèse peu (congés) et que l'automne est fort, mets moins en août et plus en octobre. « Reprendre le profil » copie la répartition réelle de l'an dernier.</p></section>
   <section class="card"><h2>Objectif par mois ${y}</h2><div class="tbl"><table><thead><tr><th></th>${MOIS.map(m=>`<th class="n">${m}</th>`).join("")}</tr></thead><tbody id="obj-rows">${objRows()}</tbody></table></div></section></div>`}
function objRows(){const y=Y,S=saisonOf(y);const rows=[...OBJA.map(k=>{const a=ACT.find(x=>x.k===k);return [a.n,SOCS.reduce((t,[s])=>t+num(objOf(y,s)[k]),0)]}),["Groupe",SOCS.reduce((t,[s])=>t+OBJA.reduce((b,k)=>b+num(objOf(y,s)[k]),0),0)]];
  return rows.map(([n,a],i)=>`<tr><td>${i===rows.length-1?"<b>"+n+"</b>":n}</td>${S.map(p=>`<td class="n">${i===rows.length-1?"<b>"+keur(a*p/100)+"</b>":keur(a*p/100)}</td>`).join("")}</tr>`).join("")}

function render(){$("#app").innerHTML=head()+(view==="saisie"&&canSaisie()?saisieHTML():view==="objectifs"?objHTML():analyseHTML());if(view==="saisie")refreshSaisie()}

/* ---------- actions ---------- */
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const g=e.target.closest&&e.target.closest("[data-tip]");if(!g){tip.hidden=true;return}tip.innerHTML=g.dataset.tip;tip.hidden=false;
  tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+14)+"px";tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-10)+"px"});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.view){view=d.view;render();scrollTo(0,0);return}
  if(d.soc){SOC=d.soc;SS("soc",SOC);render();return}
  if(d.ms!==undefined){MS=+d.ms;render();return}
  if(!canObj())return;
  if(d.eq!==undefined){D.saison[Y]=EQ();save("params");render();return}
  if(d.n1!==undefined){const yp=String(+Y-1),keep=SOC;SOC="groupe";const v=[...Array(12)].map((_,m)=>ca(yp,m));SOC=keep;const t=v.reduce((a,b)=>a+b,0);if(!t)return;D.saison[Y]=v.map(x=>x/t*100);save("params");render();toast("Profil de "+yp+" repris");return}
});
document.addEventListener("change",e=>{if(e.target.id==="year"){Y=e.target.value;render()}});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(d.c){if(!canSaisie())return;const [s,k]=d.c.split("|"),key=mk(Y,MS);D.mois[key]=D.mois[key]||{};D.mois[key][s]=D.mois[key][s]||{};D.mois[key][s][k]=t.value.trim()===""?"":num(t.value);save(key);refreshSaisie();return}
  if(!canObj())return;
  if(d.obj){const [s,k]=d.obj.split("|");D.obj[Y]=D.obj[Y]||{};const o=objOf(Y,s);o[k]=t.value.trim()===""?"":num(t.value);D.obj[Y][s]=o;save("params");
    const sumS=x=>OBJA.reduce((b,kk)=>b+num(objOf(Y,x)[kk]),0);$("#og-"+k).innerHTML="<b>"+eur(SOCS.reduce((a,[x])=>a+num(objOf(Y,x)[k]),0))+"</b>";SOCS.forEach(([x])=>$("#ot-"+x).textContent=eur(sumS(x)));$("#ot-groupe").textContent=eur(SOCS.reduce((a,[x])=>a+sumS(x),0));$("#obj-rows").innerHTML=objRows();return}
  if(d.sai!==undefined){const S=saisonOf(Y).slice();S[+d.sai]=num(t.value);D.saison[Y]=S;save("params");const sum=S.reduce((a,b)=>a+b,0),el=$("#sai-tot");el.textContent=inV(Math.round(sum*10)/10)+" %"+(Math.abs(sum-100)<0.6?"":" (doit faire 100 %)");el.className=Math.abs(sum-100)<0.6?"up":"dn";$("#obj-rows").innerHTML=objRows();return}
});
(async()=>{if(RD){try{const x=await RD.load();ME=x.me;D=x.data;if(!canSaisie()&&view==="saisie")view="analyse"}catch(err){if(err.message!=="stop"&&err.message!=="redirect"){const g=document.getElementById("gate");if(g){g.innerHTML=`<div class="gatecard"><h2>Lecture impossible</h2><p>${esc(err.message)}</p></div>`;g.hidden=false}}return}}render()})();
</script>

</body>
</html>
