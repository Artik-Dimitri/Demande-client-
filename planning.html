<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planning chantiers – Artik &amp; Chassaing</title>
<meta name="robots" content="noindex,nofollow">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : bandeau groupe, compteurs, frise par semaines façon tableau de charge d'atelier, panneau latéral pour la fiche chantier */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#1E2227; --muted:#656C75; --line:#DCDFE3; --soft:#ECEEF1; --grid:#E7E9EC;
  --orange:#E0701C; --gray:#7A8089; --red:#C5372C; --blue:#1F5EA6;
  --ok:#2C7A4C; --okbg:#E6F3EB; --warn:#9A6512; --warnbg:#FBF0DD; --alert:#B3302A; --alertbg:#FBE7E5;
  --orangebg:#FCEEE2; --bluebg:#E5EEF8; --today:#C5372C;
  --cat1:#E4670A; --cat2:#1F7FC4; --cat3:#8E2344; --cat4:#B8901A; --cat5:#7A8089;
  --p1:#E0701C; --p2:#1F5EA6; --p3:#2A9D8F; --p4:#8E5BB5; --p5:#C2452D; --p6:#5B6B7A;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171A; --surface:#1D2125; --ink:#E7E9EC; --muted:#9BA2AA; --line:#30353B; --soft:#262A2F; --grid:#2A2E33;
  --orange:#F08B3E; --gray:#A1A7AF; --red:#E35A4F; --blue:#5F98DD;
  --ok:#5BC08A; --okbg:#1C3027; --warn:#E3AB55; --warnbg:#33291A; --alert:#EE6E64; --alertbg:#3A2120;
  --orangebg:#3A2718; --bluebg:#1B2A3D; --today:#EE6E64;
  --cat1:#F07A22; --cat2:#3D97D8; --cat3:#B4405F; --cat4:#CFA634; --cat5:#A1A7AF;
  --p1:#F08B3E; --p2:#5F98DD; --p3:#4CC1B3; --p4:#B68AD8; --p5:#E2705A; --p6:#93A3B2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1D2125; --ink:#E7E9EC; --muted:#9BA2AA; --line:#30353B; --soft:#262A2F; --grid:#2A2E33;
  --orange:#F08B3E; --gray:#A1A7AF; --red:#E35A4F; --blue:#5F98DD;
  --ok:#5BC08A; --okbg:#1C3027; --warn:#E3AB55; --warnbg:#33291A; --alert:#EE6E64; --alertbg:#3A2120;
  --orangebg:#3A2718; --bluebg:#1B2A3D; --today:#EE6E64;
  --cat1:#F07A22; --cat2:#3D97D8; --cat3:#B4405F; --cat4:#CFA634; --cat5:#A1A7AF;
  --p1:#F08B3E; --p2:#5F98DD; --p3:#4CC1B3; --p4:#B68AD8; --p5:#E2705A; --p6:#93A3B2;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.brandline{display:grid;grid-template-columns:repeat(4,1fr);height:5px}
.brandline i:nth-child(1){background:var(--orange)}.brandline i:nth-child(2){background:var(--gray)}
.brandline i:nth-child(3){background:var(--red)}.brandline i:nth-child(4){background:var(--blue)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:22px 18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,42px);line-height:1;margin:4px 0 0;text-wrap:balance}
.trial{font-size:13px;color:var(--warn);background:var(--warnbg);padding:4px 10px;border-radius:12px;font-weight:600}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0;width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--gray)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.banner{padding:10px 14px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-size:14px;margin-bottom:14px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.hot b{color:var(--alert)}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tabsrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:10px 12px 11px;cursor:pointer;font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--orange)}
.tabsrow .btn.primary{margin-bottom:8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select{width:auto}
.nav{display:flex;gap:6px;align-items:center;margin-left:auto}
.nav span{font-size:14px;color:var(--muted);min-width:140px;text-align:center;font-variant-numeric:tabular-nums}

/* À planifier */
.todo{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.todo h3{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.todo-list{display:flex;flex-wrap:wrap;gap:8px}
.todo-item{border:1px solid var(--line);border-left:4px solid var(--ec,var(--gray));background:var(--surface);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:baseline}
.todo-item:hover{border-color:var(--gray);border-left-color:var(--ec)}
.todo-item{touch-action:none;cursor:grab;user-select:none}
.ghost{position:fixed;z-index:40;pointer-events:none;height:32px;border-radius:6px;background:var(--bc);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;padding:0 10px;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.28);opacity:.95}
.ghost small{font-weight:500;margin-left:6px;opacity:.9}
.track.dropzone{outline:2px dashed var(--orange);outline-offset:-2px}
.todo.dropzone{border-color:var(--orange);border-style:dashed;background:var(--orangebg)}
.todo-item small{color:var(--muted)}

/* Frise */
.zoom{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.zoom button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button[aria-pressed=true]{background:var(--orangebg);color:var(--orange)}
.zoom button:disabled{opacity:.4;cursor:not-allowed}
.gantt-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto;position:relative}
.gantt2{display:flex;min-width:max-content}
.labels{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line);flex:none;width:var(--labw)}
.lab{padding:0 12px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--soft);overflow:hidden}
.lab b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.lab small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab.head{height:48px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--line)}
.lab.chg{background:var(--soft);height:64px;border-bottom:0}
.lab.click{cursor:pointer}.lab.click:hover b{color:var(--orange)}
.track{position:relative;flex:none}
.thead{position:relative;height:48px;border-bottom:1px solid var(--line)}
.hc{position:absolute;font-size:11px;color:var(--muted);padding:3px 0 0 5px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;border-left:1px solid var(--grid);height:24px;line-height:1.5}
.hc.top{top:0;font-weight:600;color:var(--ink);font-size:12px;border-left-color:var(--line)}
.hc.bot{top:24px}
.hc.now{background:var(--alertbg);color:var(--today);font-weight:600}
.layer{position:absolute;left:0;right:0;top:48px;bottom:0;pointer-events:none}
.layer .ln{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.layer .ln.strong{background:var(--line)}
.layer .we{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--soft) 0 4px,transparent 4px 8px)}
.layer .now{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.6}
.trow{position:relative;border-bottom:1px solid var(--soft)}
.trow.drop{background:var(--orangebg)}
.bar{position:absolute;height:32px;border-radius:6px;background:var(--bc);color:#fff;font-size:13px;font-weight:600;padding:0 14px 0 9px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bar small{font-weight:500;opacity:.9}
.bar .seglab{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;pointer-events:none}
.bar.termine,.bar.solde{opacity:.45}
.bar .stico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.22);flex:none}
.bar .stico .ico{width:13px;height:13px;color:#fff}
.legend .ico{width:14px;height:14px;vertical-align:-2px;color:var(--muted)}
.bar.split{background:transparent;box-shadow:none}
.bar .sbg{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--bc)}
.bar.split.dragging{background:var(--bc)}
.bar.split.dragging .sbg{display:none}
.bar.dragging{-webkit-mask-image:none!important;mask-image:none!important;cursor:grabbing;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:5}
.bar .grip{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35))}
.bar.cut-l{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cut-r{border-top-right-radius:0;border-bottom-right-radius:0}
.bar.lift{z-index:6;opacity:.92}
.bar .addt{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);color:#1E2227;font-size:16px;font-weight:700;line-height:1;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s}
.bar:hover .addt,.bar .addt:focus-visible{opacity:1}
@media (hover:none){.bar .addt{opacity:.9}}
.bar.has-add{padding-right:40px}
.tpop{position:fixed;z-index:45;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px;width:min(320px,calc(100vw - 24px))}
.tpop h4{margin:0 0 4px;font-size:15px}
.tpop p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.tpop .techs{margin-bottom:10px}
.coutedit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;padding:8px 0;border-bottom:1px solid var(--soft)}
@media (max-width:620px){.coutedit{grid-template-columns:1fr 1fr}}
.bilan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.bilan div{display:flex;flex-direction:column;gap:2px;min-width:0}.bilan small{color:var(--muted);font-size:12px}.bilan b{font-size:15px}
@media (max-width:620px){.bilan{grid-template-columns:1fr 1fr}}
.marge{font-weight:700}.marge.bad{color:var(--alert)}.marge.mid{color:var(--warn)}.marge.good{color:var(--ok)}
.tpop{width:min(520px,calc(100vw - 24px))}
.dgrid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.dgrid{border-collapse:collapse;font-size:12px;width:100%}
.dgrid th,.dgrid td{padding:4px;text-align:center;border-bottom:1px solid var(--soft);white-space:nowrap}
.dgrid tbody th,.dgrid tfoot th{text-align:left;font-weight:600;padding-right:8px}
.dgrid thead th{color:var(--muted);font-weight:600}
.dgrid tfoot td,.dgrid tfoot th{color:var(--muted);border-bottom:0}
.dgrid button{width:28px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ok);font-weight:700;cursor:pointer}
.dgrid button[aria-pressed=true]{background:var(--okbg);border-color:var(--ok)}
.tpop .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tcharge{position:relative;height:64px;background:var(--soft)}
.ch{position:absolute;bottom:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 2px 4px;gap:2px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);overflow:hidden}
.ch i{display:block;width:100%;background:var(--ok);border-radius:3px 3px 0 0;min-height:2px}
.ch.mid i{background:var(--warn)}.ch.over i{background:var(--alert)}.ch.over{color:var(--alert);font-weight:600}
.occ{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;vertical-align:middle;margin-right:4px}
.occ i{display:block;height:100%;background:var(--ok)}.occ.over i{background:var(--alert)}
.techs{display:flex;flex-wrap:wrap;gap:6px}
.techs button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.techs button[aria-pressed=true]{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:21px;font-weight:600;margin-bottom:4px}
.ttable{display:grid;gap:8px}
.trowedit{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px auto;gap:8px;align-items:center}
@media (max-width:560px){.trowedit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.trowedit input{grid-column:1/-1}}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bc);flex:none}

/* Liste */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.panel h3{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0 0 12px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--soft);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--soft)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.num{text-align:right}
.gauge{display:flex;gap:8px;align-items:center;min-width:150px}
.gauge .bar2{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.gauge .bar2 i{display:block;height:100%;background:var(--ok)}
.gauge.mid .bar2 i{background:var(--warn)}.gauge.over .bar2 i{background:var(--alert)}.gauge.over{color:var(--alert);font-weight:600}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--soft);white-space:nowrap}
.chip.artik{background:var(--orangebg);color:var(--orange)}.chip.chassaing{background:var(--bluebg);color:var(--blue)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.ex{border:1px dashed var(--line);background:none;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}

/* Panneau latéral */
.overlay{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.sheet-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:1}
.sheet-head h2{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;line-height:1.1}
.sheet-body{padding:18px;display:grid;gap:18px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px}
legend{font-family:var(--f-display);font-size:18px;font-weight:600;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:8px}
legend::before{content:"";width:14px;height:3px;background:var(--orange)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{border-color:var(--sc,var(--orange));background:var(--sbg,var(--orangebg));color:var(--sc,var(--orange))}
.seg button.chas{--sc:var(--blue);--sbg:var(--bluebg)}
.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.recap div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.recap b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.recap span{font-size:12px;color:var(--muted)}
.err{color:var(--alert);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:6px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 40px;overflow:auto}
.gatecard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 26px;max-width:460px;width:100%;display:grid;gap:14px}
.gatecard h2{font-family:var(--f-display);font-size:30px;font-weight:700;margin:0;line-height:1.1}
.gatecard p{margin:0;color:var(--muted)}
.gatecard .btn{justify-self:start}
.whobox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.who{font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="brandline" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Artik &amp; Chassaing · Planning provisoire des chargés d'affaires</div>
      <h1>Chantiers</h1>
    </div>
    <span class="trial">Version d'essai</span>
  </header>
  <div id="banner" class="banner" hidden></div>

  <section class="stats" aria-label="Chiffres clés">
    <div class="stat" id="st-todo"><b id="s-todo">–</b><span>chantiers à planifier</span></div>
    <div class="stat"><b id="s-cours">–</b><span>chantiers en cours</span></div>
    <div class="stat"><b id="s-raf">–</b><span>reste à facturer HT</span></div>
    <div class="stat" id="st-charge"><b id="s-charge">–</b><span>charge des 4 prochaines semaines</span></div>
  </section>

  <div class="tabsrow">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" data-tab="planning" aria-selected="true">Planning</button>
      <button class="tab" role="tab" type="button" data-tab="liste" aria-selected="false">Suivi &amp; rentabilité</button>
      <button class="tab" role="tab" type="button" data-tab="params" aria-selected="false">Paramètres</button>
    </nav>
    <button class="btn primary" id="btn-new" type="button">+ Nouveau chantier</button>
  </div>

  <div class="filters">
    <select id="fl-chg" aria-label="Chargé d'affaires"><option value="">Tous les chargés d'affaires</option></select>
    <select id="fl-soc" aria-label="Société"><option value="">Toutes sociétés</option><option value="artik">Artik</option><option value="chassaing">Chassaing</option></select>
    <select id="fl-col" aria-label="Couleurs"><option value="societe">Couleur : société</option><option value="categorie">Couleur : catégorie</option><option value="charge">Couleur : chargé d'affaires</option></select>
    <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="fl-wk" checked> Week-ends</label>
    <label style="display:flex;gap:6px;align-items:center;font-size:14px" title="Sinon, les chantiers se calent à la journée entière"><input type="checkbox" id="fl-half"> Caler à la demi-journée</label>
    <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="fl-term"> Terminés</label>
  </div>
  <div class="filters" id="nav">
    <div class="zoom" id="mode" role="group" aria-label="Affichage"><button type="button" data-m="chantiers">Par chantier</button><button type="button" data-m="techniciens">Par technicien</button><button type="button" data-m="equipes">Par équipe</button></div>
    <div class="zoom" id="zoom" role="group" aria-label="Zoom"><button type="button" data-z="jour">Jour</button><button type="button" data-z="semaine">Semaine</button><button type="button" data-z="deux">2 semaines</button><button type="button" data-z="mois" title="Prévisionnel : vue par chantier, sans technicien">Mois</button><button type="button" data-z="six" title="Prévisionnel : vue par chantier, sans technicien">6 mois</button></div>
    <div class="nav">
      <button class="btn small" type="button" id="prev" aria-label="Période précédente">←</button>
      <span id="range"></span><span class="chip warn" id="prevchip" hidden title="Vue par chantier, sans technicien">Prévisionnel</span>
      <button class="btn small" type="button" id="next" aria-label="Période suivante">→</button>
      <button class="btn small" type="button" id="today">Aujourd'hui</button>
    </div>
  </div>

  <main id="view"></main>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =====================================================================
   RÉGLAGES DE LA VERSION EN LIGNE
   ===================================================================== */
const PCONFIG = {
  tenantId: "14b03bce-aec8-408e-9686-c43ea4a503d8",
  clientId: "f66f2711-d9e4-4fd3-be11-57367c333c87",
  site:     "root",
  liste:    "Planning chantiers"
};
/* Réglages de départ (repris de la version d'essai), utilisés seulement si la liste est vide */
const PSEED = {"capacite": 280, "charges": ["Dimitri", "Karim", "Alexis", "Guilhem"], "couts": [{"artik": 81, "chassaing": 97, "date": "2026-11-05"}], "equipes": [{"membres": [], "nom": "Équipe 1"}, {"membres": [], "nom": "Équipe 2"}], "journee": 8, "techniciens": [{"heures": 40, "nom": "Alexandre Vidal", "societe": "artik"}, {"heures": 40, "nom": "Samuel Montrozier", "societe": "artik"}, {"heures": 40, "nom": "Julien Escudie", "societe": "artik"}, {"heures": 35, "nom": "Noah Leduc", "societe": "artik"}, {"heures": 40, "nom": "Alexis Antoine", "societe": "chassaing"}, {"heures": 35, "nom": "Grégory Lucienne", "societe": "chassaing"}, {"heures": 35, "nom": "Romain Béziers", "societe": "chassaing"}, {"heures": 35, "nom": "Ayoub Madri", "societe": "chassaing"}, {"heures": 35, "nom": "Valentin Georgel", "societe": "chassaing"}, {"heures": 35, "nom": "Tamas Mihaly", "societe": "chassaing"}, {"heures": 35, "nom": "Titouan Bouzat", "societe": "chassaing"}, {"heures": 40, "nom": "Laurent Neiss", "societe": "chassaing"}, {"heures": 35, "nom": "Thierry Leroy", "societe": "chassaing"}, {"heures": 35, "nom": "Guillaume Blanes", "societe": "chassaing"}, {"heures": 35, "nom": "Michel Galabru", "societe": "chassaing"}]};
/* ===================================================================== */
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SCOPES=["User.Read","Sites.ReadWrite.All"],SCOPES_ADMIN=["Sites.Manage.All"];
let msalApp=null,account=null,siteId=null,listId=null;
const docs={},ids={};               // clé -> données, clé -> id d'élément SharePoint
const subsDoc={},subsCol={};        // abonnements de la page

/* ---------- écran d'accueil ---------- */
const gate=document.createElement("div");gate.id="gate";document.body.appendChild(gate);
function showGate(title,text,btn,fn){
  gate.innerHTML=`<div class="gatecard"><div class="eyebrow">Artik &amp; Chassaing</div><h2>${esc(title)}</h2><p>${text}</p>${btn?`<button class="btn primary" type="button" id="gate-btn">${esc(btn)}</button>`:""}</div>`;
  gate.hidden=false;if(btn)$("#gate-btn").addEventListener("click",fn);
}
function hideGate(){gate.hidden=true}

/* ---------- Microsoft ---------- */
async function token(scopes){
  try{return (await msalApp.acquireTokenSilent({scopes,account})).accessToken}
  catch(e){await msalApp.acquireTokenRedirect({scopes,account});throw new Error("redirect")}
}
async function gx(method,path,body,scopes){
  const t=await token(scopes||SCOPES);
  const r=await fetch(path.startsWith("http")?path:"https://graph.microsoft.com/v1.0"+path,{method,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((j.error&&j.error.message)||("Erreur "+r.status));e.status=r.status;e.code=r.status;throw e}
  return j;
}

/* ---------- liste SharePoint : une ligne par chantier + une ligne de paramètres ---------- */
async function openList(){
  const s=await gx("GET",(PCONFIG.site==="root"?"/sites/root":"/sites/"+PCONFIG.site)+"?$select=id");siteId=s.id;
  let url=`/sites/${siteId}/lists?$select=id,displayName&$top=200`,found=null;
  while(url&&!found){const r=await gx("GET",url);found=(r.value||[]).find(l=>l.displayName===PCONFIG.liste);url=r["@odata.nextLink"]}
  if(found){listId=found.id;return false}
  const l=await gx("POST",`/sites/${siteId}/lists`,{displayName:PCONFIG.liste,list:{template:"genericList"},columns:[{name:"Valeur",text:{allowMultipleLines:true,textType:"plain"}}]},SCOPES_ADMIN);
  listId=l.id;return true;
}
async function pull(){
  let u=`/sites/${siteId}/lists/${listId}/items?$expand=fields($select=Title,Valeur)&$top=500`;const seen=new Set();
  while(u){const r=await gx("GET",u);(r.value||[]).forEach(it=>{const k=it.fields&&it.fields.Title;if(!k)return;seen.add(k);ids[k]=it.id;try{docs[k]=JSON.parse(it.fields.Valeur||"{}")}catch(e){}});u=r["@odata.nextLink"]}
  Object.keys(docs).forEach(k=>{if(!seen.has(k)){delete docs[k];delete ids[k]}});
  notify();
}
async function write(k,v){
  const fields={Valeur:JSON.stringify(v)};
  if(ids[k])await gx("PATCH",`/sites/${siteId}/lists/${listId}/items/${ids[k]}/fields`,fields);
  else{const r=await gx("POST",`/sites/${siteId}/lists/${listId}/items`,{fields:{Title:k,...fields}});ids[k]=r.id}
}
async function remove(k){if(ids[k])await gx("DELETE",`/sites/${siteId}/lists/${listId}/items/${ids[k]}`);delete ids[k];delete docs[k]}

/* ---------- même interface que la base de la version d'essai ---------- */
function notify(){
  Object.keys(subsDoc).forEach(k=>subsDoc[k].forEach(cb=>cb({exists:k in docs,data:()=>docs[k]})));
  Object.keys(subsCol).forEach(c=>{const list=Object.keys(docs).filter(k=>k.startsWith(c+"/")).map(k=>({id:k.slice(c.length+1),data:()=>docs[k]}));subsCol[c].forEach(cb=>cb({docs:list,metadata:{fromCache:false}}))});
}
function docApi(k){return {
  onSnapshot(cb){(subsDoc[k]=subsDoc[k]||[]).push(cb);cb({exists:k in docs,data:()=>docs[k]});return()=>{}},
  async set(v){const old=docs[k];docs[k]=JSON.parse(JSON.stringify(v));notify();try{await write(k,docs[k])}catch(e){docs[k]=old;notify();throw e}},
  async update(p){const old=docs[k];docs[k]={...(old||{}),...JSON.parse(JSON.stringify(p))};notify();try{await write(k,docs[k])}catch(e){docs[k]=old;notify();throw e}},
  async delete(){const old=docs[k];delete docs[k];notify();try{await remove(k)}catch(e){docs[k]=old;notify();throw e}}
}}
const db={
  doc:p=>docApi(p),
  collection:c=>({doc:id=>docApi(c+"/"+id),onSnapshot(cb){(subsCol[c]=subsCol[c]||[]).push(cb);notify();return()=>{}}})
};

/* ---------- démarrage ---------- */
let ready=null;
window.__planDB=()=>ready;
ready=(async()=>{
  if(!window.msal){showGate("Connexion impossible","Le module de connexion Microsoft n'a pas pu se charger. Rechargez la page.");return new Promise(()=>{})}
  msalApp=new msal.PublicClientApplication({auth:{clientId:PCONFIG.clientId,authority:"https://login.microsoftonline.com/"+PCONFIG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
  let res=null;
  try{res=await msalApp.handleRedirectPromise()}catch(e){showGate("Connexion refusée",esc(e.message),"Réessayer",()=>msalApp.loginRedirect({scopes:SCOPES}));return new Promise(()=>{})}
  account=(res&&res.account)||msalApp.getAllAccounts()[0]||null;
  if(!account){showGate("Planning chantiers","Connectez-vous avec votre compte Microsoft de l'entreprise.","Se connecter",()=>msalApp.loginRedirect({scopes:SCOPES}));return new Promise(()=>{})}
  showGate("Chargement…","Lecture du planning partagé.");
  try{
    const created=await openList();
    await pull();
    if(created||!("config/reglages" in docs)){await db.doc("config/reglages").set(PSEED)}
  }catch(e){
    if(e.message==="redirect")return new Promise(()=>{});
    if(e.status===403||e.status===401)showGate("Accès non autorisé",`Le compte <b>${esc(account.username)}</b> n'a pas accès au planning. Demandez à Dimitri de l'ajouter.`,"Changer de compte",()=>msalApp.logoutRedirect({account}));
    else showGate("Planning illisible",esc(e.message),"Réessayer",()=>location.reload());
    return new Promise(()=>{});
  }
  const top=$(".top");
  if(top){const tr=top.querySelector(".trial");if(tr)tr.remove();
    top.insertAdjacentHTML("beforeend",`<div class="whobox"><span class="who">${esc(account.name||account.username)}</span><button class="btn small" type="button" id="p-sync">Actualiser</button><button class="btn small" type="button" id="p-out">Se déconnecter</button></div>`);
    $("#p-sync").addEventListener("click",async()=>{try{await pull()}catch(e){}});
    $("#p-out").addEventListener("click",()=>msalApp.logoutRedirect({account}));}
  /* les modifications des collègues arrivent toutes les minutes et au retour sur l'onglet */
  const refresh=async()=>{if(document.hidden||document.querySelector(".bar.dragging")||!$("#overlay").hidden)return;try{await pull()}catch(e){}};
  setInterval(refresh,60000);document.addEventListener("visibilitychange",refresh);
  hideGate();
  return db;
})();
})();
</script>
<script>
(function(){
const ST={aplanifier:"À planifier",planifie:"Planifié",encours:"En cours",termine:"Terminé",solde:"Soldé"};
const CATS=["Froid","Clim / PAC (CVC)","Cuisine pro","Boulangerie"];
/* anciennes catégories ramenées aux 4 métiers */
function catIdx(c){const n=String(c||"").toLowerCase();if(!n)return -1;if(n.includes("froid"))return 0;if(/clim|cvc|pac|chauf/.test(n))return 1;if(/cuisine|chr/.test(n))return 2;if(n.includes("boulang"))return 3;return -1}
function catName(c){const i=catIdx(c);return i<0?(c||""):CATS[i]}
const ICO={
 planifie:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
 encours:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3.6 17.1a1.6 1.6 0 0 0 2.3 2.3l5.7-5.7a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.3-.4-.4-2.3z" fill="currentColor"/></svg>',
 termine:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
ICO.solde=ICO.termine;
const DEF={charges:["Dimitri","Karim","Alexis","Guilhem"],capacite:280,techniciens:[],journee:8,couts:[]};
/* ---------- coûts horaires et rentabilité ---------- */
/* cfg.couts = [{date:"2026-11-01",artik:38,chassaing:40}, …] : le taux en vigueur à une date est la dernière ligne dont la date est passée */
function coutAt(soc,date){const l=(cfg.couts||[]).filter(c=>c.date&&(!date||c.date<=date)).sort((a,b)=>a.date.localeCompare(b.date));const c=l[l.length-1]||(cfg.couts||[]).slice().sort((a,b)=>a.date.localeCompare(b.date))[0];return c?Number(c[soc])||0:0}
function socOf(nom){const t=techList().find(z=>z.nom===nom);return t?t.societe:null}
/* part des heures par société, d'après les techniciens prévus jour par jour */
function partsSoc(x){const n=Math.ceil(slotsOf(x)/2),t=x.techs||[],p={artik:0,chassaing:0};let tot=0;
  t.forEach(z=>{const so=socOf(z)||x.societe||"artik",off=offDays(x,z);for(let i=0;i<n;i++)if(!off.has(i)){p[so]=(p[so]||0)+1;tot++}});
  if(!tot){p[x.societe==="chassaing"?"chassaing":"artik"]=1;tot=1}
  return {artik:p.artik/tot,chassaing:p.chassaing/tot}}
function bilan(x){const h=Number(x.heuresPassees)||0,d=x.debut||ymd(new Date()),pa=partsSoc(x);
  const hA=h*pa.artik,hC=h*pa.chassaing,mo=hA*coutAt("artik",d)+hC*coutAt("chassaing",d),ach=Number(x.achats)||0,v=Number(x.montant)||0;
  const pret=x.societe==="chassaing"?hA:hC;
  return {mo,ach,v,marge:v-mo-ach,pc:v?(v-mo-ach)/v*100:null,pret,pretSoc:x.societe==="chassaing"?"Artik":"Chassaing",ok:!!(cfg.couts||[]).length}}
/* Unité de travail : la demi-journée ouvrée (10 par semaine). Les week-ends sont affichés mais pas comptés. */
const REF0=new Date(2024,0,1); /* lundi de référence */
const ZOOMS={jour:{snap:1,fit:true},semaine:{snap:1,fit:true},deux:{snap:2,fit:true},mois:{snap:2,fit:true},six:{snap:2,fit:true}};
let db=null, items=[], cfg={...DEF}, loaded=false, tab="planning", zoom="semaine", mode="chantiers", viewDate=new Date(), G=null;
const $=s=>document.querySelector(s);
function ls(k,v){try{if(v===undefined)return localStorage.getItem("ch-"+k);localStorage.setItem("ch-"+k,v)}catch(e){return null}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t,bad){const el=$("#toast");el.textContent=t;el.style.background=bad?"var(--alert)":"var(--ok)";el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function banner(t){$("#banner").textContent=t||"";$("#banner").hidden=!t}
const p2=x=>String(x).padStart(2,"0");
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function parse(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function day0(d){d=new Date(d);d.setHours(0,0,0,0);return d}
function monday(d){d=day0(d);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function addW(d,n){return addD(d,7*n)}
function wdiff(a,b){return Math.round((monday(b)-monday(a))/(7*864e5))}
function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function fd(d){return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})}
const JOURS=["lun","mar","mer","jeu","ven","sam","dim"];
function isWE(d){return d.getDay()===0||d.getDay()===6}
function eur(n){return (Number(n)||0).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €"}
function jours(sl){return (sl/2).toLocaleString("fr-FR")+" j"}
/* conversions date <-> demi-journée ouvrée */
function slotOf(dateStr,pm){const d=parse(dateStr);const w=wdiff(REF0,d);const day=Math.min((d.getDay()+6)%7,4);return w*10+day*2+(pm?1:0)}
function fromSlot(i){const w=Math.floor(i/10),r=((i%10)+10)%10;return {debut:ymd(addD(addW(REF0,w),Math.floor(r/2))),pm:r%2===1}}
/* jours où un technicien n'est PAS sur le chantier : x.off = {Noah:[1,3]} (index du jour, 0 = 1er jour du chantier) */
function offDays(x,t){return new Set(((x.off||{})[t])||[])}
function dayIdx(x,ws){return Math.floor((ws-slotOf(x.debut,x.pm))/2)}
function onDay(x,t,ws){return !offDays(x,t).has(dayIdx(x,ws))}
function presentAt(x,ws){const t=x.techs||[];return t.filter(z=>onDay(x,z,ws)).length}
function slotsOf(x){return Number(x.slots)||(x.duree?Number(x.duree)*10:2)}
function techList(){return (cfg.techniciens||[]).map(t=>typeof t==="string"?{nom:t,heures:35,societe:"artik"}:{nom:t.nom,heures:Number(t.heures)||35,societe:t.societe==="chassaing"?"chassaing":"artik"})}
function techsVisible(){const sc=$("#fl-soc").value;return techList().filter(t=>!sc||t.societe===sc)}
function equipeList(){const tl=techList();return (cfg.equipes||[]).map(e=>{const m=(e.membres||[]).filter(n=>tl.some(t=>t.nom===n));const mt=tl.filter(t=>m.includes(t.nom));
  const soc=mt.length&&mt.every(t=>t.societe==="chassaing")?"chassaing":mt.length&&mt.every(t=>t.societe==="artik")?"artik":"mixte";
  return {nom:e.nom,membres:m,heures:mt.reduce((a,b)=>a+b.heures,0),societe:soc}})}
function equipesVisible(){const sc=$("#fl-soc").value;return equipeList().filter(e=>!sc||e.societe===sc||e.societe==="mixte")}
function equipeOf(nom){const e=equipeList().find(e=>e.membres.includes(nom));return e?e.nom:""}
function teamHours(){const t=techsVisible();return techList().length?t.reduce((a,b)=>a+b.heures,0):(cfg.capacite||DEF.capacite)}
/* couleurs */
/* chargés d'affaires : couleurs des métiers Artik */
const CHG_COL={dimitri:"var(--cat1)",alexis:"var(--cat3)",guilhem:"var(--cat2)",karim:"var(--cat4)"};
function chgColor(n){const k=String(n||"").trim().toLowerCase().split(/\s+/)[0];if(CHG_COL[k])return CHG_COL[k];const i=cfg.charges.indexOf(n);return i<0?"var(--gray)":`var(--p${i%6+1})`}
function colorOf(x){
  const m=$("#fl-col").value;
  if(m==="categorie"){const i=catIdx(x.categorie);return `var(--cat${i<0?5:i+1})`}
  if(m==="charge")return chgColor(x.charge);
  return x.societe==="chassaing"?"var(--blue)":"var(--orange)";
}
function legendColors(){
  const m=$("#fl-col").value;
  if(m==="categorie")return CATS.map((c,i)=>`<span><i style="background:var(--cat${i+1})"></i>${c}</span>`).join("");
  if(m==="charge")return cfg.charges.map(c=>`<span><i style="background:${chgColor(c)}"></i>${esc(c)}</span>`).join("");
  return `<span><i style="background:var(--orange)"></i>Artik</span><span><i style="background:var(--blue)"></i>Chassaing</span>`;
}

const ev=n=>((n%2)+2)%2===0;
function snapNow(){return zoom==="jour"||$("#fl-half").checked?1:2}
function filtered(){const c=$("#fl-chg").value,s=$("#fl-soc").value;return items.filter(x=>(!c||x.charge===c)&&(!s||x.societe===s))}

/* ---------- Construction de la grille (cases demi-journées, largeurs variables) ---------- */
function labW(){return window.innerWidth<600?140:210}
function buildGrid(){
  const showWE=$("#fl-wk").checked&&zoom!=="six";
  let start,days;
  if(zoom==="jour"){let d=day0(viewDate);if(!showWE&&isWE(d))d=addD(monday(d),7);start=d;days=1}
  else if(zoom==="semaine"){start=monday(viewDate);days=7}
  else if(zoom==="deux"){start=monday(viewDate);days=14}
  else if(zoom==="mois"){start=monday(viewDate);days=35}
  else{start=addW(monday(viewDate),-2);days=26*7}
  const avail=Math.max(320,($("#view").clientWidth||900)-labW()-2);
  let nW=0,nE=0;for(let i=0;i<days;i++){isWE(addD(start,i))?nE++:nW++}
  const k=showWE?(zoom==="mois"?0.25:0.3):0;
  const minW={jour:120,semaine:30,deux:16,mois:8,six:1.2}[zoom];
  let ws=Math.max(minW,avail/(nW*2+nE*2*k));
  if(zoom==="jour"&&isWE(start))ws=Math.max(minW,avail/2);
  const cells=[];let x=0;
  for(let i=0;i<days;i++){const d=addD(start,i),we=isWE(d);
    if(we&&!showWE&&zoom!=="jour")continue;
    for(const pm of [false,true]){const w=we&&zoom!=="jour"?ws*k:ws;
      cells.push({d,pm,we,ws:we?null:slotOf(ymd(d),pm),x,w});x+=w}}
  const work=cells.filter(c=>c.ws!==null);
  return {start,days,cells,work,total:x,ws,s0:work.length?work[0].ws:0,s1:work.length?work[work.length-1].ws:-1};
}
function cellByWs(g,ws){if(ws<g.s0||ws>g.s1)return null;return g.work[ws-g.s0]}
function spanX(g,s,len){
  const e=s+len-1;if(e<g.s0||s>g.s1)return null;
  const a=cellByWs(g,Math.max(s,g.s0)),b=cellByWs(g,Math.min(e,g.s1));
  return {left:a.x,width:b.x+b.w-a.x,cutL:s<g.s0,cutR:e>g.s1};
}
function cellAtX(g,x){let c=g.cells[0];for(const z of g.cells){if(z.x<=x)c=z;else break}return c}
function workAtX(g,x,dir){
  const c=cellAtX(g,x);if(c.ws!==null)return c.ws;
  const i=g.cells.indexOf(c);
  if(dir>=0){for(let j=i;j<g.cells.length;j++)if(g.cells[j].ws!==null)return g.cells[j].ws}
  for(let j=i;j>=0;j--)if(g.cells[j].ws!==null)return g.cells[j].ws;
  return g.s0;
}

function headerHTML(g){
  const now=new Date(),nd=ymd(now),npm=now.getHours()>=12;let top="",bot="",layer="";
  const daysSeen=[];
  g.cells.forEach((c,i)=>{if(!c.pm)daysSeen.push(i)});
  if(zoom==="six"){
    for(let w=0;w<g.days/7;w++){const d=addW(g.start,w);const cs=g.cells.filter(c=>c.d>=d&&c.d<addW(d,1));if(!cs.length)continue;
      const x=cs[0].x,wd=cs[cs.length-1].x+cs[cs.length-1].w-x,cur=monday(now).getTime()===d.getTime();
      const first=d.getDate()<=7;
      if(first||w===0)top+=`<div class="hc top" style="left:${x}px;width:${Math.max(60,wd*4)}px;border-left-color:var(--line)">${d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</div>`;
      bot+=`<div class="hc bot${cur?" now":""}" style="left:${x}px;width:${wd}px" title="S${weekNo(d)} · ${fd(d)}">${wd>26?weekNo(d):""}</div>`;
      layer+=`<div class="ln${first?" strong":""}" style="left:${x}px"></div>`}
  }else{

      if(zoom==="jour"){
        top+=`<div class="hc top${cur?" now":""}" style="left:0;width:${g.total}px">${d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} · S${weekNo(d)}</div>`;
        bot+=`<div class="hc bot${cur&&!npm?" now":""}" style="left:${c.x}px;width:${c.w}px">Matin</div><div class="hc bot${cur&&npm?" now":""}" style="left:${c2.x}px;width:${c2.w}px">Après-midi</div>`;
        layer+=`<div class="ln" style="left:${c2.x}px"></div>`;
      }else if(zoom==="semaine"){
        top+=`<div class="hc top${cur?" now":""}" style="left:${x}px;width:${wd}px">${c.we?JOURS[(d.getDay()+6)%7].slice(0,2):JOURS[(d.getDay()+6)%7]+" "+d.getDate()+" "+d.toLocaleDateString("fr-FR",{month:"short"})}</div>`;
        if(!c.we)bot+=`<div class="hc bot${cur&&!npm?" now":""}" style="left:${c.x}px;width:${c.w}px">matin</div><div class="hc bot${cur&&npm?" now":""}" style="left:${c2.x}px;width:${c2.w}px">a.-midi</div>`;
        layer+=`<div class="ln strong" style="left:${x}px"></div>`+(c.we?"":`<div class="ln" style="left:${c2.x}px"></div>`);
      }else{
        if(monday1)top+=`<div class="hc top" style="left:${x}px;width:${wd*5}px">S${weekNo(d)} · ${fd(d)}</div>`;
        bot+=`<div class="hc bot${cur?" now":""}" style="left:${x}px;width:${wd}px">${c.we?"":zoom==="deux"&&wd>70?JOURS[(d.getDay()+6)%7]+" "+d.getDate():(wd>30?JOURS[(d.getDay()+6)%7].slice(0,2)+" ":"")+d.getDate()}</div>`;
        layer+=`<div class="ln${monday1?" strong":""}" style="left:${x}px"></div>`;
      }
      if(c.we&&zoom!=="jour")layer+=`<div class="we" style="left:${x}px;width:${wd}px"></div>`;
    });
  }
  const nc=g.cells.find(c=>ymd(c.d)===nd&&c.pm===npm);
  if(nc&&zoom!=="jour")layer+=`<div class="now" style="left:${nc.x+nc.w/2}px"></div>`;
  return {head:top+bot,layer};
}
/* masque qui « coupe » la barre sur les week-ends : le chantier n'occupe que les jours ouvrés */
function weMask(g,sp,x,tech){
  const R=sp.left+sp.width,gaps=[];let cur=null;
  const hide=c=>c.we||(tech&&x&&c.ws!==null&&!onDay(x,tech,c.ws));
  g.cells.forEach(c=>{if(hide(c)&&c.x>=sp.left-0.5&&c.x+c.w<=R+0.5){if(cur&&Math.abs(cur.b-c.x)<1)cur.b=c.x+c.w;else gaps.push(cur={a:c.x,b:c.x+c.w})}});
  if(!gaps.length)return"";
  if(x&&x.__gaps)x.__gaps.push(...gaps);
  const st=[];gaps.forEach(q=>{const a=q.a<=sp.left+1?0:q.a-sp.left+2,b=q.b>=R-1?sp.width+10:q.b-sp.left-2;st.push(`#000 ${a}px`,`transparent ${a}px`,`transparent ${b}px`,`#000 ${b}px`)});
  const m=`linear-gradient(90deg,#000 0,${st.join(",")},#000 100%)`;
  return `-webkit-mask-image:${m};mask-image:${m};`;
}

  const box={__gaps:[]},mask=weMask(g,sp,Object.assign(Object.create(x),box),mode==="techniciens"?tech:"");
  const segs=[];let a=0;box.__gaps.sort((p,q)=>p.a-q.a).forEach(q=>{const ga=q.a-sp.left,gb=q.b-sp.left;if(ga>a)segs.push({a,b:ga});a=gb});if(sp.width>a)segs.push({a,b:sp.width});
  const vis=segs.filter(z=>z.b-z.a>4),last=vis[vis.length-1]||{a:0,b:sp.width},canAdd=techList().length&&last.b-last.a>40;

  const txt=split?vis.map((z,i)=>`<span class="sbg" style="left:${z.a}px;width:${z.b-z.a-(z.b>=sp.width?2:0)}px;${i===0&&sp.cutL?"border-top-left-radius:0;border-bottom-left-radius:0;":""}${z===last&&sp.cutR?"border-top-right-radius:0;border-bottom-right-radius:0;":""}"></span><span class="seglab" style="left:${z.a+9}px;width:${Math.max(0,z.b-z.a-(z===last&&canAdd?44:14))}px">${z.b-z.a>60?dot:""}${label(z.b-z.a)}</span>`).join(""):dot+label(sp.width);
  const add=canAdd?`<span class="addt" data-add="1" role="button" tabindex="0" title="Ajouter ou retirer des techniciens" style="${split?`right:auto;left:${last.b-34}px`:""}">+</span>`:"";

let tpop=null;

function dayGrid(x,sel){
  if(!x.debut||!sel.length)return"";
  const s0=slotOf(x.debut,x.pm),n=Math.min(30,Math.ceil(slotsOf(x)/2));if(n<2)return"";

  <tfoot><tr><th>Sur place</th>${days.map(d=>`<td>${sel.filter(t=>!offDays(x,t).has(d.i)).length}</td>`).join("")}</tr></tfoot></table></div>

}

    el.innerHTML=`<h4>${esc(cur.client)}</h4><p>Cliquez sur un technicien pour l'ajouter ou le retirer. Le chantier apparaît sur la ligne de chacun, ses heures sont réparties entre eux.</p>
    <div class="techs">${techList().map(t=>`<button type="button" data-t="${esc(t.nom)}" aria-pressed="${sel.includes(t.nom)}"><span class="sw" style="--bc:var(--${t.societe==="chassaing"?"blue":"orange"});margin-right:6px"></span>${esc(t.nom)}</button>`).join("")}</div>
    ${dayGrid(cur,sel)}
    <div class="row"><small class="hint" style="margin:0">${sel.length} technicien${sel.length>1?"s":""}</small><button class="btn small" type="button" data-pclose>Fermer</button></div>`};
  draw();
  const r=anchor.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=Math.max(12,Math.min(r.left-w/2,innerWidth-w-12))+"px";
  el.style.top=(r.bottom+8+h>innerHeight?Math.max(12,r.top-h-8):r.bottom+8)+"px";
  el.addEventListener("click",async e=>{
    if(e.target.closest("[data-pclose]")){closeTechPop();return}
    const cur=items.find(i=>i.id===id)||x;

    if(dd){const n=dd.dataset.tt,i=Number(dd.dataset.d),off={...(cur.off||{})},set=new Set(off[n]||[]);
      const wasOn=!set.has(i);wasOn?set.add(i):set.delete(i);
      if(set.size)off[n]=[...set].sort((a,b)=>a-b);else delete off[n];
      cur.off=off;draw();
      await save(id,{off},n+(wasOn?" absent ":" présent ")+"le "+dd.dataset.lab);render();return}
    const b=e.target.closest("[data-t]");if(!b)return;
    const t=(cur.techs||[]).slice(),n=b.dataset.t,on=t.includes(n);
    const nt=on?t.filter(z=>z!==n):t.concat(n),patch={techs:nt};
    if(on&&cur.off&&cur.off[n]){const off={...cur.off};delete off[n];patch.off=off;cur.off=off}
    b.setAttribute("aria-pressed",!on);
    await save(id,patch,on?n+" retiré de "+cur.client:n+" ajouté sur "+cur.client);
    cur.techs=nt;render();if(tpop)draw();
  });
}

/* ---------- glisser-déposer ---------- */
let drag=null;
document.addEventListener("pointerdown",e=>{
  const bar=e.target.closest(".bar");if(!bar||!db||!G)return;
  if(e.target.closest("[data-add]")){e.preventDefault();openTechPop(bar.dataset.id,e.target.closest("[data-add]"));return}
  const x=items.find(i=>i.id===bar.dataset.id);if(!x)return;
  drag={bar,x,startX:e.clientX,startY:e.clientY,src:bar.dataset.tech||"",mode:e.target.dataset.grip?"resize":"move",left:parseFloat(bar.style.left),width:parseFloat(bar.style.width),moved:false,ds:0,len:slotsOf(x),target:null};
  bar.setPointerCapture(e.pointerId);bar.classList.add("dragging");e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;const g=G,snap=snapNow(),dx=e.clientX-drag.startX;
  if(Math.abs(dx)>4)drag.moved=true;
  const s=slotOf(drag.x.debut,drag.x.pm);
  if(drag.mode==="move"){
    const els=document.elementsFromPoint(e.clientX,e.clientY),todo=els.find(el=>el.classList&&el.classList.contains("todo"));
    const tz=document.querySelector(".todo");if(tz)tz.classList.toggle("dropzone",!!todo);
    drag.toTodo=!!todo;if(Math.abs(e.clientY-drag.startY)>4)drag.moved=true;
    const wrap=document.querySelector(".gantt-wrap").getBoundingClientRect(),outside=e.clientY<wrap.top||e.clientY>wrap.bottom;
    if(outside){if(!drag.ghost){const gh=document.createElement("div");gh.className="ghost";gh.style.setProperty("--bc",colorOf(drag.x));gh.innerHTML=esc(drag.x.client)+"<small></small>";document.body.appendChild(gh);drag.ghost=gh}
      drag.ghost.style.left=(e.clientX+8)+"px";drag.ghost.style.top=(e.clientY-16)+"px";drag.ghost.querySelector("small").textContent=todo?"retirer du planning":"";drag.bar.style.opacity=".3"}
    else if(drag.ghost){drag.ghost.remove();drag.ghost=null;drag.bar.style.opacity=""}
    const firstVis=Math.max(s,g.s0),cell=cellByWs(g,firstVis);
    let ns=s+workAtX(g,cell.x+cell.w/2+dx,dx)-firstVis;if(snap===2&&!ev(ns))ns-=1;const ds=ns-s;drag.ds=ds;
    const sp=spanX(g,s+ds,drag.len);if(sp){drag.bar.style.left=sp.left+"px";drag.bar.style.width=Math.max(sp.width-2,5)+"px"}
    if(mode!=="chantiers"){const dy=e.clientY-drag.startY;if(Math.abs(dy)>4)drag.moved=true;drag.bar.style.transform=`translateY(${dy}px)`;drag.bar.classList.add("lift");
      document.querySelectorAll(".trow.drop").forEach(r=>r.classList.remove("drop"));
      const row=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el.classList&&el.classList.contains("trow")&&el.hasAttribute("data-tech"));
      drag.target=row?row.getAttribute("data-tech"):null;if(row&&drag.target!==drag.src)row.classList.add("drop");
      drag.copy=mode==="techniciens"&&(e.ctrlKey||e.altKey||e.metaKey);drag.bar.classList.toggle("copying",!!drag.copy)}
  }else{
    const rightX=drag.left+drag.width+dx;
    let e2=workAtX(g,Math.max(0,rightX-1),-1);if(snap===2&&ev(e2))e2+=1;let len=Math.max(snap===2?(ev(s)?2:1):1,e2-s+1);drag.ds=len-drag.len;
    const sp=spanX(g,s,len);if(sp)drag.bar.style.width=Math.max(sp.width-2,5)+"px";
  }
});
document.addEventListener("pointerup",async()=>{
  if(!drag)return;const d=drag;drag=null;d.bar.classList.remove("dragging");
  document.querySelectorAll(".trow.drop,.todo.dropzone").forEach(r=>r.classList.remove("drop","dropzone"));
  if(d.ghost)d.ghost.remove();
  if(!d.moved){openSheet(d.x.id);return}
  if(d.toTodo){await save(d.x.id,{debut:"",statut:"aplanifier"},d.x.client+" remis dans « À planifier »");render();return}
  const retech=mode!=="chantiers"&&d.mode==="move"&&d.target!==null&&d.target!==d.src;
  if(!d.ds&&!retech){render();return}
  if(d.mode==="move"){const patch={},msg=[];
    if(d.ds){const p=fromSlot(slotOf(d.x.debut,d.x.pm)+d.ds);patch.debut=p.debut;patch.pm=p.pm;patch.slots=d.len;msg.push("déplacé au "+fd(parse(p.debut))+(p.pm?" après-midi":""))}
    if(retech&&mode==="techniciens"){let t=(d.x.techs||[]).filter(z=>d.copy&&d.src?true:z!==d.src);if(d.target&&!t.includes(d.target))t.push(d.target);patch.techs=t;msg.push(d.copy&&d.target?d.target+" ajouté (avec "+(d.x.techs||[]).join(", ")+")":d.target?"affecté à "+d.target:"retiré de "+d.src)}
    if(retech&&mode==="equipes"){const eq=equipeList(),old=eq.find(e=>e.nom===d.x.equipe),nw=eq.find(e=>e.nom===d.target);
      let t=(d.x.techs||[]).filter(z=>!old||!old.membres.includes(z));if(nw)nw.membres.forEach(m=>{if(!t.includes(m))t.push(m)});
      patch.techs=t;patch.equipe=d.target||"";msg.push(d.target?"confié à "+d.target:"retiré de "+d.src)}
    await save(d.x.id,patch,"Chantier "+msg.join(" et "));
  }else await save(d.x.id,{slots:d.len+d.ds},"Durée : "+jours(d.len+d.ds));
  render();
});

  if(!pick)return;

    pick.drop={ws,row:row?row.getAttribute("data-tech"):null};

    const p=fromSlot(ws);pick.ghost.querySelector("small").textContent=`${fd(parse(p.debut))}${snapNow()===2?"":p.pm?" a.-midi":" matin"}${row&&row.getAttribute("data-tech")?" · "+row.getAttribute("data-tech"):""}`;
  }else pick.ghost.querySelector("small").textContent=jours(slotsOf(pick.x));

document.addEventListener("pointerup",async()=>{
  if(!pick)return;const p=pick;pick=null;
  document.querySelectorAll(".dropzone,.trow.drop").forEach(el=>el.classList.remove("dropzone","drop"));
  if(p.ghost)p.ghost.remove();
  if(!p.moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,50);
  if(!p.drop){toast("Déposez le chantier sur le planning pour le caler",true);return}
  const pos=fromSlot(p.drop.ws),patch={debut:pos.debut,pm:pos.pm,statut:"planifie",slots:slotsOf(p.x)};
  let who="";
  if(p.drop.row&&mode==="techniciens"){const t=(p.x.techs||[]).slice();if(!t.includes(p.drop.row))t.push(p.drop.row);patch.techs=t;who=" · "+p.drop.row}
  if(p.drop.row&&mode==="equipes"){const nw=equipeList().find(q=>q.nom===p.drop.row);const t=(p.x.techs||[]).slice();if(nw)nw.membres.forEach(m=>{if(!t.includes(m))t.push(m)});patch.techs=t;patch.equipe=p.drop.row;who=" · "+p.drop.row}
  await save(p.x.id,patch,"Planifié le "+fd(parse(pos.debut))+(pos.pm?" après-midi":"")+who);
  render();
});

  eb.addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(m){m.setAttribute("aria-pressed",m.getAttribute("aria-pressed")!=="true");return}
    if(e.target.closest("[data-edel]"))e.target.closest(".eqedit").remove()});
  $("#r-eqadd").addEventListener("click",()=>{eb.insertAdjacentHTML("beforeend",eqRow({nom:"",membres:[]},eb.children.length,techList()));eb.lastElementChild.querySelector("input").focus()});
  const readEqs=()=>[...eb.querySelectorAll(".eqedit")].map(r=>({nom:r.querySelector("input").value.trim(),membres:[...r.querySelectorAll("[data-m][aria-pressed=true]")].map(b=>b.dataset.m)})).filter(e=>e.nom);
  s.addEventListener("click",async()=>{
    const c={couts:readCouts(),journee:Number($("#r-jour").value)||8,equipes:readEqs(),charges:$("#r-chg").value.split(",").map(x=>x.trim()).filter(Boolean),techniciens:readTechs(),capacite:$("#r-cap")?Number($("#r-cap").value)||DEF.capacite:cfg.capacite};
    try{await db.doc("config/reglages").set(c);toast("Paramètres enregistrés")}catch(e){toast("Enregistrement impossible ("+(e.code||e.message)+")",true)}
  });
  const ex=$("#r-ex");if(ex){let armed=false;ex.addEventListener("click",async()=>{
    if(!armed){armed=true;ex.textContent="Confirmer : effacer les exemples";return}
    ex.disabled=true;for(const x of items.filter(i=>i.exemple)){try{await db.doc("chantiers/"+x.id).delete()}catch(e){}}toast("Exemples effacés")})}
}

/* ---------- Fiche ---------- */
function close(){$("#overlay").hidden=true;$("#overlay").innerHTML="";render()}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#overlay").hidden)close()});
function seg(id,opts,val){return `<div class="seg" id="${id}">${opts.map(o=>`<button type="button" data-v="${esc(o[0])}" aria-pressed="${o[0]===val}" class="${o[2]||""}">${esc(o[1])}</button>`).join("")}</div>`}
function segVal(id){const b=document.querySelector(`#${id} [aria-pressed=true]`);return b?b.dataset.v:""}
function openSheet(id){
  const x=id?items.find(i=>i.id===id):{statut:"aplanifier",slots:2};if(!x)return;
  const raf=Math.max(0,(Number(x.montant)||0)-(Number(x.facture)||0)),techs=techList();
  const o=$("#overlay");
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="sheet-head"><h2 id="sh">${id?esc(x.client):"Nouveau chantier"}</h2><button class="btn small" type="button" data-close>Fermer</button></div>
  <div class="sheet-body">
    ${id?`<div class="recap"><div><b>${eur(x.montant)}</b><span>vendu HT</span></div><div><b>${eur(raf)}</b><span>reste à facturer</span></div><div><b>${x.heures?Math.round((Number(x.heuresPassees)||0)/x.heures*100)+" %":"–"}</b><span>des heures consommées</span></div></div>`:""}
    <fieldset><legend>Chantier</legend>
      <label class="field"><span>Client / chantier</span><input type="text" id="c-client" value="${esc(x.client)}"></label>
      ${seg("c-soc",[["artik","Artik"],["chassaing","Chassaing Technologies","chas"]],x.societe||"artik")}
      <div class="field"><span>Catégorie</span>${seg("c-cat",CATS.map(c=>[c,c]),catIdx(x.categorie)<0?"":CATS[catIdx(x.categorie)])}</div>
      <div class="grid2">
        <label class="field"><span>Chargé d'affaires</span><select id="c-chg"><option value="">—</option>${cfg.charges.map(n=>`<option${n===x.charge?" selected":""}>${esc(n)}</option>`).join("")}</select></label>
        <label class="field"><span>Montant vendu HT (€)</span><input type="number" id="c-mt" min="0" value="${esc(x.montant??"")}"></label>
        <label class="field"><span>Heures vendues</span><input type="number" id="c-h" min="0" value="${esc(x.heures??"")}"></label>
      </div>
      ${equipeList().length?`<div class="field"><span>Équipe</span>${seg("c-eq",[["","Aucune"],...equipeList().map(e=>[e.nom,e.nom+" ("+e.membres.length+")"])],x.equipe||"")}</div>`:""}
      <div class="field"><span>Techniciens affectés</span>${techs.length?`<div class="techs" id="c-techs">${techs.map(t=>`<button type="button" data-t="${esc(t.nom)}" aria-pressed="${(x.techs||[]).includes(t.nom)}" title="${t.societe==="chassaing"?"Chassaing":"Artik"}"><span class="sw" style="--bc:var(--${t.societe==="chassaing"?"blue":"orange"});margin-right:6px"></span>${esc(t.nom)}</button>`).join("")}</div>`:'<span class="hint">Ajoutez vos techniciens dans l\'onglet Suivi &amp; facturation.</span>'}</div>
    </fieldset>
    <fieldset><legend>Planning provisoire</legend>
      ${seg("c-st",Object.entries(ST),x.statut)}
      <div class="grid2">
        <label class="field"><span>Début</span><input type="date" id="c-deb" value="${esc(x.debut||"")}"></label>
        <label class="field"><span>Durée (jours ouvrés)</span><input type="number" id="c-dur" min="${$("#fl-half").checked?0.5:1}" step="${$("#fl-half").checked?0.5:1}" value="${slotsOf(x)/2}"><small class="hint" id="c-durhint" style="margin:0"></small></label>
      </div>
    </fieldset>
    <fieldset><legend>Suivi à l'avancement</legend>
      <div class="grid2">
        <label class="field"><span>Heures passées à ce jour</span><input type="number" id="c-hp" min="0" value="${esc(x.heuresPassees??"")}"></label>
        <label class="field"><span>Déjà facturé HT (€)</span><input type="number" id="c-fa" min="0" value="${esc(x.facture??"")}"></label>
        <label class="field"><span>Achats du chantier HT (€)</span><input type="number" id="c-ach" min="0" value="${esc(x.achats??"")}"></label>
      </div>
      ${id?bilanBox(x):""}
      <label class="field"><span>Note</span><textarea id="c-note" rows="3">${esc(x.note)}</textarea></label>
    </fieldset>
    <div class="err" id="c-err" hidden></div>
    <div class="actions">${id?'<button class="btn danger" type="button" id="c-del">Supprimer</button>':""}<button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="button" id="c-ok">Enregistrer</button></div>
  </div></div>`;
  o.hidden=false;
  o.querySelectorAll(".seg").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest("button");if(b)g.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",z===b))}));
  o.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",close));
  const ct=$("#c-techs");if(ct)ct.addEventListener("click",e=>{const b=e.target.closest("button");if(b){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");setTimeout(()=>calcDur(true))}});
  /* durée proposée à partir des heures vendues et des techniciens cochés */
  let durTouched=false;
  const calcDur=apply=>{const h=Number($("#c-h").value)||0,sel=[...document.querySelectorAll("#c-techs [aria-pressed=true]")].map(b=>b.dataset.t),tl=techList().filter(t=>sel.includes(t.nom));
    const jh=Number(cfg.journee)||8,perDay=Math.max(1,tl.length)*jh,hint=$("#c-durhint");
    if(!h){hint.textContent="";return}
    let j=h/perDay;j=$("#fl-half").checked?Math.ceil(j*2)/2:Math.ceil(j);j=Math.max(j,0.5);
    hint.textContent=`${h} h ÷ ${perDay.toLocaleString("fr-FR",{maximumFractionDigits:1})} h/jour (${tl.length||1} tech.) ≈ ${j.toLocaleString("fr-FR")} j`+(apply&&!durTouched?" · appliqué":"");
    if(apply&&!durTouched)$("#c-dur").value=j};
  $("#c-dur").addEventListener("input",()=>{durTouched=true;calcDur(false)});
  $("#c-h").addEventListener("input",()=>calcDur(true));
  calcDur(!id);
  let prevEq=x.equipe||"";const ce=$("#c-eq");
  if(ce&&ct)ce.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const eq=equipeList(),old=eq.find(q=>q.nom===prevEq),nw=eq.find(q=>q.nom===b.dataset.v);
    ct.querySelectorAll("button").forEach(t=>{if(old&&old.membres.includes(t.dataset.t))t.setAttribute("aria-pressed","false");if(nw&&nw.membres.includes(t.dataset.t))t.setAttribute("aria-pressed","true")});prevEq=b.dataset.v;calcDur(true)});
  $("#c-ok").addEventListener("click",async()=>{
    const client=$("#c-client").value.trim();if(!client){$("#c-err").textContent="Indiquez le nom du chantier.";$("#c-err").hidden=false;return}
    let statut=segVal("c-st"),debut="";
    if($("#c-deb").value){let d=parse($("#c-deb").value);const wd=(d.getDay()+6)%7;if(wd>4)d=addD(d,7-wd);debut=ymd(d)}
    if(debut&&statut==="aplanifier")statut="planifie";
    if(!debut&&(statut==="planifie"||statut==="encours")){$("#c-err").textContent="Choisissez une date de début pour planifier le chantier.";$("#c-err").hidden=false;return}
    const num=v=>v===""?null:Number(v);
    const data={client,societe:segVal("c-soc")||"artik",categorie:segVal("c-cat"),charge:$("#c-chg").value,montant:num($("#c-mt").value),heures:num($("#c-h").value),
      statut,debut,pm:debut===x.debut?!!x.pm:false,slots:Math.max(1,Math.round((Number($("#c-dur").value)||0.5)*2)),
      heuresPassees:num($("#c-hp").value),facture:num($("#c-fa").value),achats:num($("#c-ach").value),note:$("#c-note").value.trim(),
      techs:[...document.querySelectorAll("#c-techs [aria-pressed=true]")].map(b=>b.dataset.t),equipe:$("#c-eq")?segVal("c-eq"):(x.equipe||"")};
    $("#c-ok").disabled=true;
    try{
      if(id)await db.doc("chantiers/"+id).update(data);
      else await db.collection("chantiers").doc("c"+Date.now().toString(36)).set({...data,exemple:false,createdAt:new Date().toISOString()});
      close();toast(id?"Chantier enregistré":"Chantier ajouté");
    }catch(e){$("#c-ok").disabled=false;$("#c-err").textContent="Enregistrement impossible ("+(e.code||e.message)+").";$("#c-err").hidden=false}
  });
  const del=$("#c-del");if(del){let armed=false;del.addEventListener("click",async()=>{
    if(!armed){armed=true;del.textContent="Confirmer la suppression";return}
    try{await db.doc("chantiers/"+id).delete();close();toast("Chantier supprimé")}catch(e){toast("Suppression impossible",true)}})}
}
async function save(id,patch,msg){try{await db.doc("chantiers/"+id).update(patch);toast(msg)}catch(e){toast("Enregistrement impossible ("+(e.code||e.message)+")",true)}}

/* ---------- Rendu & navigation ---------- */
function render(){
  renderStats();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===tab));
  $("#nav").hidden=tab!=="planning";
  const v=$("#view");
  if(tab==="planning")v.innerHTML=planningHTML();else if(tab==="params"){v.innerHTML=paramsHTML();bindListe()}else v.innerHTML=listeHTML()
}
function step(dir){
  const showWE=$("#fl-wk").checked;
  if(zoom==="jour"){let d=addD(viewDate,dir);if(!showWE)while(isWE(d))d=addD(d,dir);viewDate=d}
  else if(zoom==="semaine")viewDate=addW(viewDate,dir);
  else if(zoom==="deux")viewDate=addW(viewDate,2*dir);
  else if(zoom==="mois")viewDate=addW(viewDate,4*dir);
  else viewDate=addW(viewDate,8*dir);
  render();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{tab=t.dataset.tab;ls("tab",tab);render()}));
["#fl-chg","#fl-soc","#fl-term","#fl-wk","#fl-col","#fl-half"].forEach(s=>$(s).addEventListener("change",()=>{ls("f"+s,$(s).type==="checkbox"?($(s).checked?"1":"0"):$(s).value);render()}));
const PREV=z=>z==="mois"||z==="six";let modeUser="chantiers";
function applyPrev(){const pv=PREV(zoom);mode=pv?"chantiers":modeUser;
  document.querySelectorAll('#mode button').forEach(b=>{const off=pv&&b.dataset.m!=="chantiers";b.disabled=off;b.title=off?"Au-delà de 2 à 3 semaines, c'est du prévisionnel : vue par chantier uniquement":""});
  const pc=$("#prevchip");if(pc)pc.hidden=!pv}
$("#mode").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b||b.disabled)return;mode=modeUser=b.dataset.m;ls("mode",mode);render()});
$("#zoom").addEventListener("click",e=>{const b=e.target.closest("[data-z]");if(!b)return;zoom=b.dataset.z;ls("zoom2",zoom);applyPrev();render()});
$("#prev").addEventListener("click",()=>step(-1));
$("#next").addEventListener("click",()=>step(1));
$("#today").addEventListener("click",()=>{viewDate=new Date();render()});
$("#view").addEventListener("click",e=>{if(suppressClick)return;const o=e.target.closest("[data-open]");if(o&&!e.target.closest(".bar"))openSheet(o.dataset.open)});
$("#btn-new").addEventListener("click",()=>openSheet(null));
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(tab==="planning"&&!drag&&$("#overlay").hidden)render()},150)});

tab=ls("tab")||"planning";zoom=ZOOMS[ls("zoom2")]?ls("zoom2"):"semaine";mode=modeUser=["techniciens","equipes"].includes(ls("mode"))?ls("mode"):"chantiers";applyPrev();
fillChg();
$("#fl-chg").value=ls("f#fl-chg")||"";$("#fl-soc").value=ls("f#fl-soc")||"";$("#fl-col").value=ls("fcol2")||"categorie";$("#fl-col").addEventListener("change",()=>ls("fcol2",$("#fl-col").value));
$("#fl-term").checked=ls("f#fl-term")==="1";$("#fl-wk").checked=ls("f#fl-wk")!=="0";$("#fl-half").checked=ls("f#fl-half")==="1";
render();
(async()=>{
  db=await window.__planDB();
  if(!db){banner("Les données ne sont pas joignables dans cette vue. Ouvrez la page depuis claude.ai.");$("#btn-new").disabled=true;loaded=true;render();return}
  const timer=setTimeout(()=>{if(!loaded)banner("Les chantiers ne répondent pas encore. La page se mettra à jour toute seule.")},10000);
  db.doc("config/reglages").onSnapshot(s=>{if(s.exists){const d=s.data();cfg={charges:d.charges&&d.charges.length?d.charges:DEF.charges,capacite:d.capacite||DEF.capacite,techniciens:d.techniciens||[],equipes:d.equipes||[],journee:Number(d.journee)||8,couts:d.couts||[]}}fillChg();if($("#overlay").hidden&&!drag)render()},()=>{});
  db.collection("chantiers").onSnapshot(s=>{
    items=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!s.metadata.fromCache){clearTimeout(timer);banner("")}
    loaded=true;if($("#overlay").hidden&&!drag)render();else renderStats();
  },e=>{clearTimeout(timer);loaded=true;banner("Chargement impossible ("+e.code+"). Rechargez la page.");render()});
})();
})();
</script>

</body>
