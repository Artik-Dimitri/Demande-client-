<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outils de calcul – Artik &amp; Chassaing</title>
<meta name="robots" content="noindex,nofollow">
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Outils de calcul : en-tête groupe, choix de l outil, dossier, tableaux de saisie et résultats */
:root{
  --bg:#F3F4F6;--surface:#FFFFFF;--ink:#1F2328;--muted:#5D6670;--line:#DDE1E6;--soft:#F7F8FA;
  --c1:#E4670A;--c2:#1F7FC4;--c3:#8E2344;--c4:#B8901A;--c1s:#FCEBDD;
  --ok:#2E8B57;--okS:#E3F2EA;--mid:#C98A0B;--midS:#FBF1DA;--ko:#C5372C;--koS:#F9E3E1;--hi:#1F7FC4;--hiS:#E1EEF8;
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-b:"Barlow",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181C;--surface:#1E2227;--ink:#ECEEF0;--muted:#A3ABB4;--line:#323840;--soft:#252A30;--c1s:#3A2618;--okS:#173327;--midS:#3A2F14;--koS:#3D1C19;--hiS:#16293A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181C;--surface:#1E2227;--ink:#ECEEF0;--muted:#A3ABB4;--line:#323840;--soft:#252A30;--c1s:#3A2618;--okS:#173327;--midS:#3A2F14;--koS:#3D1C19;--hiS:#16293A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b)}
.wrap{max-width:1360px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.btn.pri{background:var(--c1);border-color:var(--c1);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{color:var(--ko)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px}.x:hover{background:var(--soft);color:var(--ko)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--surface);width:100%;min-width:0}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.hint{color:var(--muted);font-size:13px;margin:0}
/* en-tête */
.head{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bar{display:grid;grid-template-columns:repeat(4,1fr);height:5px}.bar i:nth-child(1){background:var(--c1)}.bar i:nth-child(2){background:var(--c2)}.bar i:nth-child(3){background:var(--c3)}.bar i:nth-child(4){background:var(--c4)}
.hin{display:flex;gap:16px;align-items:center;padding:12px 18px;flex-wrap:wrap}
.logos{display:flex;gap:8px}.logo{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;height:50px}.logo img{height:38px;width:auto;display:block}
.ht{flex:1;min-width:220px}.ht h1{font:700 30px/1 var(--f-d);margin:0}.ht p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;font:600 18px var(--f-d);padding:8px 14px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--c1)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font:700 21px var(--f-d);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font:500 13px var(--f-b);color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--soft);border-radius:12px;padding:10px 12px}.kpi span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.kpi b{display:block;font:700 26px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
th button{border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
th button[aria-sort]{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.rowl td:first-child{white-space:nowrap}tr.rowl{cursor:pointer}tr.rowl:hover td{background:var(--soft)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}.kv span{color:var(--muted)}
.kv.tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.gauge.stack{display:flex;gap:2px;background:none}.gauge.stack i{position:static;border-radius:4px;flex:none}
.gauge u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;z-index:50}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--c1)}
.lock{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:9px 12px;font-size:14px}
.vue{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.vue select{width:auto}
.boom{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){.boom{display:none}}
/* ---------- outils de calcul ---------- */
.tools{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.tools button{border:1px solid var(--line);border-top:4px solid var(--tc);background:var(--surface);border-radius:12px;padding:9px 10px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:flex-start;min-width:0}
.tools button .ic{font-size:22px;line-height:1.1}.tools button b{display:block;font:700 17px/1.1 var(--f-d)}.tools button small{display:block;color:var(--muted);font-size:12px;line-height:1.25;margin-top:2px}
.tools button[aria-pressed=true]{background:color-mix(in srgb,var(--tc) 10%,var(--surface));border-color:var(--tc)}
.tooltop{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:4px}
.tooltop h2{margin:0;font:700 26px/1.1 var(--f-d)}.tooltop p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:780px}
.subs{display:flex;gap:4px}.subs button{border:0;background:none;font:600 17px var(--f-d);padding:6px 12px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.subs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--tc)}
.dbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.dact{display:flex;gap:6px}
.btn.bad{color:var(--ko)}.btn.sm{padding:4px 9px;font-size:13px}
.kpis5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi.main{background:var(--c1s)}.kpi.warn{background:var(--koS)}.kpi b small{font:600 13px var(--f-b);color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.pgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pcols{display:grid;grid-template-columns:1fr;gap:14px}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tw table{min-width:100%}
.tw td{padding:4px 5px}.tw th{padding:6px 5px}
.tw td input,.tw td select{padding:5px 6px;font-size:14px}.tw td select{min-width:110px;max-width:240px}
.tw tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--soft)}
.tw label.f{font-size:0;gap:0}
tr.off td{opacity:.5}
.pdfbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:-4px 0 12px}.pdfp{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px}.pdfp .f{min-width:120px}.pdfa{display:flex;gap:8px;flex-wrap:wrap}
.wgen{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:grid;gap:6px}.wgh{font:700 17px var(--f-d)}.wgh small{font:500 12.5px var(--f-b);color:var(--muted);margin-left:6px}
td.gen select{background:var(--soft);color:var(--muted)}td.own select{background:var(--surface);border-color:var(--c2);color:var(--ink)}
select.modif{background:var(--hiS);border-color:var(--hi)}
.ko{color:var(--ko);font-weight:600;font-size:13px}.okc{color:var(--ok);font-weight:600;font-size:13px}
.z{color:var(--line)}
.h3{font:700 18px var(--f-d);margin:8px 0 0}
.kvs{display:flex;flex-direction:column;gap:6px}
.kvs .kv{border-bottom:1px dashed var(--line);padding-bottom:5px;align-items:center}.kvs .kv b{text-align:right}
.kvs .kv.big{border:0;background:var(--c1s);border-radius:10px;padding:8px 10px}.kvs .kv.big b{font:700 24px var(--f-d)}
.memo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.memo .hint{grid-column:1/-1}
.memo dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 12px}.memo dt{font-weight:700}.memo dd{margin:0;color:var(--ink)}
.plist{display:flex;gap:6px;flex-wrap:wrap}.pl{display:inline-flex;gap:2px;align-items:center}.pl input{width:auto;min-width:80px;max-width:240px}
.ptab td input{min-width:70px}
.alerts{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}.alerts li{background:var(--soft);border-radius:10px;padding:8px 10px}
.desc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.desc textarea{min-height:56px;resize:vertical}
.howto{border-radius:12px;background:var(--soft);padding:8px 12px}.howto summary{cursor:pointer;font:700 17px var(--f-d)}
.empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}.empty b{font:700 24px var(--f-d);color:var(--ink)}
@media (max-width:1400px){.tools{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tl{display:flex;gap:4px;margin-top:6px}.tls{min-width:0;background:color-mix(in srgb,var(--k) 14%,var(--surface));border-top:4px solid var(--k);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;overflow:hidden}.tls b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tls span{font-variant-numeric:tabular-nums;font-size:13px}.tls small{color:var(--muted);font-size:12px}
@media (max-width:700px){.tl{flex-direction:column}}
@media (max-width:900px){.kpis5{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:1fr 1fr}.pgrid,.memo,.desc{grid-template-columns:1fr}.pgrid3{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.tools{grid-template-columns:1fr 1fr}.tools button small{display:none}.kpis5{grid-template-columns:1fr 1fr}.grid4,.pgrid3{grid-template-columns:1fr}.memo dl{grid-template-columns:1fr}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<style>
/* catalogue produits (chambres froides, boulangerie) */
.catw{display:grid;gap:14px}
.cath{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.cath h2{margin:0}.cath p{margin:4px 0 0}
.famtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.famtabs button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;font:600 13px var(--f-b);color:var(--ink);cursor:pointer}
.famtabs button span{font-size:26px;line-height:1}.famtabs button[aria-selected=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.famt{font:700 20px/1.1 var(--f-d);margin:6px 0 0}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ptile{position:relative;display:grid;gap:3px;justify-items:start;text-align:left;border:1px solid var(--line);border-top:4px solid var(--tc);background:var(--surface);border-radius:14px;padding:12px 12px 10px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s,box-shadow .12s}
.ptile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.ptile .pic{font-size:34px;line-height:1.1}.ptile b{font:700 17px/1.15 var(--f-d)}.ptile small{color:var(--muted);font-size:12.5px}
.ptile em{position:absolute;top:8px;right:8px;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface));border-radius:999px;padding:1px 7px}
.mylist{display:grid;gap:6px}
.myrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink);font:inherit}
.myrow:hover{border-color:var(--muted)}.myrow span{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.myrow .n{color:var(--ink);font-weight:700}
@media (max-width:600px){.myrow{grid-template-columns:1fr auto}.myrow span:nth-child(2){display:none}}
/* projet */
.addg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.addb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);border-left:4px solid var(--tc);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);font:600 14px var(--f-b);text-align:left}
.addb span{font-size:24px;line-height:1}.addb small{font-size:11px;color:var(--muted);font-weight:600}.addb:hover{background:var(--soft)}
.plg{display:grid;gap:6px;margin-bottom:12px}.plg h3{margin:0;font:700 18px var(--f-d);border-left:4px solid var(--tc);padding-left:8px}.plg h3 small{color:var(--muted);font:600 13px var(--f-b)}
.cgrp{border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:14px;padding:12px 14px;display:grid;gap:8px}.cgrp h3{margin:0;font:700 20px var(--f-d)}
.lnk{border:0;background:none;color:var(--c2);font:inherit;font-weight:600;cursor:pointer;padding:0;text-align:left}
tr.off td{opacity:.5}
.pdfbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:-4px 0 12px}.pdfp{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px}.pdfp .f{min-width:120px}.pdfa{display:flex;gap:8px;flex-wrap:wrap}
.wgen{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:grid;gap:6px}.wgh{font:700 17px var(--f-d)}.wgh small{font:500 12.5px var(--f-b);color:var(--muted);margin-left:6px}
td.gen select{background:var(--soft);color:var(--muted)}td.own select{background:var(--surface);border-color:var(--c2);color:var(--ink)}
</style>
<style>
#gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 40px;overflow:auto}
.gatecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;max-width:460px;width:100%;display:grid;gap:12px}
[hidden]{display:none!important}
.gatecard h2{font:700 30px/1.1 var(--f-d);margin:0}.gatecard p{margin:0;color:var(--muted)}.gatecard .btn{justify-self:start}
</style>

<script>
/* =====================================================================
   OUTILS DE CALCUL – VERSION EN LIGNE
   Liste SharePoint « Outils calcul » : une ligne par dossier (d/<outil>/<id>) + p/<outil> (réglages, Dimitri seul).
   ===================================================================== */
(function(){
const CFG={tenantId:"14b03bce-aec8-408e-9686-c43ea4a503d8",clientId:"f66f2711-d9e4-4fd3-be11-57367c333c87",
  liste:"Outils calcul",acces:"Portail acces",owner:"d.blin@chassaing-technologies.fr",relais:"https://red-sun-fb1f.d-blin.workers.dev"};
const SC=["User.Read","Sites.ReadWrite.All"],SC_ADMIN=["Sites.Manage.All"];
let app=null,account=null,siteId=null,email="";const L={},ids={},timers={};
const gate=document.createElement("div");gate.id="gate";gate.hidden=true;document.body.appendChild(gate);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showGate(t,x,btn,fn){gate.innerHTML=`<div class="gatecard"><h2>${esc(t)}</h2><p>${x}</p>${btn?`<button class="btn pri" type="button" id="gb">${esc(btn)}</button>`:""}</div>`;gate.hidden=false;if(btn)document.getElementById("gb").onclick=fn}
async function tok(sc){try{return (await app.acquireTokenSilent({scopes:sc,account})).accessToken}catch(e){await app.acquireTokenRedirect({scopes:sc,account});throw new Error("redirect")}}
async function gx(method,path,body,sc){const r=await fetch(path.startsWith("http")?path:"https://graph.microsoft.com/v1.0"+path,{method,headers:{Authorization:"Bearer "+await tok(sc||SC),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error&&j.error.message)||("Erreur "+r.status));e.status=r.status;throw e}return j}
async function lists(){let u=`/sites/${siteId}/lists?$select=id,displayName&$top=200`;while(u){const r=await gx("GET",u);(r.value||[]).forEach(l=>L[l.displayName]=l.id);u=r["@odata.nextLink"]}}
async function items(name){const out=[];if(!L[name])return out;let u=`/sites/${siteId}/lists/${L[name]}/items?$expand=fields($select=Title,Valeur)&$top=500`;
  while(u){const r=await gx("GET",u);(r.value||[]).forEach(it=>{const t=it.fields&&it.fields.Title;if(!t)return;let v={};try{v=JSON.parse(it.fields.Valeur||"{}")}catch(e){}out.push({id:it.id,t,v})});u=r["@odata.nextLink"]}return out}
async function put(key,v){const f={Valeur:JSON.stringify(v)};
  if(ids[key])await gx("PATCH",`/sites/${siteId}/lists/${L[CFG.liste]}/items/${ids[key]}/fields`,f);
  else{const r=await gx("POST",`/sites/${siteId}/lists/${L[CFG.liste]}/items`,{fields:{Title:key,...f}});ids[key]=r.id}}
const warn=m=>{const t=document.getElementById("toast");if(t){t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,4000)}};
const strip=e=>JSON.parse(JSON.stringify(e,(k,v)=>k==="_open"?undefined:v));
window.__OC={
  async load(){
    if(!window.msal){showGate("Connexion impossible","Le module de connexion Microsoft n'a pas pu se charger. Rechargez la page.");throw new Error("stop")}
    app=new msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:"https://login.microsoftonline.com/"+CFG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
    let res=null;try{res=await app.handleRedirectPromise()}catch(e){showGate("Connexion refusée",esc(e.message),"Réessayer",()=>app.loginRedirect({scopes:SC}));throw new Error("stop")}
    account=(res&&res.account)||app.getAllAccounts()[0]||null;
    if(!account){showGate("Outils de calcul","Connectez-vous avec votre compte Microsoft de l'entreprise.","Se connecter",()=>app.loginRedirect({scopes:SC}));throw new Error("stop")}
    showGate("Chargement…","Lecture des dossiers.");
    email=String(account.username||"").toLowerCase();
    siteId=(await gx("GET","/sites/root?$select=id")).id;await lists();
    if(!L[CFG.liste]){if(email===CFG.owner){const l=await gx("POST",`/sites/${siteId}/lists`,{displayName:CFG.liste,list:{template:"genericList"},columns:[{name:"Valeur",text:{allowMultipleLines:true,textType:"plain"}}]},SC_ADMIN);L[CFG.liste]=l.id}
      else{showGate("Pas encore ouvert","Les outils de calcul n'ont pas encore été activés par Dimitri.");throw new Error("stop")}}
    const [mine,acc]=await Promise.all([items(CFG.liste),items(CFG.acces)]);
    const dos={},params={};
    mine.forEach(x=>{ids[x.t]=x.id;const m=x.t.match(/^d\/([^/]+)\//);if(m)(dos[m[1]]||(dos[m[1]]=[])).push(x.v);else if(x.t.startsWith("p/"))params[x.t.slice(2)]=x.v});
    Object.values(dos).forEach(L=>L.sort((a,b)=>String(b.maj||b.cree).localeCompare(String(a.maj||a.cree))));
    const pers=((acc.find(x=>x.t==="acces")||{}).v||{}).personnes||[],p=pers.find(z=>String(z.email||"").toLowerCase()===email);
    const nom=email===CFG.owner?"Dimitri":email==="k.kerfah@chassaing-technologies.fr"?"Karim":(p&&p.nom)||String(account.name||email).split(/[\s.@]/)[0];
    gate.hidden=true;
    return {dos,params,me:{nom,email,owner:email===CFG.owner}};
  },
  save(tool,e){const k="d/"+tool+"/"+e.id;clearTimeout(timers[k]);timers[k]=setTimeout(()=>put(k,strip(e)).catch(err=>{if(err.message!=="redirect")warn("Enregistrement impossible : "+err.message)}),700)},
  async del(tool,id){const k="d/"+tool+"/"+id;clearTimeout(timers[k]);if(ids[k]){await gx("DELETE",`/sites/${siteId}/lists/${L[CFG.liste]}/items/${ids[k]}`);delete ids[k]}},
  saveParams(tool,P){if(email!==CFG.owner)return;const k="p/"+tool;clearTimeout(timers[k]);timers[k]=setTimeout(()=>put(k,P).catch(e=>{if(e.message!=="redirect")warn("Réglages non enregistrés : "+e.message)}),700)}
};
})();

</script>

/* =====================================================================
   OUTILS DE CALCUL – socle commun
   Chaque outil = un classeur Excel repris à l'identique : saisie (dossiers enregistrés),
   calcul automatique, mémo, et réglages (bases de calcul) modifiables par Dimitri seul.
   ===================================================================== */
const OWNER="Dimitri",PERS=["Dimitri","Karim","Alexis","Guilhem","Technicien"];
const TOOLS=[];const T=k=>TOOLS.find(t=>t.k===k);
const LS=k=>{try{return JSON.parse(localStorage.getItem("oc-"+k)||"null")}catch(e){return null}};
const SS=(k,v)=>{try{localStorage.setItem("oc-"+k,JSON.stringify(v))}catch(e){}};
const clone=o=>JSON.parse(JSON.stringify(o));
const OC=window.__OC||null;let ME=null;
let VUE=LS("vue")||OWNER,TOOL=LS("tool")||"clim",SUB="calc";
let PAR={},DOS={},CURID={},CAT={},PENDPROJ=null;
const isOwner=()=>ME?ME.owner:VUE===OWNER,meNom=()=>ME?ME.nom:VUE;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(typeof v==="number")return v;const x=parseFloat(String(v??"").replace(/[\s°%€]/g,"").replace(",","."));return isFinite(x)?x:NaN};
const N=v=>{const x=num(v);return isFinite(x)?x:0};          /* comme N() d'Excel : vide = 0 */
const has=v=>v!==""&&v!=null&&isFinite(num(v));
const inV=v=>v===""||v==null?"":String(v).replace(".",",");
const f=(n,d=1)=>typeof n==="number"&&isFinite(n)?n.toLocaleString("fr-FR",{maximumFractionDigits:d}):(n==null||n===""?"—":String(n));
const f0=n=>f(n,0),f2=n=>f(n,2);
const rnd=(x,d=0)=>{const p=Math.pow(10,d);return Math.round((x+Number.EPSILON*Math.sign(x))*p)/p};   /* ROUND d'Excel (d peut être négatif) */
const up=(x,d=0)=>{const p=Math.pow(10,d);return Math.ceil(x*p-1e-9)/p};                                  /* ROUNDUP */
const sum=(a,fn)=>a.reduce((s,x)=>s+(fn?N(fn(x)):N(x)),0);
const countLt=(arr,v)=>arr.filter(x=>N(x)<v).length;   /* COUNTIF(plage,"<"&v) */
const today=()=>new Date().toISOString().slice(0,10);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const getP=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const ks=p.split(".");let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null)a[k]={};a=a[k]});a[ks[ks.length-1]]=v};
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2400)}

/* ---------- petits morceaux d'interface ---------- */
const PI=Math.PI;
/* champ de saisie lié au dossier : chemin pointé (ex. "rows.2.L") */
function inp(path,{n,ph,w,lab,cls,ro,type}={}){const d=cur(),v=getP(d,path)??"";
  const el=`<input type="${type||"text"}" ${n?'inputmode="decimal" class="num '+(cls||"")+'"':cls?`class="${cls}"`:""} data-f="${path}" value="${esc(n?inV(v):v)}"${ph!=null?` placeholder="${esc(ph)}"`:""}${w?` style="width:${w}"`:""}${ro?" readonly":""} aria-label="${esc(lab||path)}">`;
  return lab?`<label class="f">${esc(lab)}${el}</label>`:el}
function sel(path,opts,{lab,blank,w}={}){const v=getP(cur(),path)??"";
  const o=(blank!=null?[["",blank]]:[]).concat(opts.map(x=>Array.isArray(x)?x:[x,x]));
  const el=`<select data-f="${path}"${w?` style="width:${w}"`:""} aria-label="${esc(lab||path)}">${o.map(([k,l])=>`<option value="${esc(k)}"${String(k)===String(v)?" selected":""}>${esc(l)}</option>`).join("")}${v!==""&&!o.some(([k])=>String(k)===String(v))?`<option selected>${esc(v)}</option>`:""}</select>`;
  return lab?`<label class="f">${esc(lab)}${el}</label>`:el}
const kpi=(lab,val,unit,cls)=>`<div class="kpi${cls?" "+cls:""}"><span>${lab}</span><b>${val}${unit?` <small>${unit}</small>`:""}</b></div>`;
const chk=s=>s==null||s===""?"":String(s).startsWith("⚠")?`<span class="ko">${esc(s)}</span>`:String(s).startsWith("✅")?`<span class="okc">${esc(s)}</span>`:esc(s);
const addBtn=(path,lab)=>`<button type="button" class="btn sm" data-add="${path}">+ ${esc(lab||"Ajouter une ligne")}</button>`;
const delBtn=(path,i)=>`<button type="button" class="x" data-del="${path}|${i}" title="Supprimer la ligne">✕</button>`;
const card=(t,body,sub)=>`<section class="card"><h2>${t}${sub?` <small>${sub}</small>`:""}</h2>${body}</section>`;
const tbl=(head,rows,foot,cls)=>`<div class="tw"><table class="${cls||""}"><thead><tr>${head.map(h=>`<th${/^[#>]/.test(h)?' class="n"':""}>${esc(h.replace(/^[#>]/,""))}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody>${foot?`<tfoot>${foot}</tfoot>`:""}</table></div>`;
const memo=(items,src)=>`<div class="memo">${items.map(([t,l])=>`<section class="card"><h2>${t}</h2><dl>${l.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>`).join("")}${src?`<p class="hint">${esc(src)}</p>`:""}</div>`;

/* ---------- dossiers ---------- */
function cur(){const k=TOOL,L=DOS[k]||(DOS[k]=[]);let d=L.find(x=>x.id===CURID[k]);if(!d&&L.length){d=L[0];CURID[k]=d.id}return d||null}
function newDos(){const t=T(TOOL),d=Object.assign({id:uid("d"),nom:"",par:meNom(),date:today(),cree:new Date().toISOString()},t.blank(PAR[TOOL]));(DOS[TOOL]||(DOS[TOOL]=[])).unshift(d);CURID[TOOL]=d.id;saveD(d);return d}
const timers={};
function saveD(d){d.maj=new Date().toISOString();if(OC)OC.save(TOOL,d);else{clearTimeout(timers.d);timers.d=setTimeout(()=>SS("dos",DOS),300)}SS("curid",CURID)}
function saveP(){if(OC)OC.saveParams(TOOL,PAR[TOOL]);else SS("par",PAR)}

/* ---------- rendu ---------- */
function head(){return `<header class="head"><div class="bar"><i></i><i></i><i></i><i></i></div><div class="hin"><div class="logos">${LOGOS.map((l,i)=>`<div class="logo"><img src="${l}" alt="${i?"Chassaing Technologies":"Artik Frigoriste"}"></div>`).join("")}</div>
  <div class="ht"><h1>Outils de calcul</h1><p>Les tableaux de dimensionnement du bureau, avec les mêmes formules, partout et pour tout le monde.</p></div>
  ${OC?`<span class="vue">👤 ${esc(meNom())}</span>`:`<label class="vue" title="Aperçu seulement : sur le site, c'est le compte Microsoft qui décide">👁️ Voir comme <select id="vue">${PERS.map(c=>`<option${c===VUE?" selected":""}>${esc(c)}</option>`).join("")}</select></label>`}</div></header>
  <nav class="tools" aria-label="Outils">${TOOLS.map(t=>`<button type="button" data-tool="${t.k}" aria-pressed="${t.k===TOOL}" style="--tc:${t.c}"><span class="ic">${t.ic}</span><span><b>${esc(t.n)}</b><small>${esc(t.s)}</small></span></button>`).join("")}</nav>`}
function dosBar(t){const L=DOS[t.k]||[],d=cur();
  return `<div class="dbar"><label class="f" style="flex:1;min-width:200px">Dossier<select id="dsel">${L.map(x=>`<option value="${x.id}"${d&&x.id===d.id?" selected":""}>${esc(x.nom||"Sans nom")} · ${esc(x.par||"")}${x.date?" · "+new Date(x.date+"T12:00").toLocaleDateString("fr-FR"):""}</option>`).join("")}</select></label>
   ${d?`<label class="f" style="flex:1.4;min-width:220px">Nom du dossier (client, chantier…)${inp("nom",{ph:"Ex. : Hôtel du Viaduc"})}</label>`:""}
   ${t.k!=="projet"&&d&&(DOS.projet||[]).length?`<label class="f" style="flex:1;min-width:180px">📁 Projet${`<select data-f="proj"><option value="">— aucun —</option>${(DOS.projet||[]).map(p=>`<option value="${p.id}"${d.proj===p.id?" selected":""}>${esc(p.nom||"Projet sans nom")}</option>`).join("")}</select>`}</label>`:""}
   <div class="dact">${t.k!=="projet"&&d&&d.proj&&(DOS.projet||[]).some(p=>p.id===d.proj)?`<button type="button" class="btn" data-goproj="${d.proj}">← Projet</button>`:""}${t.catalog?`<button type="button" class="btn" data-act="cat">🗂️ ${esc(t.catLab||"Catalogue")}</button>`:""}<button type="button" class="btn pri" data-act="new">➕ Nouveau</button>${d?`<button type="button" class="btn" data-act="dup">⧉ Copier</button><button type="button" class="btn bad" data-act="del">🗑️</button>`:""}</div></div>`}
function render(){const t=T(TOOL)||TOOLS[0];TOOL=t.k;const P=PAR[t.k];
  const subs=[["calc","🧮 Calcul"]].concat(t.memo?[["memo","📖 Mémo"]]:[]).concat(isOwner()?[["regl","⚙️ Réglages"]]:[]);
  if(!subs.some(s=>s[0]===SUB))SUB="calc";
  let body="";
  if(SUB==="memo")body=t.memo();
  else if(SUB==="regl")body=reglHTML(t);
  else if(t.catalog&&(CAT[t.k]||!cur()))body=t.catalog(P);
  else{const d=cur();body=dosBar(t)+(typeof pdfBar==="function"?pdfBar(t,d):"")+(d?t.render(d,P):`<section class="card"><div class="empty"><span style="font-size:40px">${t.ic}</span><b>Aucun dossier ${esc(t.n.toLowerCase())}</b><span>${esc(t.s)}</span><button type="button" class="btn pri" data-act="new">➕ Nouveau dossier</button></div></section>`)}
  document.getElementById("app").innerHTML=head()+`<div class="tooltop" style="--tc:${t.c}"><div><h2>${t.ic} ${esc(t.n)}</h2><p>${esc(t.long||t.s)}</p></div><nav class="subs" role="tablist">${subs.map(([k,n])=>`<button type="button" role="tab" data-sub="${k}" aria-selected="${SUB===k}">${n}</button>`).join("")}</nav></div>`+body;
  try{if(parent!==window)parent.postMessage({ocTool:TOOL,cat:!!(t.catalog&&(CAT[t.k]||!cur()))},"*")}catch(e){}}
/* ouvrir / créer un dossier depuis un autre écran (catalogue, projet) */
function goDos(k,id){TOOL=k;SS("tool",TOOL);CURID[k]=id;SS("curid",CURID);CAT[k]=false;SUB="calc";render();scrollTo(0,0)}
function newIn(k,preset){TOOL=k;const d=newDos();const pj=PENDPROJ&&(DOS.projet||[]).find(x=>x.id===PENDPROJ);Object.assign(d,pj?{client:pj.client||"",chantier:pj.chantier||""}:{},preset||{},PENDPROJ?{proj:PENDPROJ}:{});PENDPROJ=null;saveD(d);CAT[k]=false;SUB="calc";render();scrollTo(0,0);return d}
const keepFocus=fn=>{const a=document.activeElement,sel=a&&(a.id?"#"+a.id:[...a.attributes].filter(x=>x.name.startsWith("data-")).map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join("")),fromEnd=a&&a.value!=null&&a.selectionStart!=null&&a.type!=="number"?a.value.length-a.selectionStart:null;const y=scrollY;fn();
  if(sel){const el=document.querySelector(sel);if(el){el.focus({preventScroll:true});try{if(fromEnd!=null){const q=Math.max(0,el.value.length-fromEnd);el.setSelectionRange(q,q)}}catch(e){}}}scrollTo(0,y)};

/* ---------- réglages génériques (Dimitri seul) ---------- */
function reglHTML(t){if(!isOwner())return `<section class="card"><div class="lock">🔒 Réservé à Dimitri.</div></section>`;const P=PAR[t.k];
  const pin=(path,v,n)=>`<input type="text" ${n?'inputmode="decimal" class="num"':""} data-pp="${path}" data-ppn="${n?1:""}" value="${esc(n?inV(v):v??"")}" aria-label="${esc(path)}">`;
  const blocks=t.regl.map(b=>{
    if(b.t==="nums")return card(b.lab,`<div class="pgrid3">${b.items.map(([p,l])=>`<label class="f">${esc(l)}${pin(p,getP(P,p),1)}</label>`).join("")}</div>`);
    if(b.t==="txts")return card(b.lab,`<div class="pgrid3">${b.items.map(([p,l])=>`<label class="f">${esc(l)}${pin(p,getP(P,p),0)}</label>`).join("")}</div>`);
    if(b.t==="list"){const a=getP(P,b.p)||[];return card(b.lab,`<div class="plist">${a.map((v,i)=>`<span class="pl">${pin(b.p+"."+i,v,b.n)}<button type="button" class="x" data-pdel="${b.p}|${i}" title="Supprimer">✕</button></span>`).join("")}</div><button type="button" class="btn sm" data-padd="${b.p}" data-padn="${b.n?1:""}">+ Ajouter</button>${b.hint?`<p class="hint">${esc(b.hint)}</p>`:""}`)}
    if(b.t==="table"){const a=getP(P,b.p)||[];return card(b.lab,`${b.hint?`<p class="hint">${esc(b.hint)}</p>`:""}${tbl(b.cols.map(c=>c[1]).concat([""]),a.map((r,i)=>`<tr>${b.cols.map(([k,,n])=>`<td>${pin(b.p+"."+i+"."+k,r[k],n)}</td>`).join("")}<td>${`<button type="button" class="x" data-pdel="${b.p}|${i}" title="Supprimer">✕</button>`}</td></tr>`),"","ptab")}<button type="button" class="btn sm" data-padd="${b.p}">+ Ajouter une ligne</button>`)}
    if(b.t==="note")return `<div class="lock">${b.html}</div>`;return ""}).join("");
  return `<div class="lock">⚙️ Bases de calcul de l'outil « ${esc(t.n)} », reprises du classeur. Toi seul vois cet onglet ; tout changement recalcule aussitôt les dossiers. <button type="button" class="btn sm" data-act="reset" style="margin-left:auto">Revenir aux valeurs du classeur</button></div><div class="pcols">${blocks}</div>`}

/* ---------- événements ---------- */
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.tool){PENDPROJ=null;TOOL=d.tool;SS("tool",TOOL);SUB="calc";render();scrollTo(0,0);return}
  if(d.sub){SUB=d.sub;render();return}
  if(d.act==="cat"){CAT[TOOL]=true;render();scrollTo(0,0);return}
  if(d.catclose!==undefined){CAT[TOOL]=false;render();return}
  if(d.goproj){goDos("projet",d.goproj);return}
  if(d.godos){const [k,id]=d.godos.split("|");goDos(k,id);return}

<script>

(function(){
const PAROIS=[["Mur 1 (longueur)","L","h","loc"],["Mur 2 (longueur)","L","h","loc"],["Mur 3 (largeur)","l","h","loc"],["Mur 4 (largeur, porte)","l","h","loc"],["Plafond","L","l","plaf"],["Sol","L","l","sol"]];
/* enthalpie de l'air humide (kJ/kg air sec), comme la formule du classeur */

function calc(d,P){const L=N(d.L),l=N(d.l),h=N(d.h),S=L*l,V=S*h,pr=P.produits.find(p=>p.n===d.produit),tch=N(d.tch);
  const dim={L,l,h},tc={loc:d.tloc,plaf:has(d.tplaf)?d.tplaf:d.tloc,sol:d.tsol};
  const W=PAROIS.map(([n,a,b,t],i)=>{const w=(d.walls||[])[i]||{},A=dim[a],B=dim[b],Sf=A*B,Tc=has(w.tc)?num(w.tc):(has(tc[t])?num(tc[t]):""),dT=N(Tc)-tch;
    const wt=w.type||d.wtype||"",we=has(w.ep)?w.ep:d.wep,ty=P.parois.find(x=>x.n===wt);let U="";if(ty)U=N(ty.u)>0?N(ty.u):1/(N(P.rs)+N(we)/1000/N(ty.l));const Ap=typeof U==="number"&&isFinite(U)?rnd(Sf*U*dT):0;

  const trans=sum(W,w=>w.Ap);

  const hext=hAir(N(d.tloc),N(d.hrloc)),hin=pr?hAir(tch,N(pr.hr)):NaN,dh=isFinite(hext-hin)?Math.max(0,hext-hin):NaN;

  const prop={eff:ip("eff10","eff35"),rv:ip("rv10","rv35"),rl:N(fl.rl),rr:N(fl.rr),dpe:ip("dpe10","dpe35"),dpc:N(fl.dpc),pe:ip("pe10","pe35"),pc:N(fl.pc)};

    const vl=v(prop.rl),va=v(prop.rv),vr=v(prop.rr),liq=T.liq||{},asp=T.asp||{},ref=T.ref||{};
    const r={t,sec,vl,pl:pl(liq,prop.rl,vl,prop.dpc),va,pa:pl(asp,prop.rv,va,prop.dpe),vr,pr:pl(ref,prop.rr,vr,prop.dpc)};
    r.okL=r.vl<=N(P.vLiq)&&r.pl<=N(P.pLiq);r.okA=r.va<=N(P.vAspMax)&&r.pa<=N(P.pAsp);r.okR=r.vr<=N(P.vRefMax)&&r.pr<=N(P.pRef);return r});

    ep:tch>=2?"60 à 80 mm":tch>=-5?"100 mm":tch>=-25?"120 à 150 mm":"150 à 200 mm",
    brass:pr?rnd(V*N(pr.br),-1):"",portee:Math.max(L,l),nEvap:Math.max(1,up(Math.max(L,l)/N(P.portee))),typeEv:h<=2.4&&Math.max(L,l)<=6?"Double flux (faible hauteur)":"Plafonnier cubique",

<script>
/* =====================================================================
   09 · Chambre de blocage / pousse contrôlée (boulangerie – viennoiserie)
   Descente de la pâte en froid → maintien en blocage → remontée et pousse (chaud + humidité)
   ===================================================================== */
(function(){
const hAir=(T,hr)=>{const ps=610.94*Math.exp(17.625*T/(T+243.04)),x=0.622*(hr/100)*ps/(101325-(hr/100)*ps);return {h:1.006*T+x*(2501+1.86*T),x}};
const hm=s=>{const m=String(s||"").match(/^(\d{1,2})[:h](\d{2})?$/);return m?(+m[1])*60+(+(m[2]||0)):NaN};
const hs=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+"h"+String(m%60).padStart(2,"0")};
function calc(d,P){const pr=P.produits.find(x=>x.n===d.produit)||{},v=(k,pk)=>has(d[k])?num(d[k]):N(pr[pk]);
  const L=N(d.L),l=N(d.l),h=N(d.h),S=L*l,V=S*h,Aw=2*(L+l)*h+S;
  const Up=1/(N(P.rs)+N(d.ep)/1000/N(P.lambda)),Us=d.sol==="Non isolé"?N(P.uSol):Up;
  const tb=v("tb","tb"),tp=v("tp","tp"),hrp=v("hrp","hrp"),tdes=v("tdes","tdes"),trem=v("trem","trem"),tpou=v("tpou","tpou");
  const nch=N(d.chariots),npl=has(d.plaques)?num(d.plaques):N(P.plaques),kgp=v("kgp","kgp"),m=nch*npl*kgp,ms=nch*N(P.supKg);
  const tin=has(d.tin)?num(d.tin):24,tloc=N(d.tloc),tsol=N(d.tsol);
  /* énergie à retirer à la pâte (sensible, + congélation partielle si le blocage descend sous le point de congélation) */
  const tc=N(pr.tc),qp=tb>=tc?N(pr.cp1)*(tin-tb):N(pr.cp1)*(tin-tc)+N(pr.lat)+N(pr.cp2)*(tc-tb);
  const Ep=m*qp,Es=ms*N(P.cpSup)*(tloc-tb),ai=hAir(tloc,N(d.hrloc)),ab=hAir(tb,90),Ea=V*1.2*Math.max(0,ai.h-ab.h);
  const parB=Aw*Up*(tloc-tb)+S*Us*(tsol-tb),vent=S*N(P.vent),ferm=m*N(pr.ferm);
  const D={pate:tdes?Ep*1000/(tdes*3600):0,sup:tdes?Es*1000/(tdes*3600):0,air:tdes?Ea*1000/(tdes*3600):0,ferm,par:parB,vent};
  const desc=D.pate+D.sup+D.air+D.ferm+D.par+D.vent,maint=parB+vent+ferm*N(P.fermMaint);
  const froid=rnd(Math.max(desc,maint)*(1+N(P.secu))/1000,2);
  /* remontée et pousse : chauffage + humidification */
  const C={pate:trem?m*N(pr.cp1)*(tp-tb)*1000/(trem*3600):0,sup:trem?ms*N(P.cpSup)*(tp-tb)*1000/(trem*3600):0,par:Math.max(0,Aw*Up*(tp-tloc)+S*Us*(tp-tsol))};
  const chaud=rnd((C.pate+C.sup+C.par)*(1+N(P.secu))/1000,2);
  const ap=hAir(tp,hrp),humi=rnd(Math.max(0,V*1.2*(ap.x-ai.x)*N(P.renouv))+m*N(P.evap)/1000,2);
  /* programme : on part de l'heure d'enfournement et on remonte */
  const tE=hm(d.enf),tM=hm(d.mise),prog=isFinite(tE)&&isFinite(tM)?(()=>{const fP=tE,dP=fP-tpou*60,dR=dP-trem*60,fD=tM+tdes*60;let tot=((tE-tM)%1440+1440)%1440;if(!tot)tot=1440;
    const bl=tot-tdes*60-trem*60-tpou*60;return {tot,bl,ok:bl>=0,steps:[["❄️ Descente en froid",tM,tdes*60],["⏸️ Blocage",tM+tdes*60,Math.max(0,bl)],["🌡️ Remontée",dR,trem*60],["🍞 Pousse",dP,tpou*60]]}})():null;
  return {pr,S,V,Aw,Up,Us,m,ms,qp,D,desc,maint,froid,C,chaud,humi,tb,tp,hrp,tdes,trem,tpou,kgp,npl,To:tb-N(P.dTevap),prog,
    ep:tb>=0?"60 à 80 mm":"80 à 100 mm"}}
function render(d,P){const C=calc(d,P),pr=C.pr;
  const ph=(k,u,dec=1)=>pr.n?f(N(pr[k]),dec)+(u||""):"";
  const rowW=(a,b,c)=>`<tr><td>${a}</td><td class="hint">${esc(b)}</td><td class="n"><b>${f0(c)}</b></td></tr>`;
  const T=C.prog;
  return `<div class="kpis5">${kpi("🥖 Pâte par chargement",f0(C.m),"kg")}${kpi("❄️ Froid à installer",f2(C.froid),"kW","main")}${kpi("🔥 Chauffage pousse",f2(C.chaud),"kW")}${kpi("💧 Humidification",f2(C.humi),"kg/h")}${kpi("🌡️ Évaporation conseillée",isFinite(C.To)?f(C.To,1)+" °C":"—","")}</div>
  ${card("① La chambre et le fournil",`<div class="grid4">${inp("client",{lab:"Client"})}${inp("chantier",{lab:"Chantier"})}${inp("L",{n:1,lab:"Longueur intérieure (m)"})}${inp("l",{n:1,lab:"Largeur intérieure (m)"})}${inp("h",{n:1,lab:"Hauteur intérieure (m)"})}
    ${sel("ep",["60","80","100","120"],{lab:"Épaisseur des panneaux (mm)"})}${sel("sol",["Isolé","Non isolé"],{lab:"Sol"})}${inp("tloc",{n:1,lab:"T° du fournil (°C)",ph:"28"})}${inp("hrloc",{n:1,lab:"HR du fournil (%)",ph:"60"})}${inp("tsol",{n:1,lab:"T° du sol (°C)",ph:"15"})}</div>
    <p class="hint">Surface ${f(C.S,1)} m² · volume ${f(C.V,1)} m³. Compter environ 1 m² de sol par chariot (plaques 600 × 400 ou 600 × 800) plus le passage. Panneaux conseillés : ${C.ep}.</p>`)}
  ${card("② La pâte et le programme",`<div class="grid4">${sel("produit",P.produits.map(x=>x.n),{lab:"Produit",blank:"—"})}${inp("chariots",{n:1,lab:"Nombre de chariots"})}${inp("plaques",{n:1,lab:"Plaques par chariot",ph:f0(N(P.plaques))})}${inp("kgp",{n:1,lab:"Pâte par plaque (kg)",ph:ph("kgp")})}
    ${inp("tin",{n:1,lab:"T° de la pâte à l'entrée (°C)",ph:"24"})}${inp("tb",{n:1,lab:"T° de blocage (°C)",ph:ph("tb")})}${inp("tdes",{n:1,lab:"Durée de descente (h)",ph:ph("tdes")})}${inp("tp",{n:1,lab:"T° de pousse (°C)",ph:ph("tp")})}
    ${inp("hrp",{n:1,lab:"HR de pousse (%)",ph:ph("hrp","",0)})}${inp("trem",{n:1,lab:"Durée de remontée (h)",ph:ph("trem")})}${inp("tpou",{n:1,lab:"Durée de pousse (h)",ph:ph("tpou")})}<span></span>
    ${inp("mise",{lab:"Heure de mise en chambre",ph:"18h00"})}${inp("enf",{lab:"Heure d'enfournement",ph:"05h30"})}</div>
    <p class="hint">Cases vides = valeurs du produit choisi (modifiables par Dimitri dans ⚙️ Réglages).</p>
    ${T?`<div class="tl">${T.steps.map(([n,s,du],i)=>`<div class="tls" style="flex:${Math.max(du,20)};--k:${["#1F7FC4","#6B7785","#B8901A","#E4670A"][i]}"><b>${n}</b><span>${hs(s)} → ${hs(s+du)}</span><small>${f(du/60,1)} h</small></div>`).join("")}</div>
      ${T.ok?`<p class="hint">Cycle de ${f(T.tot/60,1)} h entre la mise en chambre et l'enfournement : la chambre reste en blocage ${f(T.bl/60,1)} h. Démarrer la remontée à <b>${hs(T.steps[2][1])}</b>.</p>`:`<p class="ko">⚠️ Le temps entre la mise en chambre et l'enfournement est trop court pour la descente, la remontée et la pousse.</p>`}`:`<p class="hint">Saisir l'heure de mise en chambre et d'enfournement pour voir le programme (ex. 18h00 et 05h30).</p>`}`)}
  <div class="pgrid">${card("❄️ Le froid (descente et blocage)",`${tbl(["Poste","Détail","#W"],[rowW("🥖 Pâte",`${f0(C.m)} kg × ${f(C.qp,1)} kJ/kg en ${f(C.tdes,1)} h`,C.D.pate),rowW("🛒 Chariots et plaques",`${f0(C.ms)} kg de ${f(N(d.tloc))} à ${f(C.tb)} °C en ${f(C.tdes,1)} h`,C.D.sup),rowW("🚪 Air du fournil au chargement","1 volume de chambre",C.D.air),rowW("🧫 Fermentation",`${f(N(pr.ferm),2)} W/kg`,C.D.ferm),rowW("🧱 Parois",`U ${f(C.Up,3)} W/m².K`,C.D.par),rowW("🌀 Ventilateurs",`${f0(N(P.vent))} W/m²`,C.D.vent)],
      `<tr><td colspan="2">Pendant la descente</td><td class="n">${f0(C.desc)} W</td></tr><tr><td colspan="2">En blocage (maintien)</td><td class="n">${f0(C.maint)} W</td></tr>`)}
    <div class="kvs"><div class="kv big"><span>PUISSANCE FRIGORIFIQUE À INSTALLER (+${f0(N(P.secu)*100)} %)</span><b>${f2(C.froid)} kW</b></div>
    <div class="kv"><span>Évaporation conseillée (ΔT ${f(N(P.dTevap))} K, la pâte ne doit pas croûter)</span><b>${isFinite(C.To)?f(C.To,1)+" °C":"—"}</b></div><div class="kv"><span>Dégivrage</span><b>${C.tb<2?"Électrique":"Naturel possible, électrique conseillé"}</b></div></div>
    <p class="hint">La descente fixe la puissance : plus elle est courte, plus il faut de froid. Ventilation douce sur la pâte (≤ 0,5 m/s) pour éviter le croûtage.</p>`)}
  ${card("🔥 La pousse (chaud et humidité)",`${tbl(["Poste","Détail","#W"],[rowW("🥖 Pâte",`${f0(C.m)} kg de ${f(C.tb)} à ${f(C.tp)} °C en ${f(C.trem,1)} h`,C.C.pate),rowW("🛒 Chariots et plaques",`${f0(C.ms)} kg`,C.C.sup),rowW("🧱 Parois","si la pousse est plus chaude que le fournil",C.C.par)],`<tr><td colspan="2">Total</td><td class="n">${f0(C.C.pate+C.C.sup+C.C.par)} W</td></tr>`)}
    <div class="kvs"><div class="kv big"><span>CHAUFFAGE À PRÉVOIR (+${f0(N(P.secu)*100)} %)</span><b>${f2(C.chaud)} kW</b></div>
    <div class="kv"><span>Humidificateur (pousse à ${f(C.tp)} °C / ${f0(C.hrp)} % HR)</span><b>${f2(C.humi)} kg/h</b></div></div>
    <p class="hint">Humidité : air de la chambre porté à l'HR de pousse (${f(N(P.renouv),1)} renouvellement/h) + eau absorbée par la pâte. Prévoir une régulation T° / HR programmable (blocage → pousse) et une évacuation des condensats.</p>`)}</div>
  <p class="hint">⚠️ Pré-dimensionnement indicatif : les propriétés de la pâte et les durées sont des ordres de grandeur, à confirmer avec le boulanger et la fiche du fabricant de l'armoire ou du groupe.</p>`}
const memoTxt=()=>memo([["Les questions à poser au boulanger",[["Production","Quels produits (baguettes, pain de campagne, viennoiseries, pizzas), combien de chariots par nuit, combien de plaques par chariot."],["Horaires","Heure de fin de façonnage (mise en chambre) et heure d'enfournement visée ; pousse le matin à quelle heure."],["Recette","T° de la pâte en fin de pétrissage (souvent 23 à 25 °C), dosage de levure : moins de levure = blocage plus long possible."],["Fournil","T° du fournil en été, place pour le groupe (rejet de chaleur), alimentation électrique et eau pour l'humidificateur."]]],
  ["Les bonnes pratiques",[["Blocage","Pain : +2 à +4 °C ; viennoiserie : 0 à -2 °C ; plus froid seulement si la recette le prévoit. Descente rapide (1 à 2 h) pour arrêter la fermentation."],["Humidité","Blocage autour de 85-90 % HR et faible vitesse d'air : la pâte ne doit ni croûter ni sécher. Pousse : 75-85 % HR."],["Remontée","Montée progressive (1 à 2 h) avant la pousse pour que le cœur de la pâte suive, sinon pousse irrégulière."],["Matériel","Régulateur programmable blocage / pousse, résistances de chauffe, humidificateur (électrodes ou ultrason), sonde d'humidité, dégivrage électrique, porte à fermeture automatique."]]]],
  "Valeurs indicatives d'avant-projet, à adapter à la recette et au matériel.");
TOOLS.push({k:"blocage",catalog:()=>{const t=T("cf");return t&&t.catalog?t.catalog(PAR.cf,"boul"):""},catLab:"Catalogue boulangerie",ic:"🥖",c:"#A88F62",n:"Blocage de pâte",s:"Pousse contrôlée boulangerie",long:"Chambre de blocage / pousse contrôlée : froid pour descendre la pâte, maintien en blocage, puis chauffage et humidification pour la pousse, avec le programme de la nuit.",
  blank:()=>({client:"",chantier:"",L:"",l:"",h:"",ep:"80",sol:"Isolé",tloc:"",hrloc:"",tsol:"",produit:"",chariots:"",plaques:"",kgp:"",tin:"",tb:"",tdes:"",tp:"",hrp:"",trem:"",tpou:"",mise:"",enf:""}),render,calc,memo:memoTxt,
  regl:[{t:"table",p:"produits",lab:"🥖 Produits et programmes types",hint:"cp en kJ/kg.K, chaleur latente en kJ/kg, fermentation en W/kg. Valeurs indicatives.",cols:[["n","Produit"],["kgp","Pâte / plaque (kg)",1],["tb","T° blocage",1],["tdes","Descente (h)",1],["tp","T° pousse",1],["hrp","HR pousse %",1],["trem","Remontée (h)",1],["tpou","Pousse (h)",1],["cp1","cp pâte",1],["cp2","cp congelée",1],["lat","Latente",1],["tc","T° congélation",1],["ferm","Fermentation W/kg",1]]},
    {t:"nums",lab:"⚙️ Paramètres",items:[["plaques","Plaques par chariot (défaut)"],["supKg","Chariot + plaques (kg par chariot)"],["cpSup","cp chariot et plaques (kJ/kg.K)"],["lambda","λ des panneaux (W/m.K)"],["rs","Résistances superficielles"],["uSol","U du sol non isolé (W/m².K)"],["vent","Ventilateurs (W/m² de sol)"],["fermMaint","Fermentation résiduelle en blocage (part)"],["secu","Coefficient de sécurité (0,15 = 15 %)"],["dTevap","ΔT évaporateur (K)"],["renouv","Renouvellement d'air en pousse (vol/h)"],["evap","Eau absorbée par la pâte en pousse (g/kg.h)"]]}]});

<script>
/* =====================================================================
   11 · Salles de process : charcuterie (salage, étuvage, séchage), fromagerie (saumure, haloir, séchoir, caves)
        et cellules (refroidissement rapide, surgélation, tunnel)
   Salle : bilan sensible + eau retirée aux produits (latent) → froid, réchauffage, déshumidification, humidification.
   Cellule : énergie à retirer au produit pendant le cycle → puissance à l'évaporateur.
   ===================================================================== */
(function(){
const hAir=(T,hr)=>{const ps=610.94*Math.exp(17.625*T/(T+243.04)),x=0.622*(hr/100)*ps/(101325-(hr/100)*ps);return {h:1.006*T+x*(2501+1.86*T),x}};
const ty=(P,n)=>(P.types||[]).find(x=>x.n===n)||{};
function calc(d,P){const T_=ty(P,d.type),mode=T_.mode||"salle",v=(k)=>has(d[k])?num(d[k]):N(T_[k]);
  const L=N(d.L),l=N(d.l),h=N(d.h),S=L*l,V=S*h,A=2*(L+l)*h+2*S,ep=has(d.ep)?num(d.ep):N(T_.ep)||100,U=1/(N(P.rs)+ep/1000/N(P.lambda));
  const t=v("t"),hr=v("hr"),tloc=has(d.tloc)?num(d.tloc):25,hrloc=has(d.hrloc)?num(d.hrloc):60;
  const trans=A*U*(tloc-t),ecl=S*N(P.ecl)*N(d.hecl)/24,pers=N(d.pers)*(272-6*t)*N(d.hpers)/24;
  if(mode==="salle"){
    const mi=N(d.kg),tin=v("tin"),dur=v("dur")||24,ms=N(d.stock),perte=v("perte"),jours=v("jours")||1;
    const prod=dur?mi*N(T_.cp||3)*(tin-t)*1000/(dur*3600):0;           /* + = à refroidir, − = à réchauffer */
    const mw=ms*perte/100/(jours*24)*(jours>2?N(P.pointe)||1:1);         /* kg d'eau par heure retirée aux produits, avec la pointe du début de cycle */
    const lat=mw*2450/3.6,ferm=ms/1000*N(T_.ferm),vent=S*N(P.vent);
    const ren=V*N(P.renouv)/24*1.2,xin=hAir(t,hr).x,xex=hAir(tloc,hrloc).x,eauAir=ren*(xex-xin);   /* kg/h apportés (+) ou retirés (−) par l'air neuf */
    const sens=trans+prod+ferm+vent+ecl+pers-lat;                          /* l'eau qui s'évapore refroidit la salle d'autant */
    const deshu=Math.max(0,mw+eauAir),humi=T_.humi?Math.max(0,-(mw+eauAir)):0;
    const froidW=Math.max(0,sens)+deshu*2450/3.6,chaudW=Math.max(0,-sens)+(T_.rech?froidW*N(P.rech):0);
    const k=24/N(P.tf)*(1+N(P.secu)),froid=rnd(froidW*k/1000,2),chaud=rnd(chaudW*(1+N(P.secu))/1000,2);
    return {mode,T_,S,V,A,U,t,hr,trans,prod,ferm,vent,ecl,pers,lat,mw,eauAir,sens,deshu,humi,froid,chaud,To:t-N(T_.dt),ep}}
  /* cellules : refroidissement rapide, surgélation par lot, tunnel continu */
  const pr=(PAR.cf&&PAR.cf.produits||[]).find(x=>x.n===(d.produit||T_.produit))||{},tin=v("tin"),tfin=v("tfin"),dur=v("dur")||1;
  const tc=N(pr.tc),cp1=N(pr.cp1)||3.3,cp2=N(pr.cp2)||1.8,la=N(pr.lat)||230;
  const q=tfin>=tc?cp1*(tin-tfin):tin<=tc?cp2*(tin-tfin):cp1*(tin-tc)+la+cp2*(tc-tfin);   /* kJ/kg */
  const kgh=mode==="tunnel"?N(d.kgh):N(d.kg)/dur,prod=kgh*q/3.6,emb=(mode==="tunnel"?N(d.embh):N(d.emb)/dur)*N(P.cpEmb)*(tin-tfin)/3.6;
  const tair=v("tair"),transC=A*U*(tloc-tair),fans=(prod+emb)*N(P.fanCell),inf=(prod+emb+transC)*N(P.infCell);
  const totW=prod+emb+transC+fans+inf,froid=rnd(totW*(1+N(P.secu))/1000,2);
  return {mode,T_,pr,q,kgh,prod,emb,transC,fans,inf,totW,froid,chaud:0,t:tair,To:tair-N(T_.dt),S,V,ep,tin,tfin,dur}}
function render(d,P){const C=calc(d,P),T_=C.T_,ph=k=>T_[k]!=null?f(N(T_[k])):"";
  const head=card("① La salle",`<div class="grid4">${inp("client",{lab:"Client"})}${sel("type",P.types.map(x=>x.n),{lab:"Type de salle",blank:"—"})}${inp("L",{n:1,lab:"Longueur intérieure (m)"})}${inp("l",{n:1,lab:"Largeur intérieure (m)"})}${inp("h",{n:1,lab:"Hauteur intérieure (m)"})}${inp("ep",{n:1,lab:"Épaisseur des panneaux (mm)",ph:ph("ep")||"100"})}${inp("tloc",{n:1,lab:"T° du local autour (°C)",ph:"25"})}${inp("hrloc",{n:1,lab:"HR du local (%)",ph:"60"})}</div>
    ${T_.desc?`<p class="hint">${T_.ic||""} ${esc(T_.desc)}</p>`:""}`);
  if(C.mode==="salle"){const rows=[["🧱 Parois",C.trans],["🥩 Mise en température du produit",C.prod],["🧫 Affinage / fermentation",C.ferm],["🌀 Ventilateurs",C.vent],["💡 Éclairage",C.ecl],["🧍 Personnes",C.pers],["💧 Eau qui s'évapore des produits (refroidit l'air)",-C.lat]];
    return `<div class="kpis5">${kpi("❄️ Froid à installer",f2(C.froid),"kW","main")}${kpi("🔥 Réchauffage",f2(C.chaud),"kW")}${kpi("💧 Eau à retirer",f(C.deshu,2),"kg/h")}${kpi("💨 Humidification",C.humi?f(C.humi,2):"0","kg/h")}${kpi("🌡️ Évaporation",f(C.To,1)+" °C","")}</div>
    ${head}

      <p class="hint">La perte de poids, c'est l'eau qui sort des produits : l'évaporateur doit la retirer à l'air. Elle est plus forte en début de cycle (× ${f(N(P.pointe),1)} dans le calcul). Plus la salle est pleine et le séchage rapide, plus il y a d'eau à enlever.</p>`)}
    <div class="pgrid">${card("③ Le bilan (moyenne sur 24 h)",tbl(["Poste","#W"],rows.map(([a,b])=>`<tr><td>${a}</td><td class="n">${f0(b)}</td></tr>`),`<tr><td>Bilan sensible (+ froid, − chauffage)</td><td class="n">${f0(C.sens)}</td></tr>`)+`<div class="kvs"><div class="kv"><span>Eau retirée aux produits</span><b>${f(C.mw,2)} kg/h</b></div><div class="kv"><span>Eau apportée par l'air neuf</span><b>${f(C.eauAir,2)} kg/h</b></div><div class="kv big"><span>FROID À INSTALLER (${f0(N(P.tf))} h de marche)</span><b>${f2(C.froid)} kW</b></div><div class="kv big"><span>RÉCHAUFFAGE</span><b>${f2(C.chaud)} kW</b></div></div>`)}
      ${card("④ Le matériel conseillé",`<ul class="alerts">${[`Évaporation vers ${f(C.To,1)} °C (écart de ${f0(N(T_.dt))} K seulement pour ne pas dessécher les produits).`,T_.air?`Vitesse d'air sur les produits : ${T_.air}.`:"",
        C.chaud>0?`Batterie de réchauffage de ${f2(C.chaud)} kW : idéalement récupérée sur le condenseur (gaz chauds), sinon électrique.`:"",C.deshu>0?`Régulation de l'humidité : le froid retire l'eau (${f(C.deshu,2)} kg/h) et le réchauffage garde la température.`:"",
        C.humi>0?`Humidificateur d'environ ${f(C.humi,2)} kg/h (vapeur ou atomiseur) : l'air neuf assèche la salle.`:T_.humiOpt?"Humidificateur conseillé pour tenir l'humidité au démarrage du cycle.":"",
        `Panneaux ${f0(C.ep)} mm, sol isolé conseillé, matériaux alimentaires et évacuation des condensats.`].filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="hint">Valeurs d'avant-projet : réglages exacts à voir avec le client (recette, durée des cycles, pertes visées).</p>`)}</div>`}
  return `<div class="kpis5">${kpi("❄️ Puissance à l'évaporateur",f2(C.froid),"kW","main")}${kpi("📦 Débit de produit",f(C.kgh,1),"kg/h")}${kpi("🔥 Énergie par kg",f0(C.q),"kJ/kg")}${kpi("🌡️ Air de la cellule",f(C.t,0)+" °C","")}${kpi("🧊 Évaporation",f(C.To,0)+" °C","")}</div>
    ${head}
    ${card("② Le cycle",`<div class="grid4">${sel("produit",(PAR.cf.produits||[]).map(p=>p.n),{lab:"Produit",blank:T_.produit?T_.produit+" (par défaut)":"—"})}${C.mode==="tunnel"?inp("kgh",{n:1,lab:"Débit de produit (kg/h)"})+inp("embh",{n:1,lab:"Emballages (kg/h)"}):inp("kg",{n:1,lab:"Charge par cycle (kg)"})+inp("emb",{n:1,lab:"Emballages, grilles, bacs (kg/cycle)"})}${inp("tin",{n:1,lab:"T° d'entrée (°C)",ph:ph("tin")})}${inp("tfin",{n:1,lab:"T° à cœur visée (°C)",ph:ph("tfin")})}${C.mode==="tunnel"?"":inp("dur",{n:1,lab:"Durée du cycle (h)",ph:ph("dur")})}${inp("tair",{n:1,lab:"T° de l'air soufflé (°C)",ph:ph("tair")})}</div>${T_.regle?`<p class="hint">📏 ${esc(T_.regle)}</p>`:""}`)}
    ${card("③ Le bilan",tbl(["Poste","#W"],[["🥩 Produit",C.prod],["📦 Emballages et supports",C.emb],["🧱 Parois",C.transC],["🌀 Ventilateurs (forte vitesse d'air)",C.fans],["🚪 Ouvertures",C.inf]].map(([a,b])=>`<tr><td>${a}</td><td class="n">${f0(b)}</td></tr>`),`<tr><td>TOTAL</td><td class="n">${f0(C.totW)}</td></tr>`)+`<div class="kvs"><div class="kv big"><span>PUISSANCE À L'ÉVAPORATEUR (sécurité ${f0(N(P.secu)*100)} % incluse)</span><b>${f2(C.froid)} kW à ${f(C.To,0)} °C</b></div></div><p class="hint">La puissance est demandée pendant le cycle : prévoir un groupe dédié ou une réserve sur la centrale. Évaporateur à forte vitesse d'air, dégivrage électrique ou gaz chauds en négatif.</p>`)}`}
function memoTxt(){return memo([["Les questions à poser",[["Produits","Quels produits, quel calibre (saucisson, jambon, fromages de quel poids) ?"],["Cycle","Durée de chaque étape, perte de poids visée, rotation (entrée tous les combien) ?"],["Charge","Combien de kg entrent par jour, combien sont présents dans la salle au plus plein ?"],["Hygiène","Lavage au jet, matériaux, évacuation des condensats, accès pour les chariots."]]],
  ["Les repères",[["Séchage","Le froid sert surtout à retirer l'eau : il faut du réchauffage en même temps pour garder la température."],["Air","Air lent et réparti sur les produits ; un séchage trop rapide fait une croûte qui bloque l'eau dedans."],["Surgélation","Le temps du cycle fait la puissance : diviser la durée par deux double la puissance."]]]],"Valeurs indicatives d'avant-projet.")}
TOOLS.push({k:"process",ic:"🏭",c:"#7A4E2D",n:"Salles de process",s:"Séchage, affinage, surgélation",long:"Charcuterie (salage, étuvage, séchage), fromagerie (saumure, haloir, séchoir, caves) et cellules (refroidissement rapide, surgélation) : froid, réchauffage, eau à retirer, humidification.",
  catalog:()=>{const t=T("cf");return t&&t.catalog?t.catalog(PAR.cf):""},catLab:"Catalogue",
  blank:()=>({client:"",type:"",L:"",l:"",h:"",ep:"",tloc:"",hrloc:"",t:"",hr:"",kg:"",tin:"",dur:"",stock:"",perte:"",jours:"",pers:"",hpers:"",hecl:"",produit:"",kgh:"",embh:"",emb:"",tfin:"",tair:""}),render,calc,memo:memoTxt,
  sum:(d,P)=>{const C=calc(d,P);return `${f2(C.froid)} kW froid${C.chaud?" · "+f2(C.chaud)+" kW chaud":""} · ${f(C.t,0)} °C`},
  regl:[{t:"table",p:"types",lab:"🏭 Types de salles et de cellules",hint:"Famille : charc, from, surg. Mode : salle, cellule, tunnel. Les valeurs servent de départ, chaque dossier peut les changer.",cols:[["fam","Famille"],["ic","Picto"],["n","Nom"],["mode","Mode"],["t","T° salle",1],["hr","HR %",1],["tin","T° entrée",1],["tfin","T° cœur visée",1],["dur","Durée (h)",1],["tair","T° air cellule",1],["perte","Perte %",1],["jours","Cycle (j)",1],["ferm","Affinage W/t",1],["cp","cp produit",1],["dt","ΔT évap.",1],["ep","Panneaux mm",1],["rech","Réchauffage (1 = oui)",1],["humi","Humidificateur (1 = oui)",1],["produit","Produit par défaut"],["air","Vitesse d'air"],["regle","Règle"],["desc","Description"]]},
    {t:"nums",lab:"⚙️ Paramètres",items:[["rs","Résistances superficielles"],["lambda","λ isolant (W/m.K)"],["ecl","Éclairage (W/m²)"],["vent","Ventilateurs salles (W/m²)"],["renouv","Renouvellement d'air (vol/24 h)"],["rech","Réchauffage de régulation (part du froid)"],["pointe","Pointe d'évaporation en début de cycle (×)"],["tf","Heures de marche du froid par jour"],["secu","Sécurité"],["cpEmb","cp emballages (kJ/kg.K)"],["fanCell","Ventilateurs cellules (part du bilan)"],["infCell","Ouvertures cellules (part)"]]}]});
})();

<script>
/* =====================================================================
   08 · Calcul de puissance climatisation et sélection Mitsubishi Electric
   P = Q × V × ΔT (hiver) ; l'unité couvre le besoin en chaud ET le brassage.
   ===================================================================== */
(function(){
const piece=()=>({piece:"",L:"",l:"",h:"2,5",iso:"",type:"",tb:"",ta:""});
/* unité conseillée dans un type : la 1re dont le chaud couvre le besoin, puis la 1re de la suite dont le débit couvre le brassage */
function selUI(P,type,besoin,br){const L=P.ui.filter(u=>u.type===type).sort((a,b)=>N(a.c)-N(b.c));if(!L.length)return {ref:"Type inconnu"};
  const k=countLt(L.map(u=>u.c),besoin);if(k>=L.length)return {ref:"Hors gamme"};
  const j=L.findIndex((u,i)=>i>=k&&N(u.deb)>=br);if(j<0)return {ref:"Hors gamme"};
  return {ref:L[j].ref,u:L[j],why:j>k?"💨 Brassage":"🔥 Puissance"}}
function besoin(d,P,p){const iso=P.iso.find(i=>i.n===p.iso),q=iso?N(iso.q):NaN,L=num(p.L),l=num(p.l),h=num(p.h),V=L*l*h;
  const tb=has(p.tb)?num(p.tb):siteTb(d,P),ta=has(p.ta)?num(p.ta):siteTa(d),dT=ta-tb;
  if(!isFinite(V))return {ok:false};const W=isFinite(q)?rnd(q*V*dT):NaN,kw=isFinite(W)?rnd(W/1000*(1+N(P.marge)),2):NaN;
  return {ok:isFinite(kw),q,V,dT,W,kw,br:rnd(V*N(P.vol))}}
const siteTb=(d,P)=>{const l=P.lieux.find(x=>x.n===d.lieu);return l?N(l.t):NaN};
const siteTa=d=>has(d.amb)?num(d.amb):21;
function calc(d,P){
  const mono=(d.monos||[]).map(p=>{const b=besoin(d,P,p);if(!b.ok)return b;const s=selUI(P,p.type||P.defType,b.kw,b.br);
    return {...b,...s,c:s.u?N(s.u.c):"",fr:s.u?N(s.u.f):"",grp:s.u?(s.u.grp||"⚠️ multi uniquement"):"",why:s.u?s.why:(s.ref==="Type inconnu"?"":"⚠️ autre type")}});
  const multi=(d.multis||[]).map(p=>{const b=besoin(d,P,p);if(!b.ok)return b;const s=selUI(P,p.type||P.defType,b.kw,b.br);return {...b,...s,c:s.u?N(s.u.c):"",fr:s.u?N(s.u.f):"",why:s.u?s.why:"⚠️ autre type"}});
  /* synthèse par système multisplit */
  const sysN=[];(d.multis||[]).forEach(p=>{if(p.sys&&!sysN.includes(p.sys))sysN.push(p.sys)});
  const mx=P.mxz;
  const sys=sysN.map(n=>{const idx=(d.multis||[]).map((p,i)=>p.sys===n?i:-1).filter(i=>i>=0),R=idx.map(i=>multi[i]);
    const c=idx.length,D=rnd(sum(R,r=>r.kw),2),E=sum(R,r=>r.br),F=sum(R,r=>r.c),G=sum(R,r=>r.fr);
    let grp,gc="";if(c<2)grp="Monosplit (1 seule unité)";else{const k=Math.max(countLt(mx.map(m=>m.c),D),countLt(mx.map(m=>m.rmax),G),countLt(mx.map(m=>m.s),c))+1;grp=k>mx.length?"Hors gamme : 2 groupes":mx[k-1].ref;const m=mx.find(x=>x.ref===grp);gc=m?N(m.c):""}
    const ctl=R.some(r=>r.ref==="Hors gamme"||r.ref==="Type inconnu")?"⚠️ unité hors gamme":typeof gc==="number"?"✅ OK":"⚠️ à revoir";
    return {n,c,D,E,F,G,grp,gc,ctl}});
  /* gainables : zones puis pièces */
  const gp=(d.gpieces||[]).map(p=>{const iso=P.iso.find(i=>i.n===p.iso),q=iso?N(iso.q):NaN,V=num(p.L)*num(p.l)*num(p.h);if(!isFinite(V))return {ok:false,z:p.g};
    const dT=siteTa(d)-siteTb(d,P),W=isFinite(q)?rnd(q*V*dT):NaN,kw=isFinite(W)?rnd(W/1000*(1+N(P.marge)),2):NaN;return {ok:isFinite(kw),z:p.g,q,dT,V,W,kw,br:rnd(V*N(P.vol))}});
  const zones=(d.zones||[]).map(z=>{const R=gp.filter(r=>r.z===z.id&&r.ok),n=(d.gpieces||[]).filter(p=>p.g===z.id).length;if(!n)return {z,n:0};
    const E=rnd(sum(R,r=>r.kw),2),F=sum(R,r=>r.br);let s;
    if(!z.type||z.type.startsWith("Auto")){s=selUI(P,"Gainable SEZ-M",E,F);if(!s.u)s=selUI(P,"Gainable PEAD-M",E,F)}else s=selUI(P,z.type,E,F);
    return {z,n,E,F,s,ref:s.ref,c:s.u?N(s.u.c):"",fr:s.u?N(s.u.f):"",deb:s.u?N(s.u.deb):"",pmax:s.u?N(s.u.pmax):"",grp:s.u?s.u.grp:""}});
  const dMaxDeb=x=>N(P.vMax)*PI*Math.pow(x/1000,2)/4*3600,bMax=b=>N(b.w)*N(b.h)/1e6*N(P.libre)*N(P.vBouche)*3600,souple=dMaxDeb(N(P.dmax));
  const gpx=(d.gpieces||[]).map((p,i)=>{const r=gp[i];if(!r.ok)return r;const Z=zones.find(x=>x.z.id===p.g);
    const Nd=Z&&typeof Z.deb==="number"&&Z.E?rnd(Math.max(r.br,Z.deb*r.kw/Z.E)):(Z?NaN:NaN);
    if(!isFinite(Nd))return {...r,Nd:"",ctl:Z?"⚠️ gainable hors gamme":"⚠️ gainable inconnu"};
    const O=Math.max(1,up(Nd/souple)),per=Nd/O,D=P.diam.map(Number),Pd=D[Math.min(D.length,countLt(D.map(dMaxDeb),per)+1)-1];
    const v=rnd(per/(3600*PI*Math.pow(Pd/1000,2)/4),2),B=P.bouches,bm=B.map(bMax),bo=per>Math.max(...bm)?"Hors liste":(b=>b.w+" × "+b.h)(B[countLt(bm,per)]);
    const U=rnd(N(p.ant)*N(P.paM)*Math.pow(v/N(P.vMax),2)+N(p.coudes)*N(P.coude)+N(P.fixe));
    const w=(v>N(P.vMax)?"⚠️ vitesse trop forte  ":"")+(N(p.ant)>N(P.lmax)?"⚠️ antenne trop longue  ":"")+(bo==="Hors liste"?"⚠️ bouche : ajouter une gaine  ":"")+(typeof Z.pmax==="number"&&U>Z.pmax?"⚠️ pression insuffisante  ":"");
    return {...r,Nd,O,Pd,v,bo,U,ctl:w?w.trim():"✅ OK"}});
  zones.forEach(Z=>{if(!Z.n)return;Z.L=Math.max(0,...gpx.filter(r=>r.z===Z.z.id&&typeof r.U==="number").map(r=>r.U));
    Z.ctl=Z.ref==="Hors gamme"?"⚠️ hors gamme : couper en 2 zones":typeof Z.pmax==="number"?(Z.L>Z.pmax?"⚠️ réseau trop résistant : moyenne pression ou gaines plus courtes":Z.deb<Z.F?"⚠️ débit inférieur au brassage":"✅ OK"):"⚠️ à revoir"});
  /* récap matériel */
  const mat=[];P.ui.forEach(u=>{const qUI=mono.filter(r=>r.ref===u.ref).length+multi.filter(r=>r.ref===u.ref).length+zones.filter(z=>z.ref===u.ref).length,qG=u.grp?mono.filter(r=>r.ref===u.ref).length+zones.filter(z=>z.ref===u.ref).length:0;
    if(qUI)mat.push({ref:u.ref,des:u.type+" : unité intérieure",q:qUI,p:num(u.prix)});if(qG)mat.push({ref:u.grp,des:"Groupe extérieur pour "+u.ref,q:qG,p:num(u.prixG)})});
  mx.forEach(m=>{const q=sys.filter(s=>s.grp===m.ref).length;if(q)mat.push({ref:m.ref,des:"Groupe multisplit MXZ",q,p:num(m.prix)})});
  const rem=N(d.remise)/100;mat.forEach(m=>m.t=isFinite(m.p)?m.q*m.p*(1-rem):"");
  return {mono,multi,sys,zones,gpx,mat,tot:{mono:rnd(sum(mono,r=>r.ok?r.kw:0),2),multi:rnd(sum(multi,r=>r.ok?r.kw:0),2),gain:rnd(sum(zones,z=>z.n?z.E:0),2),
    nMono:mono.filter(r=>r.ok).length,nSys:sys.length,nGain:zones.filter(z=>z.n).length,ht:sum(mat,m=>m.t)}}}
function render(d,P){const C=calc(d,P),tb=siteTb(d,P),ta=siteTa(d),isoO=P.iso.map(i=>i.n),tyO=P.types;
  const tt=C.tot,all=rnd(tt.mono+tt.multi+tt.gain,2);
  const uiCell=r=>r.ok?`<b>${esc(r.ref)}</b>`+(r.u?`<small class="hint"> ${f(r.c,1)} kW chaud · ${f(r.fr,1)} kW froid</small>`:""):"";
  const monoRows=(d.monos||[]).map((p,i)=>{const r=C.mono[i],k="monos."+i;return `<tr><td>${inp(k+".piece",{lab:"Pièce",w:"130px"})}</td><td>${inp(k+".L",{n:1,w:"62px",lab:"Longueur"})}</td><td>${inp(k+".l",{n:1,w:"62px",lab:"Largeur"})}</td><td>${inp(k+".h",{n:1,w:"58px",lab:"Hauteur"})}</td><td>${sel(k+".iso",isoO,{blank:"—"})}</td><td>${sel(k+".type",tyO,{blank:"Défaut ("+P.defType+")"})}</td>
    <td>${inp(k+".tb",{n:1,w:"58px",ph:f(tb),lab:"T° basse"})}</td><td>${inp(k+".ta",{n:1,w:"58px",ph:f(ta),lab:"T° ambiance"})}</td><td class="n">${r.ok?f(r.V,1):""}</td><td class="n">${r.ok?f(r.dT):""}</td><td class="n"><b>${r.ok?f2(r.kw):""}</b></td><td class="n">${r.ok?f0(r.br):""}</td><td>${uiCell(r)}</td><td>${r.ok?esc(r.grp):""}</td><td>${r.ok?chk(r.why):""}</td><td>${delBtn("monos",i)}</td></tr>`});
  const multiRows=(d.multis||[]).map((p,i)=>{const r=C.multi[i],k="multis."+i;return `<tr><td>${inp(k+".sys",{w:"70px",lab:"Système"})}</td><td>${inp(k+".piece",{lab:"Pièce",w:"120px"})}</td><td>${inp(k+".L",{n:1,w:"58px",lab:"L"})}</td><td>${inp(k+".l",{n:1,w:"58px",lab:"l"})}</td><td>${inp(k+".h",{n:1,w:"54px",lab:"h"})}</td><td>${sel(k+".iso",isoO,{blank:"—"})}</td><td>${sel(k+".type",tyO,{blank:"Défaut"})}</td>
    <td>${inp(k+".tb",{n:1,w:"54px",ph:f(tb)})}</td><td>${inp(k+".ta",{n:1,w:"54px",ph:f(ta)})}</td><td class="n"><b>${r.ok?f2(r.kw):""}</b></td><td class="n">${r.ok?f0(r.br):""}</td><td>${uiCell(r)}</td><td>${r.ok?chk(r.why):""}</td><td>${delBtn("multis",i)}</td></tr>`});

function calc(d,P){const tb=(P.lieux.find(l=>l.n===d.lieu)||{}).t,dT=(has(d.amb)?num(d.amb):21)-N(tb),m=1+N(P.marge);

    const M=rnd(q*Lv*dT/1000*m,2),Nf=rnd(K*w/1000*m,2),O=rnd(Lv*N(P.vol));

    const Rk=hors?"Hors gamme":UI[X-1].f,why=hors?"⚠️ + d'unités":X===xd?"💨 Brassage":X===xc?"🔥 Chaud":"❄️ Froid";

    const O=Math.max(countLt(G.map(g=>g.f),F*Gf)+1,countLt(G.map(g=>g.c),E*Gf)+1,countLt(G.map(g=>g.f),H/N(P.tmax))+1,countLt(G.map(g=>g.max),D)+1),ok=O<=G.length,g=ok?G[O-1]:null;
    const L=g?H/g.f:"",ctl=!ok?"⚠️ hors gamme : scinder en 2 systèmes":L<N(P.tmin)?"⚠️ groupe surdimensionné (taux < mini)":ix.some(i=>R[i].Rk==="Hors gamme")?"⚠️ un local hors gamme UI":"✅ OK";
    const fl=x.fluide||d.fluide||"",gwp=N((P.fluides.find(z=>z.n===fl)||{}).gwp),ch=N(x.cu)+N(x.cc),teq=rnd(ch*gwp/1000,2),det=x.det||"Non";
    const ctrl=!ch?"":teq<5?"Non soumis":teq<50?(det==="Oui"?"24 mois":"12 mois"):teq<500?(det==="Oui"?"12 mois":"6 mois"):(det==="Oui"?"6 mois":"3 mois + détection obligatoire");
    const vols=ix.map(i=>R[i].Lv).filter(v=>typeof v==="number"&&v>0),vmin=vols.length?Math.min(...vols):"";
    return {n,k:sk(n),bat:(d.locaux[ix[0]].bat||""),D,E,F,Gf,H,g,L,ctl,fl,gwp,ch,teq,ctrl,vmin,conc:vmin&&ch?rnd(ch/vmin,3):""}});
  const types=P.types.filter(Boolean),qt=types.map(t=>({t,per:UI.map(u=>sum((d.locaux||[]).map((r,i)=>r.type===t&&R[i].Rk===u.f?N(r.nb):0)))}));
  qt.forEach(q=>q.tot=sum(q.per));

<script>
/* =====================================================================
   03 · Calcul des gaines d'un gainable : débit par pièce, Ø, vitesses, bouches, reprise
   ===================================================================== */
(function(){
const V=(P,i,m)=>N((P.vit[i]||{})[m?"m":"c"]);   /* 0 antenne · 1 principale · 2 bouche · 3 grille · 4 reprise */
function tables(P){const D=P.diam.map(Number).filter(x=>x>0).sort((a,b)=>a-b),sec=d=>rnd(PI*Math.pow(d/10,2)/4);
  return {D,ant:D.map(d=>rnd(V(P,0)*sec(d)/10000*3600)),prin:D.map(d=>rnd(V(P,1)*sec(d)/10000*3600)),rep:D.map(d=>rnd(V(P,4)*sec(d)/10000*3600)),
    bou:P.bouches.map(b=>({n:b.w+" × "+b.h,w:N(b.w),h:N(b.h),q:rnd(N(b.w)*N(b.h)/1e6*N(P.libre)*V(P,2)*3600)})),
    gri:P.grilles.map(b=>({n:b.w+" × "+b.h,w:N(b.w),h:N(b.h),q:rnd(N(b.w)*N(b.h)/1e6*N(P.libre)*V(P,3)*3600)})),
    souple:rnd(V(P,0)*PI*Math.pow(N(P.dmax)/1000,2)/4*3600)}}
function calc(d,P){const X=tables(P);
  const R=(d.rows||[]).map(r=>{if(!has(r.S)||!has(r.h))return {ok:false};const E=num(r.S)*num(r.h),F=rnd(E*N(P.vol)),H=has(r.imp)?num(r.imp):F;
    const J=has(r.nb)?num(r.nb):Math.max(1,up(H/X.souple)),K=rnd(H/J);
    const L=K>Math.max(...X.ant)?"> liste":X.D[countLt(X.ant,K)],M=typeof L==="number"?rnd(K/(3600*PI*Math.pow(L/1000,2)/4),2):"";
    const bq=X.bou.map(b=>b.q),O=K>Math.max(...bq)?"Hors liste":X.bou[countLt(bq,K)].n,ob=X.bou.find(b=>b.n===O),Pv=ob?rnd(K/(ob.w*ob.h/1e6*N(P.libre)*3600),2):"";
    const w=(typeof M==="number"&&M>V(P,0,1)?"⚠️ vitesse gaine trop forte  ":"")+(typeof L!=="number"||L>N(P.dmax)?"⚠️ Ø trop gros : ajouter une gaine  ":"")+(typeof Pv==="number"&&Pv>V(P,2,1)?"⚠️ bouche trop petite  ":"")+(N(r.ant)>N(P.lmax)?"⚠️ antenne trop longue  ":"");
    return {ok:true,E,F,H,J,K,L,M,O,Pv,ctl:w?w.trim():"✅ OK"}});
  const ok=R.filter(r=>r.ok),Ht=sum(ok,r=>r.H),U=N(d.unite),mx=Math.max(Ht,U);
  const nbW=ok.filter(r=>r.ctl.startsWith("⚠")).length+(U<Ht?1:0);
  const nG=Math.max(1,N(d.grilles)||1),gq=X.gri.map(g=>g.q),G49=Ht?(mx/nG>Math.max(...gq)?"Hors liste : ajouter une grille":X.gri[countLt(gq,mx/nG)].n):"",gg=X.gri.find(g=>g.n===G49);
  return {R,X,Ht,U,mx,cov:Ht?U/Ht:"",nbW,Jt:sum(ok,r=>r.J),St:sum(ok,r=>N(d.rows[R.indexOf(r)].S)),Et:sum(ok,r=>r.E),
    couvre:Ht?(U>=Ht?"✅ Oui":"⚠️ Non : unité plus grosse ou débits à revoir"):"",sect:Ht?rnd(mx/(V(P,1)*3600)*10000):"",
    dPrin:Ht?(mx>Math.max(...X.prin)?"> 500 : gaine rectangulaire":X.D[countLt(X.prin,mx)]):"",
    grille:G49,vGr:gg?rnd(mx/nG/(gg.w*gg.h/1e6*N(P.libre)*3600),2):"",dRep:Ht?(mx>Math.max(...X.rep)?"> 500 : plusieurs gaines":X.D[countLt(X.rep,mx)]):"",
    nRep:Ht?up(mx/rnd(V(P,4)*PI*Math.pow(N(P.dmax)/1000,2)/4*3600)):""}}
function render(d,P){const C=calc(d,P);
  return `<div class="kpis5">${kpi("💨 Débit total soufflé",f0(C.Ht),"m³/h","main")}${kpi("🌀 Débit de l'unité",f0(C.U),"m³/h")}${kpi("📊 Couverture",C.cov===""?"—":f(C.cov*100,0)+" %","")}${kpi("⭕ Gaines / bouches",C.Jt,"")}${kpi("✅ Contrôle",C.Ht?(C.nbW?C.nbW+" point(s) à revoir":"Tout est OK"):"—","",C.nbW?"warn":"")}</div>
  ${card("① Le chantier et l'unité",`<div class="grid4">${inp("client",{lab:"Client"})}${inp("chantier",{lab:"Chantier"})}${inp("modele",{lab:"Modèle de gainable"})}${inp("unite",{n:1,lab:"Débit nominal de l'unité (m³/h, grande vitesse)"})}</div>`)}

    ${tbl(["Pièce","Surface m²","Hauteur m","#Volume m³","#Débit brassage","Débit imposé","#Débit retenu","Nb gaines (option)","#Nb gaines","#Débit/gaine","#Ø gaine mm","#Vitesse m/s","Antenne (m)","Bouche conseillée","#Vitesse bouche","Contrôle",""],
      (d.rows||[]).map((r,i)=>{const x=C.R[i],k="rows."+i;return `<tr><td>${inp(k+".piece",{w:"120px",lab:"Pièce"})}</td><td>${inp(k+".S",{n:1,w:"62px",lab:"Surface"})}</td><td>${inp(k+".h",{n:1,w:"56px",lab:"Hauteur"})}</td><td class="n">${x.ok?f(x.E,1):""}</td><td class="n">${x.ok?f0(x.F):""}</td><td>${inp(k+".imp",{n:1,w:"66px",lab:"Débit imposé"})}</td><td class="n"><b>${x.ok?f0(x.H):""}</b></td><td>${inp(k+".nb",{n:1,w:"50px",lab:"Nb gaines"})}</td><td class="n">${x.ok?x.J:""}</td><td class="n">${x.ok?f0(x.K):""}</td><td class="n"><b>${x.ok?esc(x.L):""}</b></td><td class="n">${x.ok?f2(x.M):""}</td><td>${inp(k+".ant",{n:1,w:"56px",lab:"Antenne"})}</td><td>${x.ok?esc(x.O):""}</td><td class="n">${x.ok?f2(x.Pv):""}</td><td>${x.ok?chk(x.ctl):""}</td><td>${delBtn("rows",i)}</td></tr>`}),
      `<tr><td>Total</td><td class="n">${f(C.St,1)}</td><td></td><td class="n">${f(C.Et,1)}</td><td></td><td></td><td class="n">${f0(C.Ht)}</td><td></td><td class="n">${C.Jt}</td><td colspan="8"></td></tr>`)}${addBtn("rows","Pièce")}`)}

    <div class="kv"><span>L'unité couvre-t-elle le débit ?</span><b>${chk(C.couvre)}</b></div><div class="kv"><span>Section mini du plénum / départ de soufflage</span><b>${C.sect!==""?f0(C.sect)+" cm²":"—"}</b></div>
    <div class="kv"><span>Gaine principale unique : Ø conseillé</span><b>${esc(C.dPrin)}${typeof C.dPrin==="number"?" mm":""}</b></div></div>
    <p class="hint">Section : à la vitesse cible de la gaine principale (ex. 1 000 cm² = 500 × 200 mm). Ø : pour un réseau en « arête de poisson » (tronc + piquages).</p>`)}
  ${card("④ La reprise d'air",`<div class="kvs"><div class="kv"><span>Débit à reprendre (le plus grand : unité ou soufflage)</span><b>${C.Ht?f0(C.mx)+" m³/h":"—"}</b></div>
    <div class="kv"><span>Nombre de grilles de reprise</span>${inp("grilles",{n:1,w:"70px",ph:"1",lab:"Nombre de grilles"})}</div>
    <div class="kv"><span>Grille de reprise conseillée (par grille)</span><b>${esc(C.grille)}</b></div><div class="kv"><span>Vitesse de passage dans la grille</span><b>${C.vGr!==""?f2(C.vGr)+" m/s":"—"}</b></div>
