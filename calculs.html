<script>
/* =====================================================================
   04 · Ventilation VMC : débits réglementaires par local, Ø, vitesses, bruit, métré et récap
   ===================================================================== */
(function(){
const LK=["cu","sdb","sde","wcu","wcm","glob"];
const vit=(P,i,m)=>N((P.vit[i]||{})[m?"m":"c"]);   /* 0 souple · 1 rigide · 2 collecteur */
function calc(d,P){const D=P.diam.map(x=>({d:N(x.d),q:N(x.q),db:N(x.db)})).sort((a,b)=>a.d-b.d),dd=D.map(x=>x.d);
  const qmax=i=>dd.map(x=>rnd(vit(P,i)*PI*Math.pow(x/1000,2)/4*3600)),QS=qmax(0),QR=qmax(1),QC=qmax(2);
  const nbp=Math.min(Math.max(N(d.pieces),1),7);
  const R=(d.rows||[]).map(r=>{const t=P.types.find(x=>x.n===r.type);if(!t)return {ok:false};
    const H=t.mode==="Logement"?N((P.logement[nbp-1]||{})[LK[N(t.col)-1]]):N(t.base)+N(t.val)*(t.mode==="Par m²"?N(r.S):(t.mode==="Par occupant"||t.mode==="Par appareil")?N(r.occ):0);
    const J=has(r.imp)?num(r.imp):(H?H:"");if(J==="")return {ok:true,t,H,J:"",sens:t.sens,Q:N(t.obj)};
    const rig=r.gaine==="Gaine rigide",Q=rig?QR:QS,M=J>Math.max(...Q)?"> liste":dd[countLt(Q,J)];
    const K=N(r.S)*N(r.h)?rnd(J/(N(r.S)*N(r.h)),1):"",Nv=typeof M==="number"?rnd(J/(3600*PI*Math.pow(M/1000,2)/4),2):"";
    const ref=D.find(x=>x.d===M),Pb=ref&&ref.q?rnd(ref.db+N(P.pente)*Math.log10(J/ref.q)):"",Qo=N(t.obj);
    const w=(typeof Nv==="number"&&Nv>vit(P,rig?1:0,1)?"⚠️ vitesse trop forte  ":"")+(M==="> liste"?"⚠️ débit trop fort pour une gaine  ":"")+(typeof Pb==="number"&&Pb>Qo?"⚠️ bruit : Ø plus grand ou bouche acoustique  ":"");
    return {ok:true,t,sens:t.sens,H,J,K,M,Nv,Pb,Q:Qo,ctl:w?w.trim():"✅ OK",gt:rig?"Gaine rigide":"Gaine souple",bt:t.sens==="Insufflation"?"Bouche d'insufflation":"Bouche d'extraction"}});
  const okJ=R.filter(r=>r.ok&&r.J!==""),ext=sum(okJ.filter(r=>r.sens==="Extraction"),r=>r.J),ins=sum(okJ.filter(r=>r.sens==="Insufflation"),r=>r.J);
  const cais=rnd(Math.max(ext,ins)*(1+N(P.fuites)),-1),coll=q=>q===0?"-":q>Math.max(...QC)?"> 500 : rectangulaire":dd[countLt(QC,q)];
  /* récap par élément et par Ø */
  const rec=P.catalogue.filter(c=>c.n).map(c=>{const per=dd.map(x=>sum((d.metre||[]).filter(m=>m.el===c.n&&N(m.d)===x),m=>m.q)+sum(R.filter(r=>r.ok&&r.gt===c.n&&r.M===x),r=>N((d.rows[R.indexOf(r)]||{}).ant))+R.filter(r=>r.ok&&r.bt===c.n&&r.M===x).length);
    const sans=sum((d.metre||[]).filter(m=>m.el===c.n&&!dd.includes(N(m.d))),m=>m.q),tot=sum(per)+sans;return {n:c.n,u:c.u,per,sans,tot,cmd:c.u==="m"?up(tot*(1+N(P.chutes))):tot}});
  const bou=sum(rec.filter(x=>x.n==="Bouche d'extraction"||x.n==="Bouche d'insufflation"),x=>x.cmd);
  return {R,ext,ins,cais,nb:okJ.length,warn:okJ.filter(r=>String(r.ctl).startsWith("⚠")).length,collE:coll(ext),collI:coll(ins),glob:N((P.logement[nbp-1]||{}).glob),
    eq:ins===0?"-":Math.abs(ins-ext)<=0.1*Math.max(ins,ext)?"✅ Équilibré (écart ≤ 10 %)":"⚠️ Écart > 10 % : ajuster les débits",rec,dd,
    gaines:sum(rec.filter(x=>x.u==="m"),x=>x.cmd),bou,acc:sum(rec.filter(x=>x.u==="u"),x=>x.tot)-bou,antT:sum(d.rows||[],r=>r.ant)}}
function render(d,P){const C=calc(d,P),types=P.types.map(t=>t.n);
  return `<div class="kpis5">${kpi("⬆️ Débit total extrait",f0(C.ext),"m³/h","main")}${kpi("⬇️ Débit total insufflé",f0(C.ins),"m³/h")}${kpi("🌀 Caisson (fuites incl.)",f0(C.cais),"m³/h")}${kpi("🔲 Bouches",C.nb,"")}${kpi("✅ Contrôle",C.nb?(C.warn?C.warn+" point(s) à revoir":"Tout est OK"):"—","",C.warn?"warn":"")}</div>
  ${card("① Le chantier",`<div class="grid4">${inp("client",{lab:"Client"})}${inp("chantier",{lab:"Chantier"})}${inp("pieces",{n:1,lab:"Logement : nombre de pièces principales"})}</div><p class="hint">Séjour + chambres : sert aux débits logement de l'arrêté de 1982.</p>`)}
  ${card("② Les locaux à traiter",`<p class="hint">Une ligne par bouche. Choisir le type de local : le débit réglementaire, le Ø, la vitesse et le bruit se calculent.</p>
    ${tbl(["Local","Type de local","Sens","Surface m²","Hauteur m","Occupants / appareils","#Débit régl.","Débit imposé","#Débit retenu","#Vol/h","Type de gaine","#Ø mm","#Vitesse m/s","Antenne (m)","#Bruit dB(A)","#Objectif","Contrôle",""],
      (d.rows||[]).map((r,i)=>{const x=C.R[i],k="rows."+i;return `<tr><td>${inp(k+".local",{w:"110px",lab:"Local"})}</td><td>${sel(k+".type",types,{blank:"—",w:"230px"})}</td><td>${x.ok?esc(x.sens):""}</td><td>${inp(k+".S",{n:1,w:"56px"})}</td><td>${inp(k+".h",{n:1,w:"52px"})}</td><td>${inp(k+".occ",{n:1,w:"56px"})}</td><td class="n">${x.ok?f0(x.H):""}</td><td>${inp(k+".imp",{n:1,w:"60px"})}</td><td class="n"><b>${x.ok?f0(x.J):""}</b></td><td class="n">${x.K!=null?f(x.K,1):""}</td><td>${sel(k+".gaine",["Gaine souple","Gaine rigide"])}</td><td class="n"><b>${x.M!=null?esc(x.M):""}</b></td><td class="n">${x.Nv!=null?f2(x.Nv):""}</td><td>${inp(k+".ant",{n:1,w:"56px"})}</td><td class="n">${x.Pb!=null?f0(x.Pb):""}</td><td class="n">${x.ok?f0(x.Q):""}</td><td>${x.ctl?chk(x.ctl):""}</td><td>${delBtn("rows",i)}</td></tr>`}),
      `<tr><td colspan="8">Total</td><td class="n">${f0(C.ext+C.ins)}</td><td colspan="4"></td><td class="n">${f(C.antT,1)}</td><td colspan="4"></td></tr>`)}${addBtn("rows","Bouche")}
    <p class="hint">Pour 2 bouches dans un même local, faire 2 lignes et répartir le débit avec « Débit imposé ». Bruit estimé à la bouche : ordre de grandeur.</p>`)}
  ${card("③ Le caisson et les collecteurs",`<div class="kvs"><div class="kv"><span>Débit total extrait</span><b>${f0(C.ext)} m³/h</b></div><div class="kv"><span>Débit total insufflé (double flux / air neuf)</span><b>${f0(C.ins)} m³/h</b></div>
    <div class="kv"><span>Débit du caisson à prévoir (fuites ${f(N(P.fuites)*100,0)} % incluses)</span><b>${f0(C.cais)} m³/h</b></div><div class="kv"><span>Ø du collecteur d'extraction</span><b>${esc(C.collE)}</b></div><div class="kv"><span>Ø du collecteur d'insufflation</span><b>${esc(C.collI)}</b></div>
    <div class="kv"><span>Logement : débit global mini de l'arrêté (petite vitesse)</span><b>${f0(C.glob)} m³/h</b></div><div class="kv"><span>Double flux : équilibre insufflation / extraction</span><b>${chk(C.eq)}</b></div></div>`)}
  ${card("📏 Métré du réseau",`<p class="hint">Une ligne par élément. Les antennes et les bouches des locaux sont déjà comptées dans le récap : ne pas les ressaisir.</p>
    ${tbl(["Réseau / zone","Élément","Ø (mm)","Quantité","Unité","Commentaire",""],(d.metre||[]).map((m,i)=>{const k="metre."+i,c=P.catalogue.find(x=>x.n===m.el);return `<tr><td>${inp(k+".zone",{w:"110px"})}</td><td>${sel(k+".el",P.catalogue.map(c=>c.n),{blank:"—"})}</td><td>${sel(k+".d",C.dd.map(String),{blank:"Sans Ø"})}</td><td>${inp(k+".q",{n:1,w:"64px"})}</td><td>${c?esc(c.u):""}</td><td>${inp(k+".com",{w:"160px"})}</td><td>${delBtn("metre",i)}</td></tr>`}))}${addBtn("metre","Élément")}`)}
  ${card("📦 Récap du métré",`<div class="kpis5">${kpi("📏 Gaines (à commander)",f0(C.gaines),"m")}${kpi("🔲 Bouches",f0(C.bou),"")}${kpi("🧩 Accessoires",f0(C.acc),"u")}${kpi("🌀 Caisson",f0(C.cais),"m³/h")}</div>
    ${tbl(["Élément","Unité"].concat(C.dd.map(x=>"#Ø "+x),["#Sans Ø","#Total","#🛒 À commander"]),C.rec.filter(x=>x.tot).map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.u)}</td>${x.per.map(v=>`<td class="n">${v?f(v,1):'<span class="z">–</span>'}</td>`).join("")}<td class="n">${x.sans?f(x.sans,1):'<span class="z">–</span>'}</td><td class="n">${f(x.tot,1)}</td><td class="n"><b>${f(x.cmd,1)}</b></td></tr>`))}
    <p class="hint">Gaines : antennes des locaux + longueurs du métré ; « À commander » ajoute ${f(N(P.chutes)*100,0)} % de chutes. Vérifier les diamètres réels des piquages et des bouches dans le catalogue fournisseur.</p>`)}`}
const memoTxt=()=>memo([
  ["① Le principe : balayer tout le logement",[["Entrées / sorties","L'air neuf entre par les pièces principales (séjour, chambres) et ressort par les pièces humides (cuisine, salle de bains, WC, cellier)."],["Passage de l'air","Détalonnage des portes intérieures (environ 1 cm, 2 cm pour la cuisine) ou grilles de transfert, sinon l'air ne circule pas."],["Entrées d'air","En simple flux : entrées d'air en menuiserie ou en mur dans chaque pièce principale, adaptées au système (autoréglable ou hygro)."]]],
  ["② Les bons débits",[["Logement","Arrêté du 24 mars 1982 : débits fixés par pièce humide selon le nombre de pièces principales (ex. T4 : cuisine 120, SdB 30, WC 30 m³/h). Hygroréglable : avis technique du fabricant."],["Lieux de travail","Code du travail R4222-6 : 25 m³/h par occupant en bureau, 30 en réunion, restauration et vente, 45 en atelier léger."],["ERP","RSDT art. 64 : 18 m³/h par occupant (bureaux, réunion), 22 (commerce, restauration), 15 à 18 (enseignement). Sanitaires : WC collectif 30, douche 45, groupés 30 + 15 par appareil."],["Caisson","Débit du caisson = total des bouches + 10 % de fuites. Il doit tenir la pression nécessaire au point le plus défavorisé du réseau."]]],
  ["③ Les vitesses et le bruit",[["Vitesses","Antenne en gaine souple : 3 m/s visés, 4 m/s maxi. Gaine rigide et collecteur : 4 m/s visés, 5 m/s maxi. Réseau horizontal 6 m/s maxi, vertical 5 m/s maxi."],["Bruit en logement","Arrêté du 30 juin 1999 : bruit de la VMC ≤ 30 dB(A) dans les pièces principales, ≤ 35 dB(A) en cuisine."],["Réduire le bruit","Silencieux en sortie de caisson, dernier mètre en gaine souple acoustique, caisson suspendu sur plots antivibratiles, bouches dimensionnées sans être forcées."]]],
  ["④ Le réseau",[["Tracé","Le plus court et le plus droit possible ; peu de coudes ; tés et piquages plutôt que coudes serrés. Gaines souples bien tendues, jamais écrasées."],["Isolation","Gaines isolées en combles ou local non chauffé (risque de condensation) ; en double flux, isoler aussi l'air neuf et le rejet."],["Étanchéité","Raccords avec colliers et adhésif aluminium. Les fuites font perdre du débit aux bouches les plus éloignées."],["Entretien du réseau","Trappes de visite sur les réseaux rigides (changements de direction, longs tronçons) pour le nettoyage."],["Rejet et prise d'air","Rejet en toiture par sortie adaptée, éloigné des prises d'air neuf (8 m en tertiaire, RSDT). Clapets coupe-feu à la traversée des parois coupe-feu en ERP."],["Équilibrage","Registres de réglage par antenne (tertiaire) ou bouches autoréglables / hygroréglables (logement)."]]],
  ["⑤ Mise en service et entretien",[["Mise en service","Mesurer le débit à chaque bouche (anémomètre ou cône de mesure), équilibrer, vérifier le bruit. Remettre au client la notice et le PV de mesures."],["Entretien","Bouches nettoyées 2 fois par an, filtres de double flux tous les 3 à 6 mois, caisson et réseau vérifiés une fois par an."]]]],
  "Sources : arrêtés du 24/03/1982 et 28/10/1983 (XPair) ; RSDT art. 64 ; Code du travail R4222-6 ; arrêté du 30/06/1999 ; XPair ; NF DTU 68.3. Valeurs indicatives d'avant-projet.");
TOOLS.push({k:"vmc",ic:"💨",c:"#6A4FB3",n:"Ventilation VMC",s:"Débits réglementaires, Ø, bruit, métré",long:"Débits réglementaires par local (logement, lieux de travail, ERP), Ø des gaines, vitesses, bruit estimé par bouche, caisson, métré et récap à commander.",

<script>

(function(){

const APP=[
 {k:"frit",n:"🍟 Friteuse",fam:d=>d.energie==="Électrique"?"Friteuse électrique":"Friteuse gaz",b:(c,t,P)=>rnd(c.cs*N(t.frites)*N(P.portion)/N(P.duree)*N(P.pointe),1),x:(c,t,P)=>`${f0(c.cs)} couv. × ${f0(N(t.frites)*100)} % frites × ${f2(N(P.portion))} kg ÷ ${f(N(P.duree),1)} h × pointe ${f(N(P.pointe),1)}`},

      <td>${inp(p+".q",{n:1,w:"44px",ph:"1"})}</td><td>${sel(p+".incl",["Oui","Non"])}</td><td class="n">${x.ok?f(x.el,1):""}</td><td class="n">${x.ok?f(x.gaz,1):""}</td><td class="n">${x.ok?f0(x.ex):""}</td><td class="n">${x.ok&&x.tot!==""?f0(x.tot)+" €":""}</td><td>${lib?delBtn("libres",k):""}</td></tr>`};

  ${card("① La boulangerie",`<div class="grid4">${inp("client",{lab:"Client"})}${inp("adresse",{lab:"Adresse"})}${sel("type",P.types.map(t=>t.n),{lab:"🥖 Type de boulangerie",blank:"—"})}${inp("bj",{n:1,lab:"Production (équivalent baguettes / jour)"})}${sel("energie",["Électrique","Gaz"],{lab:"🔥 Énergie du four"})}${sel("tension",["Tri 400 V","Mono 230 V"],{lab:"⚡ Alimentation"})}</div>
    <p class="hint">Une baguette ≈ ${f0(N(P.pate)*1000)} g de pâte. Pour un terminal de cuisson, compter les baguettes cuites par jour.</p>`)}
  ${card("② Le matériel",`<p class="hint">Le modèle conseillé est proposé ; le client peut en choisir un autre de la même famille. « Inclure » sur Non retire l'appareil du bilan.</p>
    ${tbl(["Appareil","#Besoin","Unité","Calcul","✅ Conseillé","👉 Choix","Qté","Inclure","#Élec. kW","#Gaz kW","#Buées m³/h","#Total HT",""],C.L.map(x=>row(x)).concat(C.Lb.map((x,i)=>row(x,i,1))),`<tr><td colspan="8">TOTAL</td><td class="n">${f(C.el,1)}</td><td class="n">${f(C.gaz,1)}</td><td class="n">${f0(C.ex)}</td><td class="n">${C.achat?f0(C.achat)+" €":"—"}</td><td></td></tr>`)}${addBtn("libres","Ligne libre (tout le catalogue)")}`)}
  <div class="pgrid">${card("③ Le bilan",`<div class="kvs"><div class="kv"><span>⚡ Puissance électrique installée</span><b>${f(C.el,1)} kW</b></div><div class="kv"><span>🔌 Intensité si tout tourne</span><b>${f0(C.iA)} A</b></div><div class="kv"><span>🔥 Puissance gaz</span><b>${f(C.gaz,1)} kW</b></div><div class="kv"><span>💨 Extraction des buées</span><b>${f0(C.ex)} m³/h</b></div><div class="kv"><span>💧 Eau de coulage</span><b>${f0(C.eauJ)} L/jour</b></div><div class="kv big"><span>💶 PRIX DE VENTE HT</span><b>${C.vente?f0(C.vente)+" €":"prix à remplir"}</b></div></div>
    <p class="hint">Valeurs indicatives d'avant-projet. Puissances et prix à corriger dans le catalogue (⚙️ Réglages) avec les fiches des fournisseurs.</p>`)}
  ${card("④ Alertes",`<ul class="alerts">${C.al.map(a=>`<li>${chk(a)}</li>`).join("")}</ul>`)}</div>`}
const memoTxt=()=>memo([["Les questions à poser au boulanger",[["Production","Combien de baguettes et de pains spéciaux par jour ? Pointe du week-end ? Viennoiserie et pâtisserie maison ?"],["Organisation","Travail en direct ou en pousse contrôlée (nuit) ? Heure d'ouverture ? Nombre de personnes au fournil ?"],["Énergie","Puissance du compteur, tri 400 V disponible ? Gaz de ville ? Préférence four à soles ou rotatif ?"],["Locaux","Surface du fournil, hauteur sous plafond (four rotatif), accès pour les livraisons et la manutention du four."]]],
  ["Les rappels",[["Four","Prévoir la buée (extraction au-dessus des portes) et la chaleur rejetée dans le fournil ; un four rotatif demande un conduit de fumée en gaz."],["Pousse contrôlée","Le groupe froid se met dehors ou sur une centrale ; le bilan se fait avec l'outil « Blocage de pâte »."],["Eau","Refroidisseur d'eau près du pétrin : l'eau froide tient la température de la pâte en été."]]]],
  "Valeurs indicatives : à valider avec le boulanger et le fournisseur de matériel.");
TOOLS.push({k:"boul",ic:"🥐",c:"#A88F62",n:"Matériel boulangerie",s:"Fournil : pétrin, four, pousse, froid",long:"Production de la boulangerie → machines conseillées (pétrin, diviseuse, four, pousse contrôlée, froid) → électricité, gaz, buées, eau et prix.",
  blank:()=>({client:"",adresse:"",type:"",bj:"",energie:"Électrique",tension:"Tri 400 V",app:{},libres:[]}),rows:{libres:()=>({choix:"",q:"1",incl:"Oui"})},render,calc,memo:memoTxt,
  sum:(d,P)=>{const C=calc(d,P);return `${f(C.el,1)} kW élec.${C.gaz?" · "+f(C.gaz,1)+" kW gaz":""}`},
  regl:[{t:"table",p:"types",lab:"🥖 Types de boulangerie",cols:[["n","Type"],["vienn","Viennoiseries par baguette",1],["bloc","Part en pousse contrôlée",1],["batteur","Batteur (L)",1],["surg","Surgélation (1 = oui)",1],["term","Terminal de cuisson (1 = oui)",1]]},
    {t:"nums",lab:"⚙️ Ratios",items:[["pate","Pâte par baguette (kg)"],["petr","Pétrissées par jour"],["eau","Eau dans la pâte (L/kg)"],["seuilFac","Façonneuse au-delà de (baguettes/j)"],["pointe","Part cuite en pointe"],["hPointe","Durée de la pointe (h)"],["bm2","Baguettes par m² de sole et par heure"],["parPlaque","Viennoiseries par plaque"],["fournV","Fournées de viennoiserie"],["bCh","Baguettes par chariot de pousse"],["iMax","Alerte intensité au-delà de (A)"],["coef","Coefficient de vente"]]},
    {t:"table",p:"cat",lab:"📦 Catalogue matériel boulangerie",hint:"Valeurs de départ indicatives : à remplacer par les fiches des fournisseurs. Garder chaque famille groupée, par capacité croissante.",cols:[["fam","Famille"],["n","Modèle"],["cap","Capacité",1],["u","Unité"],["el","Élec. kW",1],["gaz","Gaz kW",1],["ex","Buées m³/h",1],["prix","Prix achat HT",1],["four","Fournisseur / réf."]]}]});
})();

<script>
/* =====================================================================
   Contenu des PDF par outil (chambre froide, salle de process, blocage) + dossier complet d'un projet
   ===================================================================== */
(function(){
const hsP=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+"h"+String(m%60).padStart(2,"0")};
const kw=x=>f2(x)+" kW";
/* « et si » : on relance le calcul avec des valeurs plus fortes et on compare à la puissance prévue */
function siRows(t,d,P,base,key,cases){return cases.filter(Boolean).map(([lab,patch])=>{const x=Object.assign(clone(d),patch),C=t.calc(x,P),v=key(C),r=base?v/base-1:0;
  return [lab,kw(v),r<=0.001?"Couvert par la marge de sécurité":"Il manquerait "+f0(r*100)+" % : refroidissement plus long, température qui remonte",r>0.001]})}
/* ---------- chambre froide ---------- */
const cf=T("cf");if(cf)cf.pdf=(d,P)=>{const C=cf.calc(d,P),pr=C.pr,J=C.J,tch=N(d.tch);
  const postes=[["Transmission par les parois",J.trans],["Renouvellement d'air (portes)",J.air],["Refroidissement du produit",J.prod],["Emballages",J.emb],["Respiration des produits",J.resp],["Personnes",J.pers],["Éclairage",J.ecl],["Ventilateurs",J.vent],["Autres apports",J.aut],["Dégivrage",J.deg]].filter(r=>r[1]>0.0005);
  return {titre:"Chambre froide",kpis:[["Puissance à installer",kw(C.Pk)],["Température",f(tch,1)+" °C"],["Volume",f(C.V,1)+" m³"],["Évaporation",isFinite(C.To)?f(C.To,1)+" °C":"-"]],
   hyp:[["Produit stocké",pr?pr.n:"-",1],["Température et humidité de la chambre",f(tch,1)+" °C"+(pr?" / "+f0(N(pr.hr))+" % HR":"")],["Dimensions intérieures",`${f2(N(d.L))} x ${f2(N(d.l))} x ${f2(N(d.h))} m (${f(C.V,1)} m³)`],
     ["Produit entrant par 24 h",f0(N(d.kg))+" kg",1],["Température du produit à l'entrée",f(N(d.tin),1)+" °C",1],["Mise en température du produit en",f(num(d.dur),1)+" h",1],["Emballages entrant par 24 h",f0(N(d.emb))+" kg"],
     ["Stock maximum présent",f0(N(d.stock))+" kg"],["Ouvertures de porte",d.usage==="Intensive"?"Intensives (portes souvent ouvertes)":"Normales",1],["Personnes dans la chambre",f0(N(d.pers))+" pers., "+f(N(d.hpers),1)+" h par jour"],
     ["Températures autour de la chambre",`murs ${f(N(d.tloc),0)} °C, plafond ${f(has(d.tplaf)?num(d.tplaf):N(d.tloc),0)} °C, sol ${f(N(d.tsol),0)} °C`],["Air autour du groupe de condensation",f(N(d.tair),0)+" °C"]],
   si:siRows(cf,d,P,C.Pk,x=>x.Pk,[["Produit entrant x 1,5 ("+f0(N(d.kg)*1.5)+" kg)",{kg:N(d.kg)*1.5}],["Produit entrant x 2 ("+f0(N(d.kg)*2)+" kg)",{kg:N(d.kg)*2}],["Produit entré 10 °C plus chaud ("+f(N(d.tin)+10,0)+" °C)",{tin:N(d.tin)+10}],d.usage!=="Intensive"?["Portes souvent ouvertes",{usage:"Intensive"}]:null,["Refroidissement voulu deux fois plus vite",{dur:String((num(d.dur)||24)/2)}]]),
   sections:[{t:"Parois",head:["Paroi","Surface","Type","Ép.","T° côté chaud","U","Apport"],rows:C.W.map(w=>[w.n,f2(w.Sf)+" m²",w.wt||"-",has(w.we)?w.we+" mm":"-",(has(w.Tc)?f(num(w.Tc),0):"-")+" °C",typeof w.U==="number"?f(w.U,3):"-",f0(w.Ap)+" W"]),cols:{6:{halign:"right",fontStyle:"bold"}}},
    {t:"Bilan sur 24 heures",head:["Poste","kWh / 24 h","Part"],rows:postes.map(([a,b])=>[a,f2(b),C.tot?f0(b/C.tot*100)+" %":""]).concat([[{content:"TOTAL",styles:{fontStyle:"bold"}},{content:f2(C.tot),styles:{fontStyle:"bold"}},""]]),cols:{1:{halign:"right"},2:{halign:"right"}}},
    {t:"Résultat",rows:[["Énergie à évacuer sur 24 h",f2(C.tot)+" kWh"],["Temps de fonctionnement retenu",f0(C.tf)+" h par jour"],["Coefficient de sécurité",f0(N(P.secu)*100)+" %"],["Puissance frigorifique à installer",kw(C.Pk)],["Ratio",C.ratio!==""?f0(C.ratio)+" W/m³":"-"]]},
    {t:"Évaporateur et tuyauteries",rows:[["Fluide",(C.fl&&C.fl.n)||"-"],["Température d'évaporation",isFinite(C.To)?f(C.To,1)+" °C (écart "+f(C.dt,1)+" K)":"-"],["Évaporateur conseillé",C.nEvap+" x "+C.typeEv+", ailettes "+C.ail],["Dégivrage",C.degiv],["Brassage mini",C.brass!==""?f0(C.brass)+" m³/h":"-"],["Panneaux conseillés",C.ep],
      ["Ligne liquide",C.Lq.use?C.Lq.d+'"':"non utilisée"],["Ligne d'aspiration",C.As.use?C.As.d+'"':"non utilisée"],["Détendeur",C.typeDet]]}],
   regu:reguFroid(tch,C.To,pr,P)}};
/* ---------- salles de process ---------- */
const pc=T("process");if(pc)pc.pdf=(d,P)=>{const C=pc.calc(d,P),T_=C.T_,R=PAR.cf.regu||{};
  if(C.mode==="salle")return {titre:T_.n||"Salle de process",kpis:[["Froid à installer",kw(C.froid)],["Réchauffage",kw(C.chaud)],["Eau à retirer",f(C.deshu,2)+" kg/h"],["Consigne",f(C.t,0)+" °C / "+f0(C.hr)+" %"]],
    hyp:[["Type de salle",T_.n||"-",1],["Température et humidité",f(C.t,1)+" °C / "+f0(C.hr)+" % HR"],["Dimensions intérieures",`${f2(N(d.L))} x ${f2(N(d.l))} x ${f2(N(d.h))} m`],["Produit entrant par jour",f0(N(d.kg))+" kg",1],["Température du produit à l'entrée",f(has(d.tin)?num(d.tin):N(T_.tin),1)+" °C",1],
      ["Produit présent au plus plein",f0(N(d.stock))+" kg",1],["Perte de poids sur le cycle",f(has(d.perte)?num(d.perte):N(T_.perte),1)+" %",1],["Durée du cycle",f(has(d.jours)?num(d.jours):N(T_.jours),0)+" jours",1],["Local autour",f(has(d.tloc)?num(d.tloc):25,0)+" °C / "+f0(has(d.hrloc)?num(d.hrloc):60)+" %"]],
    si:siRows(pc,d,P,C.froid,x=>x.froid,[["Salle 1,5 fois plus pleine ("+f0(N(d.stock)*1.5)+" kg)",{stock:N(d.stock)*1.5}],["Séchage 30 % plus rapide",{jours:String((has(d.jours)?num(d.jours):N(T_.jours))*0.7)}],["Produit entrant x 2",{kg:N(d.kg)*2}]]),
    sections:[{t:"Bilan (moyenne sur 24 h)",head:["Poste","W"],rows:[["Parois",C.trans],["Mise en température du produit",C.prod],["Affinage / fermentation",C.ferm],["Ventilateurs",C.vent],["Éclairage",C.ecl],["Personnes",C.pers],["Eau évaporée des produits",-C.lat],["Bilan sensible (+ froid, - chauffage)",C.sens]].map(([a,b])=>[a,f0(b)]),cols:{1:{halign:"right"}}},
      {t:"Résultat",rows:[["Eau retirée aux produits",f(C.mw,2)+" kg/h"],["Froid à installer",kw(C.froid)],["Réchauffage",kw(C.chaud)],["Humidification",C.humi?f(C.humi,2)+" kg/h":"non nécessaire"],["Évaporation",f(C.To,1)+" °C"],["Vitesse d'air sur produits",T_.air||"-"]]}],
    regu:[{t:"Ambiance",rows:[["Consigne température",f(C.t,1)+" °C","Bande ± 1 K"],["Consigne humidité",f0(C.hr)+" % HR","Bande ± 3 %"],["Priorité","Température d'abord, puis humidité",""],["Déshumidification","Par le froid, réchauffage en même temps",C.chaud?"Batterie "+kw(C.chaud):""],["Humidification",C.humi||T_.humiOpt?"Si l'humidité passe 5 % sous la consigne":"Non prévue",""]]},
      {t:"Air et dégivrage",rows:[["Ventilation",/très lent/.test(T_.air||"")?"Cycles lents (ex. 10 min en marche / 20 min arrêt)":"Continue à petite vitesse","Ajuster selon la croûte des produits"],["Dégivrage",C.To<-1?"Naturel, "+f0(N(R.degPosN))+" par jour":"Arrêts du froid suffisants",""],["Anti-court-cycle compresseur",f0(N(R.antiCC))+" min",""]]},
      {t:"Alarmes",rows:[["Température haute",f(C.t+3,0)+" °C après 60 min",""],["Température basse",f(C.t-3,0)+" °C",""],["Humidité",f0(C.hr-10)+" à "+f0(Math.min(99,C.hr+5))+" % HR","Hors plage pendant 2 h"]]}]};
  return {titre:T_.n||"Cellule",kpis:[["Puissance évaporateur",kw(C.froid)],["Air soufflé",f(C.t,0)+" °C"],["Cycle",C.mode==="tunnel"?"continu":f(C.dur,1)+" h"],["Produit",f(C.kgh,1)+" kg/h"]],
    hyp:[["Type",T_.n||"-",1],["Produit",(C.pr&&C.pr.n)||"-"],[C.mode==="tunnel"?"Débit de produit":"Charge par cycle",C.mode==="tunnel"?f0(N(d.kgh))+" kg/h":f0(N(d.kg))+" kg",1],["Emballages, grilles, bacs",C.mode==="tunnel"?f0(N(d.embh))+" kg/h":f0(N(d.emb))+" kg",1],["Température d'entrée du produit",f(C.tin,0)+" °C",1],["Température à cœur visée",f(C.tfin,0)+" °C"],C.mode==="tunnel"?null:["Durée du cycle",f(C.dur,1)+" h",1]].filter(Boolean),
    si:siRows(pc,d,P,C.froid,x=>x.froid,C.mode==="tunnel"?[["Débit x 1,5",{kgh:N(d.kgh)*1.5}]]:[["Charge x 1,5 ("+f0(N(d.kg)*1.5)+" kg)",{kg:N(d.kg)*1.5}],["Charge x 2",{kg:N(d.kg)*2}],["Cycle 25 % plus court",{dur:String(C.dur*0.75)}],["Produit entré 20 °C plus chaud",{tin:String(C.tin+20)}]]),
    sections:[{t:"Bilan",head:["Poste","W"],rows:[["Produit",C.prod],["Emballages et supports",C.emb],["Parois",C.transC],["Ventilateurs",C.fans],["Ouvertures",C.inf],["TOTAL",C.totW]].map(([a,b])=>[a,f0(b)]),cols:{1:{halign:"right"}}},{t:"Repère",text:T_.regle||""}],
    regu:[{t:"Cycle",rows:[["Fin de cycle","Sonde à cœur à "+f(C.tfin,0)+" °C","Piquer la sonde dans la plus grosse pièce"],["Température de l'air",f(C.t,0)+" °C",""],["Durée maxi (alarme)",C.mode==="tunnel"?"-":f0(C.dur*60)+" min",""],["Après le cycle","Conservation à "+(C.tfin<0?"-20":"+3")+" °C",""]]},{t:"Dégivrage",rows:[["Avant chaque cycle",C.t<0?"Électrique, fin à "+f0(N(R.degNegFin))+" °C":"Naturel",""],["Égouttage",f0(N(R.egout))+" min",""]]}]}};
/* ---------- blocage / pousse ---------- */
const bl=T("blocage");if(bl)bl.pdf=(d,P)=>{const C=bl.calc(d,P),pr=C.pr||{},R=PAR.cf.regu||{};
  return {titre:"Blocage / pousse contrôlée",kpis:[["Froid",kw(C.froid)],["Chauffage",kw(C.chaud)],["Humidification",f(C.humi,2)+" kg/h"],["Pâte",f0(C.m)+" kg"]],
   hyp:[["Produit",pr.n||"-",1],["Chariots x plaques x pâte",`${f0(N(d.chariots))} x ${f0(C.npl)} x ${f(C.kgp,2)} kg = ${f0(C.m)} kg`,1],["Température de la pâte à l'entrée",f(has(d.tin)?num(d.tin):24,0)+" °C",1],["Blocage",f(C.tb,1)+" °C, descente en "+f(C.tdes,1)+" h",1],["Pousse",f(C.tp,0)+" °C / "+f0(C.hrp)+" % HR en "+f(C.tpou,1)+" h"],["Mise en chambre / enfournement",(d.mise||"-")+" / "+(d.enf||"-")],["Local autour",f(N(d.tloc),0)+" °C"]],
   si:siRows(bl,d,P,C.froid,x=>x.froid,[["Un chariot de plus",{chariots:N(d.chariots)+1}],["Pâte entrée 5 °C plus chaude",{tin:String((has(d.tin)?num(d.tin):24)+5)}],["Descente 30 % plus rapide",{tdes:String(C.tdes*0.7)}]]),
   sections:[{t:"Puissances",rows:[["Froid (descente ou maintien, le plus fort)",kw(C.froid)],["Chauffage de remontée et pousse",kw(C.chaud)],["Humidification",f(C.humi,2)+" kg/h"],["Évaporation",f(C.To,1)+" °C"],["Panneaux conseillés",C.ep]]}].concat(C.prog?[{t:"Programme de la nuit",head:["Étape","Début","Durée"],rows:C.prog.steps.map(s=>[s[0],hsP(s[1]),f(s[2]/60,1)+" h"])}]:[]),
   regu:[{t:"Programme",rows:(C.prog?C.prog.steps.map(s=>[s[0],"à "+hsP(s[1])+" pendant "+f(s[2]/60,1)+" h",""]):[["Programme","à saisir (heures de mise en chambre et d'enfournement)",""]])},
     {t:"Consignes",rows:[["Blocage",f(C.tb,1)+" °C","Différentiel 1 K"],["Pousse",f(C.tp,0)+" °C / "+f0(C.hrp)+" % HR","Humidité ± 3 %"],["Alarme haute en blocage",f(C.tb+4,0)+" °C après 30 min",""],["Dégivrage","Avant la remontée, naturel",""],["Anti-court-cycle compresseur",f0(N(R.antiCC))+" min",""]]}]}};
/* ---------- dossier complet d'un projet ---------- */
const pj=T("projet");if(pj)pj.pdf=()=>({});
window.pdfProjet=async function(kind){const p=cur();if(!p)return;const items=TOOLS.filter(t=>t.k!=="projet").flatMap(t=>(DOS[t.k]||[]).filter(x=>x.proj===p.id).map(x=>[t,x]));
  if(!items.length){toast("Projet vide : ajoute d'abord des calculs");return}
  const X=await pdfStart(p.soc||"groupe",kind==="regu"?"regu":"note");X.projet=true;const valid=p.valid!=="Non",pr=items;
  if(kind==="regu"){if(!pr.length){toast("Aucune fiche avec réglages dans ce projet");return}pr.forEach(([t,x],i)=>pdfRegu(X,t,{...x,client:x.client||p.client,chantier:x.chantier||p.chantier,devis:x.devis||p.devis},specOf(t,x),i+1));
    return X.end("Reglages regulateurs - "+(p.nom||p.client||"projet"),"Réglages conseillés, à confirmer selon le matériel posé.")}
  X.page("Dossier technique",p.nom||"Projet");X.client(p,{titre:"Projet"});
  const res=([t,x])=>{try{const C=t.calc(x,PAR[t.k]);return t.k==="cf"?kw(C.Pk):t.k==="process"||t.k==="blocage"?kw(C.froid)+(C.chaud?" froid / "+kw(C.chaud)+" chaud":""):t.sum?t.sum(x,PAR[t.k]):((domSpec(t,x,PAR[t.k]).kpis[0]||[])[1]||"")}catch(e){return ""}};
  X.title("Sommaire");X.table(["N°","Fiche","Outil","Résultat"],items.map((it,i)=>[String(i+1),it[1].nom||"Sans nom",it[0].n,res(it)]),{cols:{0:{cellWidth:10},3:{halign:"right"}}});
  /* centrale */
  const rows=[];items.forEach(([t,x])=>{if(!["cf","process","blocage"].includes(t.k)||(p.excl||{})[x.id])return;try{const C=t.calc(x,PAR[t.k]),kwv=t.k==="cf"?C.Pk:C.froid,tt=t.k==="cf"?N(x.tch):t.k==="blocage"?C.tb:C.t;rows.push([x.nom||t.n,f(tt,0)+" °C",isFinite(C.To)?f(C.To,0)+" °C":"-",kw(kwv),tt<N(PAR.projet.seuilNeg)?"négatif":"positif"])}catch(e){}});
  if(rows.length>1){X.title("Centrale frigorifique (pré-dimensionnement)");X.table(["Chambre","T°","Évaporation","Besoin","Circuit"],rows,{cols:{3:{halign:"right"}}});X.text("Le détail des circuits (foisonnement, compresseurs, condenseur) figure dans l'outil Projet ; à confirmer avec le logiciel du fabricant.",{s:8.4,c:X.G})}
  pr.forEach(([t,x],i)=>pdfSheet(X,t,{...x,client:x.client||p.client,chantier:x.chantier||p.chantier,devis:x.devis||p.devis},specOf(t,x),valid,i+1));
  if(valid){X.page("Validation du dossier",p.nom||"Projet");X.text("Le client confirme les conditions d'utilisation retenues dans chaque fiche (quantités et températures des produits entrants, ouvertures de porte, durées de cycle). Les puissances de l'installation sont calculées pour ces conditions ; une utilisation au-delà peut empêcher de tenir les températures dans les délais prévus.",{s:9});
    X.table(["Fiche","Conditions principales"],pr.map(([t,x],i)=>{const h=(specOf(t,x).hyp||[]).filter(r=>r[2]).map(r=>r[0]+" : "+r[1]).join(" ; ");return [(i+1)+". "+(x.nom||t.n),h]}),{cols:{0:{cellWidth:55}}});X.sign("Le client - « Bon pour accord sur les conditions d'utilisation des fiches 1 à "+pr.length+" »")}
  return X.end("Dossier technique - "+(p.nom||p.client||"projet"))};
})();
</script>
<script>
/* =====================================================================
   PDF pour tous les outils : la note est lue sur l'écran de calcul de l'outil (mêmes chiffres),
   + fiche de réglage / mise en service propre à chaque outil.
   ===================================================================== */
(function(){
const kw=x=>f2(x)+" kW";
function vOf(el){if(!el)return "";if(el.tagName==="SELECT"){const o=el.querySelector("option[selected]")||el.querySelector("option");const t=o?o.textContent.trim():"";return /^—|^— /.test(t)?"":t}
  const v=el.getAttribute("value")||"";if(v)return v;const ph=el.getAttribute("placeholder")||"";return ph&&!/^ex\.|^Ex\./.test(ph)?ph.replace(/ estimé$/,"")+" (auto)":""}
function cellT(td){const c=td.querySelector("input,select");if(c)return vOf(c);const x=td.cloneNode(true);x.querySelectorAll("button,small.hint").forEach(b=>b.remove());return x.textContent.replace(/\s+/g," ").trim()}
function labT(l){return [...l.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(" ").replace(/\s+/g," ").trim()}
/* l'écran de l'outil, rendu hors de la page, devient la note de calcul */
window.domSpec=function(t,d,P){const sv=[TOOL,CURID[t.k]];let html="";TOOL=t.k;CURID[t.k]=d.id;try{html=t.render(d,P)}catch(e){html=""}finally{TOOL=sv[0];CURID[t.k]=sv[1]}
  const box=document.createElement("div");box.innerHTML=html;
  const kpis=[...box.querySelectorAll(".kpis5 .kpi")].slice(0,4).map(k=>[(k.querySelector("span")||{}).textContent||"",((k.querySelector("b")||{}).textContent||"").replace(/\s+/g," ").trim()]);
  const skip=["client","chantier","adresse","nom"],hyp=[];
  box.querySelectorAll("label.f").forEach(l=>{if(l.closest("table"))return;const c=l.querySelector("input,select");if(!c||skip.includes(c.getAttribute("data-f")))return;const v=vOf(c);if(v)hyp.push([labT(l),v,c.tagName==="SELECT"?0:1])});
  const sections=[];box.querySelectorAll("section.card").forEach(card=>{const h=card.querySelector("h2");if(!h)return;const ht=h.cloneNode(true);ht.querySelectorAll("small").forEach(s=>s.remove());const title=ht.textContent.replace(/^[①-⑩]\s*/,"").trim();
    card.querySelectorAll("table").forEach(tb=>{let head=[...tb.querySelectorAll("thead th")].map(th=>th.textContent.trim());let rows=[...tb.querySelectorAll("tbody tr, tfoot tr")].map(tr=>[...tr.children].map(cellT)).filter(r=>r.some(x=>x));
      const keep=head.map((x,i)=>rows.some(r=>r[i])&&!(head.length>8&&/^(Calcul|Détail du calcul|Commentaire|Unité)$/i.test(x)));if(!head.length)rows[0]&&rows[0].forEach((x,i)=>keep[i]=rows.some(r=>r[i]));head=head.filter((x,i)=>keep[i]);rows=rows.map(r=>r.filter((x,i)=>keep[i]));if(rows.length)sections.push({t:title,head:head.length?head:null,rows,fs:head.length>9?6.8:head.length>7?7.6:undefined})});
    const kv=[...card.querySelectorAll(".kvs .kv")].map(k=>[(k.querySelector("span")||{}).textContent||"",((k.querySelector("b")||{}).textContent||"").replace(/\s+/g," ").trim()]);if(kv.length)sections.push({t:title,rows:kv});
    const li=[...card.querySelectorAll("ul.alerts li")].map(x=>"- "+x.textContent.trim());if(li.length)sections.push({t:title,text:li.join("\n")})});
  return {titre:t.n,kpis,hyp,sections}};
/* ---------- réglages / mise en service par outil ---------- */
const set=(k,fn)=>{const t=T(k);if(t)t.regu=fn};
set("clim",(d,P)=>{const C=T("clim").calc(d,P);return [{t:"Consignes conseillées",rows:[["Mode","Automatique, ou chaud / froid selon la saison",""],["Consigne en froid","24 à 26 °C","Pas plus de 7 à 8 °C sous la température extérieure"],["Consigne en chaud","19 à 21 °C",""],["Limites de consigne","19 à 26 °C","Verrouillées sur la télécommande ou l'appli"],["Ventilation","Automatique",""],["Ailettes","Froid : horizontales ; chaud : vers le bas",""]]},
  {t:"Unités posées",rows:(C.mono||[]).concat(C.multi||[]).filter(r=>r.ok).map(r=>[r.piece||"Pièce",r.ref||"-",f2(r.kw)+" kW calculés"]).concat((C.zones||[]).filter(z=>z.n).map(z=>["Gainable "+(z.z.n||z.z.id||""),z.ref||"-",typeof z.L==="number"?"Pression statique à régler : "+f0(z.L)+" Pa, débit "+f0(z.deb)+" m³/h":""]))},
  {t:"Entretien",rows:[["Filtres","Nettoyage tous les 3 mois",""],["Condensats","Contrôle de l'écoulement à chaque visite",""]]}]});
set("drv",(d,P)=>{const C=T("drv").calc(d,P);return [{t:"Consignes conseillées",rows:[["Consigne en froid","24 à 26 °C",""],["Consigne en chaud","19 à 21 °C",""],["Limites de consigne","19 à 26 °C","Sur la commande centralisée"],["Plages horaires","Selon l'occupation (inoccupé : 16 °C en chaud, arrêt en froid)",""],["Mode des unités","Imposé par le maître de chaque système (pas de conflit chaud / froid)",""]]},
  {t:"Fluide et contrôles",head:["Système","Charge totale","t éq. CO2","Contrôle d'étanchéité"],rows:(C.sys||[]).map(s=>[s.n,s.ch?f2(s.ch)+" kg":"-",s.teq?f2(s.teq):"-",s.ctrl||"-"])}]});
set("gaines",(d,P)=>{const C=T("gaines").calc(d,P);return [{t:"Débits à régler pièce par pièce",head:["Pièce","Débit","Gaines","Débit par bouche","Bouche"],rows:(d.rows||[]).map((r,i)=>{const x=C.R[i];return x&&x.ok?[r.piece||"Pièce "+(i+1),f0(x.H)+" m³/h",String(x.J),f0(x.K)+" m³/h",x.O]:null}).filter(Boolean)},
  {t:"Unité",rows:[["Débit total à souffler",f0(C.Ht)+" m³/h",""],["Débit nominal de l'unité",C.U?f0(C.U)+" m³/h":"-",C.couvre||""],["Pression statique","Régler pour la gaine la plus longue","Vérifier les débits à l'anémomètre"],["Reprise",C.grille||"-",C.vGr?"vitesse "+f(C.vGr,1)+" m/s":""]]}]});
set("vmc",(d,P)=>{const C=T("vmc").calc(d,P);return [{t:"Débits à régler par bouche",head:["Pièce","Sens","Débit"],rows:(d.rows||[]).map((r,i)=>{const x=C.R[i];return x&&x.ok&&x.J!==""?[r.local||r.piece||"Pièce "+(i+1),x.sens||"",f0(x.J)+" m³/h"]:null}).filter(Boolean)},
  {t:"Caisson",rows:[["Extraction totale",f0(C.ext)+" m³/h",""],["Insufflation totale",f0(C.ins)+" m³/h",""],["Débit à régler au caisson (fuites comprises)",f0(C.cais)+" m³/h","Mesure aux bouches à la réception"]]}]});
set("cuivre",(d,P)=>{const C=T("cuivre").calc(d,P);return [{t:"Mise en service du réseau",rows:[["Essai de pression","À l'azote sec, pression de la notice du fabricant","Tenue 24 h conseillée, relever la pression et la température"],["Tirage au vide","Moins de 5 mbar (500 microns), maintenu 30 min",""],["Brasures","Sous azote",""],["Charge complémentaire","Selon les grammes par mètre de la notice","Voir les longueurs liquide ci-dessous"]]},
  {t:"Longueurs de la ligne liquide (pour la charge)",head:["Ø liquide","Longueur","g/m (notice)","Charge"],rows:C.byD.filter(x=>x.liq).map(x=>[x.d+'"',f(x.liq,1)+" m","",""])}]});
set("cuisine",(d,P)=>{const C=T("cuisine").calc(d,P);return [{t:"Froid",rows:[["Armoires positives","+3 °C (0 à +4 °C)",""],["Armoires négatives","-18 à -20 °C",""],["Cellule de refroidissement","+63 °C à +10 °C à cœur en moins de 2 h","Sonde à cœur"],["Table réfrigérée","+3 °C",""]]},
  {t:"Lavage",rows:[["Lave-vaisselle","Lavage 55 à 60 °C, rinçage 82 à 85 °C",""],["Lave-verres","Rinçage 65 °C environ",""]]},
  {t:"Hotte et ventilation",rows:[["Débit d'extraction",f0(C.ex)+" m³/h",""],["Air de compensation",f0(C.comp)+" m³/h",""],["Gaz",C.gaz?"Coupure asservie à l'extraction":"-",""]]}]});
set("boul",(d,P)=>{const C=T("boul").calc(d,P);return [{t:"Froid",rows:[["Armoires positives","+3 °C",""],["Armoires négatives","-18 °C",""],["Refroidisseur d'eau","+2 à +4 °C",""],["Pousse contrôlée","Programme de la fiche « Blocage / pousse »",""]]},
  {t:"Fournil",rows:[["Extraction des buées",f0(C.ex)+" m³/h",""],["Puissance électrique installée",f(C.el,1)+" kW",""],["Intensité si tout tourne",f0(C.iA)+" A",""]]}]});
})();
</script>
