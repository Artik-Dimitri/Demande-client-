<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Heures techniciens – Artik</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout : bandeau Artik orange/gris, compteurs, puis une ligne par jour avec sa frise horaire façon disque de chronotachygraphe, et récap équipe pour la paie */
:root{
  --bg:#F4F4F3; --surface:#FFFFFF; --ink:#22211F; --muted:#6B6964; --line:#DEDCD8; --soft:#EFEEEB; --grid:#E8E6E2;
  --o1:#E0701C; --o2:#F2A45E; --o3:#FADBBE; --o4:#FDF1E6; --odk:#A84F0E;
  --g1:#5B5A57; --g2:#9A9893; --g3:#CFCDC8; --g4:#ECEBE8;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161514; --surface:#1F1E1C; --ink:#ECEAE6; --muted:#A3A09A; --line:#34322F; --soft:#282725; --grid:#2C2B28;
  --o1:#F08B3E; --o2:#C9772F; --o3:#5A3A1E; --o4:#2E2219; --odk:#F6B37A;
  --g1:#C9C6C0; --g2:#8E8B85; --g3:#4A4844; --g4:#2A2927; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161514; --surface:#1F1E1C; --ink:#ECEAE6; --muted:#A3A09A; --line:#34322F; --soft:#282725; --grid:#2C2B28;
  --o1:#F08B3E; --o2:#C9772F; --o3:#5A3A1E; --o4:#2E2219; --odk:#F6B37A;
  --g1:#C9C6C0; --g2:#8E8B85; --g3:#4A4844; --g4:#2A2927; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.brandline{display:grid;grid-template-columns:1fr 1fr;height:5px}.brandline i:first-child{background:var(--o1)}.brandline i:last-child{background:var(--g2)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:22px 18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,42px);line-height:1;margin:4px 0 0}
.fake{font-size:13px;color:var(--odk);background:var(--o4);border:1px dashed var(--o2);padding:4px 10px;border-radius:12px;font-weight:600}
select,input[type=time],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--o1);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--g2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabsrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px 11px;cursor:pointer;font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--o1)}
.bar-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--o4);color:var(--odk)}
.period{font-family:var(--f-display);font-size:20px;font-weight:600;min-width:200px;text-align:center}
.spacer{flex:1}

.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.tile b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.hi b{color:var(--odk)}
.meter{height:6px;border-radius:3px;background:var(--g4);overflow:hidden;margin-top:4px;position:relative}
.meter i{display:block;height:100%;background:var(--o1)}
.meter .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}

/* Journées */
.days{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.dgrid{display:grid;grid-template-columns:120px minmax(420px,1fr) repeat(7,minmax(58px,auto));min-width:980px}
.dh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;display:flex;align-items:flex-end}
.dh.num,.dc.num{justify-content:flex-end;text-align:right}
.dc{padding:8px;border-bottom:1px solid var(--soft);display:flex;align-items:center;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.dc.day{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.dc.day b{font-weight:600}.dc.day small{font-size:12px;color:var(--muted)}
.dc.we{background:var(--g4)}
.dc .z{color:var(--g3)}
.dc.hot{color:var(--odk);font-weight:600}
.axis{position:relative;height:30px;width:100%;border-radius:4px;background:var(--soft)}
.axis .plage{position:absolute;top:0;bottom:0;background:var(--o4);border-left:1px dashed var(--o2);border-right:1px dashed var(--o2)}
.axis .hr{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.seg-t{position:absolute;top:4px;bottom:4px;border-radius:3px;min-width:2px}
.k-inter{background:var(--o1)}
.k-trajet{background:var(--o2)}
.k-depot{background:var(--g1)}
.k-fourn{background:var(--g2)}
.k-atelier{background:var(--odk)}
.k-nd{background:repeating-linear-gradient(90deg,var(--o3) 0 3px,transparent 3px 6px);border:1px dashed var(--o2)}
.k-repas{background:repeating-linear-gradient(90deg,var(--g3) 0 3px,transparent 3px 5px);border:1px solid var(--g3)}
.k-recup{background:repeating-linear-gradient(135deg,var(--o3) 0 4px,var(--o4) 4px 8px);border:1px solid var(--o2)}
.k-conges{background:repeating-linear-gradient(135deg,var(--g3) 0 4px,var(--g4) 4px 8px);border:1px solid var(--g2)}
.seg-t.maj{box-shadow:inset 0 -4px 0 var(--odk)}
.axhead{position:relative;height:16px;width:100%}
.axhead span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.icons{display:flex;gap:4px}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--g4);color:var(--g1);border:1px solid var(--g3)}
.pill.o{background:var(--o4);color:var(--odk);border-color:var(--o2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.detail{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.detail h3{font-family:var(--f-display);font-size:21px;font-weight:600;margin:0 0 10px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--soft);white-space:nowrap}
td.num,th.num{text-align:right}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--o4)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.codes{font-family:var(--f-mono);font-size:13px}
td .z{color:var(--g3)}
td.hot{color:var(--odk);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.panel h3{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0 0 12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.field{display:grid;gap:5px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.note{border-left:3px solid var(--o1);padding:8px 12px;background:var(--o4);border-radius:0 6px 6px 0;font-size:14px;margin-bottom:16px}

.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel h3 small,.detail h3 small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:8px}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--g4)}
.stack.sm{height:12px;border-radius:3px}
.stack i{display:block;height:100%}
.replegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--muted)}
.replegend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.replegend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
table.mini td{border-bottom:0;padding:4px 8px}
.btn.pdf{background:var(--o1);border-color:var(--o1);color:#fff}
.btn.pdf:hover{filter:brightness(1.05)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g1);color:var(--surface);padding:10px 18px;border-radius:6px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.k-ecole{background:repeating-linear-gradient(90deg,var(--g2) 0 6px,var(--g3) 6px 9px)}
ul.alerts{margin:6px 0 0;padding-left:18px;color:var(--odk);font-weight:600}
table.edit td{padding:6px 6px}table.edit input[type=text]{width:100%;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{height:46px;width:auto;border-radius:4px;background:#fff;padding:4px 6px}
.replegend .hors{flex-basis:100%;padding-top:6px;border-top:1px dashed var(--line)}
details.cpt summary{cursor:pointer;list-style:none}details.cpt summary::-webkit-details-marker{display:none}
details.cpt summary h3{display:inline-flex;align-items:baseline;gap:4px;margin:0}details.cpt summary h3::before{content:"▸";color:var(--o1);margin-right:6px}details.cpt[open] summary h3::before{content:"▾"}
details.cpt[open] summary{margin-bottom:12px}
input.pay{width:80px;text-align:right}
small.just{display:block;font-size:11px;color:var(--muted)}
.srcbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fake.real{color:var(--g1);background:var(--g4);border-color:var(--g2)}
.tiles{grid-template-columns:repeat(7,minmax(0,1fr))}
@media (max-width:1150px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile.prime{border:1.5px dashed var(--o2);background:var(--o4)}
.tile.prime.set{border-style:solid;border-color:var(--o1)}
.pinput{display:flex;align-items:baseline;gap:4px}
.pinput input{width:100%;min-width:0;font-family:var(--f-display);font-size:26px;font-weight:600;border:0;border-bottom:1.5px solid var(--o2);background:transparent;padding:0 2px;border-radius:0;color:var(--odk)}
.pinput input::placeholder{font-size:18px;color:var(--g2);font-weight:500}
.pinput em{font-style:normal;font-family:var(--f-display);font-size:16px;white-space:nowrap;color:var(--odk)}
.toast.bad{background:var(--odk);color:#fff}
</style>
</head>

<script>
(function(){
/* ----- Réglages (mémorisés dans ce navigateur pour la maquette) ----- */
const DEF={plageDeb:"07:00",plageFin:"19:00",nuitDeb:"21:00",nuitFin:"06:00",tHors:25,tNuit:50,tSam:25,tDim:100,trajetMode:"un",trajetChoix:"long",base:35,demiCP:4,primePerm:40,mPanier:10,mResto:0};
let R={...DEF};try{R={...DEF,...JSON.parse(localStorage.getItem("hx-regles")||"{}")}}catch(e){}
const CODES=[
  {code:"ZZZ DEPOT",k:"depot",label:"Dépôt"},
  {code:"ZZZ REPARATION ATELIER",k:"atelier",label:"Réparation atelier"},
  {code:"ZZZ TRAJET",k:"trajet",label:"Trajet"},
  {code:"ZZZ FOURNISSEUR",k:"fourn",label:"Fournisseur"},
  {code:"ZZZ PANIER REPAS",k:"repas",label:"Panier repas",compte:"panier"},
  {code:"ZZZ RESTAURANT EN COMPTE",k:"repas",label:"Restaurant en compte",compte:"restoEC"},
  {code:"ZZZ RESTAURANT SANS COMPTE",k:"repas",label:"Restaurant sans compte",compte:"resto"},
  {code:"ZZZ ASTREINTE",k:"perm",label:"Astreinte"},
  {code:"ZZZ ECOLE",k:"ecole",label:"École / CFA"},
  {code:"ZZZ RECUPERATION D'HEURES",k:"recup",label:"Récupération"},
  {code:"ZZZ CONGES PAYES",k:"conges",label:"Congés payés"}
];
const DEF_TECHS=[{nom:"Tech 1",org:"U-101",type:"tech",contrat:35},{nom:"Tech 2",org:"U-102",type:"tech",contrat:39},{nom:"Tech 3",org:"U-103",type:"tech",contrat:35},{nom:"Tech 4",org:"U-104",type:"tech",contrat:40},{nom:"Tech 5",org:"U-105",type:"tech",contrat:35},{nom:"Apprenti 1",org:"U-106",type:"apprenti",contrat:35,mineur:true}];
let TECHS=DEF_TECHS.map(t=>({...t}));try{const st=JSON.parse(localStorage.getItem("hx-techs")||"null");if(Array.isArray(st)&&st.length)TECHS=st}catch(e){}
const CLIENTS=["Boulangerie centre","Supermarché route de Rodez","EHPAD les Tilleuls","Fromagerie du Causse","Hôtel du Pont","Mairie annexe","Restaurant le Tarn","Cave coopérative","Pharmacie du marché","Garage Larzac"];

/* ----- Données fictives, générées de façon reproductible ----- */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const pick=a=>a[Math.floor(rnd()*a.length)];
const p2=x=>String(x).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const hm=m=>p2(Math.floor(m/60))+":"+p2(m%60);
const toM=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
const q=m=>Math.round(m/15)*15;
let DATA_START=addD(monday(new Date()),-63);
function genData(){
  const out=[];const end=addD(monday(new Date()),13);
  DEF_TECHS.forEach((t,ti)=>{
    const appr=t.type==="apprenti";
    const congeWeek=ti===2?4:ti===4?7:-1;
    for(let d=new Date(DATA_START),i=0;d<=end;d=addD(d,1),i++){
      const wd=(d.getDay()+6)%7,wk=Math.floor(i/7),date=ymd(d),perm=!appr&&(wk+ti)%5===0;
      const add=(a,b,c)=>out.push({tech:t.nom,date,deb:hm(a),fin:hm(b),client:c});
      if(wd>=5){
        if(perm){out.push({tech:t.nom,date,deb:"00:00",fin:"00:00",client:"ZZZ ASTREINTE"});
          if(wd===5){add(9*60,9*60+30,"ZZZ TRAJET");add(9*60+30,12*60+q(rnd()*60),pick(CLIENTS))}
          if(wd===6&&rnd()<.6){add(21*60,21*60+30,"ZZZ TRAJET");add(21*60+30,23*60,pick(CLIENTS))}}
        continue;}
      if(wk===congeWeek&&wd<3){add(8*60,12*60,"ZZZ CONGES PAYES");add(13*60,16*60,"ZZZ CONGES PAYES");continue}
      if(appr&&wk%2===0&&wd<2){add(8*60+30,12*60,"ZZZ ECOLE");add(13*60,16*60+30,"ZZZ ECOLE");continue}
      let m=7*60+30+q(rnd()*30);
      if(rnd()<.45){add(m,m+30,"ZZZ DEPOT");m+=30}
      const tr1=q(20+rnd()*40);add(m,m+tr1,"ZZZ TRAJET");m+=tr1;
      if(rnd()<.3){add(m,m+30,"ZZZ FOURNISSEUR");m+=30;const t2=q(15+rnd()*20);add(m,m+t2,"ZZZ TRAJET");m+=t2}
      const am=Math.max(60,12*60-m);add(m,m+am,pick(CLIENTS));m+=am;
      const rr=rnd();add(m,m+60,rr<.15?"ZZZ RESTAURANT EN COMPTE":rr<.3?"ZZZ RESTAURANT SANS COMPTE":"ZZZ PANIER REPAS");m+=60;
      if(ti===1&&wk===5&&wd===4){add(13*60+30,17*60,"ZZZ RECUPERATION D'HEURES");continue}
      const pm=q(120+rnd()*75);add(m,m+pm,pick(CLIENTS));m+=pm;
      if(rnd()<.15){const ex=q(60+rnd()*120);add(m,m+ex,pick(CLIENTS));m+=ex}
      if(rnd()<.2){add(m,m+30,rnd()<.5?"ZZZ DEPOT":"ZZZ REPARATION ATELIER");m+=30}
      const tr2=q(20+rnd()*40);add(m,m+tr2,"ZZZ TRAJET");m+=tr2;
      if(perm&&wd===2&&rnd()<.7){const s=22*60+q(rnd()*60);add(s,s+q(60+rnd()*60),pick(CLIENTS))}
    }
  });
  return out;
}
let DATA=genData(),SOURCE=null;
/* ----- Import d'un fichier Organilog (script PowerShell) ----- */
function fromOrganilog(j){
  const users=(j.users&&j.users.results)||j.users||[],inter=(j.interventions&&j.interventions.results)||j.interventions||[],cl=j.clients||[];
  const cname={};(Array.isArray(cl)?cl:cl.results||[]).forEach(c=>cname[String(c.id)]=c.title||c.nom||c.name||("Client "+c.id));
  const uname={};users.forEach(u=>uname[String(u.id)]=((u.prenom||"")+" "+(u.nom||"")).trim()||u.login);
  const okDate=d=>d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&d!=="0000-00-00",okH=h=>h&&/^\d{1,2}:\d{2}/.test(h);
  const out=[];let skip=0;
  inter.forEach(i=>{
    if(String(i.is_done)!=="1"||String(i.is_actif)==="0"||!okDate(i.done_date)||!okH(i.done_hour_start)||!okH(i.done_hour_end)){skip++;return}
    let deb=i.done_hour_start.slice(0,5),fin=i.done_hour_end.slice(0,5);
    if(toM(fin)<toM(deb))fin="23:59";
    out.push({tech:uname[String(i.fk_user_id)]||("Utilisateur "+i.fk_user_id),date:i.done_date,deb,fin,client:cname[String(i.fk_client_id)]||("Client "+i.fk_client_id),decl:okH(i.done_hour)?i.done_hour.slice(0,5):"",nom:i.nom||""});
  });
  const withData=new Set(out.map(e=>e.tech));
  const prev={};TECHS.forEach(t=>prev[t.org||t.nom]=t);
  const techs=users.filter(u=>String(u.is_actif)!=="0").map(u=>{const nom=uname[String(u.id)],p=prev[String(u.id)]||prev[nom]||{};
    return {nom,org:String(u.id),type:p.type||"tech",mineur:!!p.mineur,contrat:Number(u.week_working_hours)>0?Math.round(Number(u.week_working_hours)):(p.contrat||35),equipe:u.team_title||"",suivi:withData.has(nom)||!/bureau/i.test(u.team_title||"")}})
    .filter(t=>t.suivi);
  return {data:out,techs,skip,from:j.date_from||"",to:j.date_to||"",n:inter.length};
}
function applyImport(j,save){
  const r=fromOrganilog(j);
  if(!r.data.length&&!r.techs.length)throw new Error("vide");
  DATA=r.data;TECHS=r.techs.length?r.techs:TECHS;
  const ds=DATA.map(e=>e.date).sort();DATA_START=monday(new Date((ds[0]||ymd(new Date()))+"T12:00"));
  SOURCE={from:r.from||ds[0]||"",to:r.to||ds[ds.length-1]||"",n:r.data.length,skip:r.skip};
  if(save){try{localStorage.setItem("hx-import",JSON.stringify(j))}catch(e){}}
  return r;
}
try{const st=localStorage.getItem("hx-import");if(st)applyImport(JSON.parse(st),false)}catch(e){}

/* ----- Calculs ----- */
/* reconnaissance tolérante : sans accents ni majuscules, et par début de nom ("ZZZ Dépôt Creissels" = dépôt) */
const norm=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\u2019\u2018`´]/g,"'").toLowerCase().replace(/\s+/g," ").trim();
function codeOf(c){const n=norm(c);return CODES.find(x=>n===norm(x.code)||n.startsWith(norm(x.code)+" "))}
function ov(a0,a1,b0,b1){return Math.max(0,Math.min(a1,b1)-Math.max(a0,b0))}
function isTrajet(e){const c=codeOf(e.client);return !!c&&c.k==="trajet"}
const ZERO={atelier:0,restoEC:0,ecole:0,nuitLegal:0,travail:0,inter:0,trajet:0,trajetND:0,depot:0,fourn:0,pause:0,hors:0,nuit:0,sam:0,dim:0,panier:0,resto:0,recup:0,congesJ:0,perm:0};
function computeDay(tech,date){
  const es=DATA.filter(e=>e.tech===tech&&e.date===date).map(e=>({...e})).sort((a,b)=>a.deb.localeCompare(b.deb));
  const wd=new Date(date+"T12:00").getDay();
  const r={...ZERO,es,conges:0,deb:null,fin:null};
  const p0=toM(R.plageDeb),p1=toM(R.plageFin),n0=toM(R.nuitDeb),n1=toM(R.nuitFin);
  /* trajets : aller = avant le premier travail, retour = après le dernier, le reste = entre chantiers */
  const work=es.filter(e=>{const c=codeOf(e.client);return (!c||c.k==="depot"||c.k==="atelier"||c.k==="fourn"||c.k==="ecole")&&toM(e.fin)>toM(e.deb)});
  const w0=work.length?Math.min(...work.map(e=>toM(e.deb))):null,w1=work.length?Math.max(...work.map(e=>toM(e.fin))):null;
  const tr=es.filter(isTrajet);
  tr.forEach(e=>{const s=toM(e.deb),f=toM(e.fin);e.sens=w0===null?"aller":f<=w0?"aller":s>=w1?"retour":"entre";e.du=true});
  if(R.trajetMode==="aucun")tr.filter(e=>e.sens!=="entre").forEach(e=>e.du=false);
  if(R.trajetMode==="un"){
    const al=tr.filter(e=>e.sens==="aller"),re=tr.filter(e=>e.sens==="retour");
    if(al.length&&re.length){
      const dA=al.reduce((x,e)=>x+toM(e.fin)-toM(e.deb),0),dR=re.reduce((x,e)=>x+toM(e.fin)-toM(e.deb),0);
      const garde=R.trajetChoix==="matin"?"aller":R.trajetChoix==="soir"?"retour":(dA>=dR?"aller":"retour");
      tr.filter(e=>e.sens!=="entre"&&e.sens!==garde).forEach(e=>e.du=false);
    }
  }
  /* chevauchements : une même minute n'est comptée qu'une fois (hors pauses, absences, astreinte) */
  let cov=0;
  es.forEach(e=>{
    const c=codeOf(e.client),s0=toM(e.deb),f=toM(e.fin);
    const timed=!c||["trajet","depot","fourn","atelier","ecole"].includes(c.k);
    const s=timed?Math.max(s0,Math.min(cov,f)):s0,dur=Math.max(0,f-s);
    e.chev=timed&&s>s0?s-s0:0;if(timed)cov=Math.max(cov,f);
    let travail=false;
    if(isTrajet(e)){travail=e.du;if(e.du)r.trajet+=dur;else r.trajetND+=dur}
    else if(!c){travail=true;r.inter+=dur}
    else if(c.k==="depot"){travail=true;r.depot+=dur}
    else if(c.k==="fourn"){travail=true;r.fourn+=dur}
    else if(c.k==="atelier"){travail=true;r.atelier+=dur}
    else if(c.k==="ecole"){travail=true;r.ecole+=dur}
    else if(c.k==="repas"){r.pause+=dur;r[c.compte]=1}
    else if(c.k==="perm"){r.perm=1}
    else if(c.k==="recup"){r.recup+=dur}
    else if(c.k==="conges"){r.conges+=dur}
    e.maj=false;e.compte=travail;
    if(travail&&dur){
      r.travail+=dur;
      if(r.deb===null||s<r.deb)r.deb=s;if(r.fin===null||f>r.fin)r.fin=f;
      r.nuitLegal+=ov(s,f,22*60,1440)+ov(s,f,0,6*60);
      if(c&&c.k==="ecole"){}
      else if(wd===6){r.sam+=dur;e.maj=true}
      else if(wd===0){r.dim+=dur;e.maj=true}
      else{const nuit=ov(s,f,n0,1440)+ov(s,f,0,n1),inP=ov(s,f,p0,p1),hors=Math.max(0,dur-inP-nuit);r.nuit+=nuit;r.hors+=hors;if(nuit||hors)e.maj=true}
    }
  });
  r.congesJ=r.conges?(r.conges/60<=R.demiCP?0.5:1):0;
  return r;
}
function sum(days){const t={...ZERO};days.forEach(d=>{for(const k in t)t[k]+=d[k]||0});return t}
function weekHS(trav){const h=trav/60,b=R.base;return {hs25:Math.max(0,Math.min(h-b,8)),hs50:Math.max(0,h-b-8)}}
function weekOf(tech,mon){const dd=Array.from({length:7},(_,i)=>({date:addD(mon,i),...computeDay(tech,ymd(addD(mon,i)))}));const s=sum(dd);return {mon,days:dd,s,...weekHS(s.travail)}}
/* solde du compteur de récup : heures sup. cumulées moins récup prises, depuis le début des données */
/* barèmes datés : chaque ligne s'applique à partir de sa date (les mois passés gardent l'ancien montant) */
const DEF_BAR=[{date:"2026-01-01",panier:10.40,astreinte:150,resto:0}];
let BAR=DEF_BAR.map(b=>({...b}));try{const b=JSON.parse(localStorage.getItem("hx-bareme")||"null");if(Array.isArray(b)&&b.length)BAR=b}catch(e){}
function baremeAt(d){const k=typeof d==="string"?d:ymd(d);const l=BAR.slice().sort((a,b)=>a.date.localeCompare(b.date));let r=l[0];l.forEach(b=>{if(b.date<=k)r=b});return r}
/* primes mensuelles sur résultat, saisies par mois et par personne */
let PRIMES={};try{PRIMES=JSON.parse(localStorage.getItem("hx-primes")||"{}")}catch(e){}
function primeMois(tech,k){return Number((PRIMES[tech]||{})[k])||0}
/* heures sup. payées, saisies par mois et par technicien (mémorisées dans ce navigateur pour la maquette) */
let PAYEES={};try{PAYEES=JSON.parse(localStorage.getItem("hx-payees")||"{}")}catch(e){}
const mkey=d=>d.getFullYear()+"-"+p2(d.getMonth()+1);
function payee(tech,k){return Number((PAYEES[tech]||{})[k])||0}
/* compteur d'heures sup. : acquises (semaines) - récup prises (ZZZ Récup) - heures payées (saisies, déduites en fin de mois) */
function soldeRecup(tech,until){let h=0;for(let m=new Date(DATA_START);m<until;m=addD(m,7)){const w=weekOf(tech,m);h+=w.hs25+w.hs50-w.s.recup/60}
  for(let d=new Date(DATA_START.getFullYear(),DATA_START.getMonth(),1);new Date(d.getFullYear(),d.getMonth()+1,1)<=until;d=new Date(d.getFullYear(),d.getMonth()+1,1))h-=payee(tech,mkey(d));
  return h}
function compteurMois(tech){
  const out=[];const now=new Date();
  for(let d=new Date(DATA_START.getFullYear(),DATA_START.getMonth(),1);d<=now;d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    const ws=weeksOf("mois",d).map(m=>weekOf(tech,m));
    const acq=ws.reduce((a,w)=>a+w.hs25+w.hs50,0),rec=ws.reduce((a,w)=>a+w.s.recup,0)/60,pay=payee(tech,mkey(d));
    const fin=ws.length?addD(ws[ws.length-1].mon,7):d;
    out.push({d,k:mkey(d),acq,rec,pay,solde:soldeRecup(tech,new Date(Math.max(fin,new Date(d.getFullYear(),d.getMonth()+1,1))))});
  }
  return out;
}
function periodDays(p,r){
  if(p==="semaine"){const m=monday(r);return Array.from({length:7},(_,i)=>addD(m,i))}
  const a=new Date(r.getFullYear(),r.getMonth(),1),n=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();return Array.from({length:n},(_,i)=>addD(a,i));
}
function weeksOf(p,r){if(p==="semaine")return [monday(r)];const ws=[];periodDays(p,r).forEach(d=>{const m=monday(d);if(m.getMonth()===r.getMonth()&&!ws.some(w=>w.getTime()===m.getTime()))ws.push(m)});return ws}
function techPeriod(tech,p,r){
  const weeks=weeksOf(p,r).map(m=>weekOf(tech,m));
  const days=p==="semaine"?weeks[0].days:weeks.flatMap(w=>w.days);
  const t=sum(days),hs25=weeks.reduce((a,w)=>a+w.hs25,0),hs50=weeks.reduce((a,w)=>a+w.hs50,0);
  const start=weeks[0].mon,end=addD(weeks[weeks.length-1].mon,7);
  const s0=soldeRecup(tech,start),s1=soldeRecup(tech,end);
  const tc=TECHS.find(x=>x.nom===tech)||{nom:tech,contrat:35};
  const alerts=[];
  if(tc.type==="apprenti"&&tc.mineur){
    days.forEach(d=>{if(d.travail>8*60)alerts.push(`${JOURS[d.date.getDay()]} ${d.date.getDate()} : ${fmt(d.travail)} travaillées (8 h maximum par jour)`);
      if(d.nuitLegal)alerts.push(`${JOURS[d.date.getDay()]} ${d.date.getDate()} : ${fmt(d.nuitLegal)} entre 22 h et 6 h (travail de nuit)`);
      if(d.date.getDay()===0&&d.travail)alerts.push(`${JOURS[d.date.getDay()]} ${d.date.getDate()} : travail le dimanche`)});
    weeks.forEach(w=>{if(w.s.travail>35*60)alerts.push(`Semaine ${isoW(w.mon)} : ${fmt(w.s.travail)} (35 h maximum par semaine)`)});
  }
  return {tech,org:tc.org||"",type:tc.type||"tech",mineur:!!tc.mineur,contrat:tc.contrat,contratP:tc.contrat*weeks.length,weeks,days,t,hs25,hs50,s0,s1,...(()=>{let prime=0,repasEur=0,restoJustif=0;weeks.forEach(w=>{if(w.s.perm)prime+=baremeAt(w.mon).astreinte});days.forEach(d=>{const b=baremeAt(d.date);repasEur+=d.panier*b.panier+(b.resto?d.resto*b.resto:0);if(!b.resto)restoJustif+=d.resto});return {prime,repasEur,restoJustif,permW:weeks.filter(w=>w.s.perm).length}})(),
  primeM:p==="mois"?primeMois(tech,mkey(r)):0,alerts,payeesP:p==="mois"?payee(tech,mkey(r)):0};
}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=m=>{const neg=m<0;m=Math.abs(Math.round(m));const h=Math.floor(m/60),mm=m%60;return (neg?"-":"")+h+"h"+(mm?p2(mm):"")};
const H=m=>m?fmt(m):'<span class="z">–</span>';
const Hh=h=>h?fmt(h*60):'<span class="z">–</span>';
const eur=n=>Math.round(n).toLocaleString("fr-FR")+" €";
const JOURS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const isoW=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};

function label(p,r){
  if(p==="semaine"){const m=monday(r),s=addD(m,6);return `Semaine ${isoW(m)} · ${m.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})} – ${s.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"})}`}

const AX0=5*60,AX1=24*60;
function axisHTML(r){

  for(let x=6;x<24;x+=2)h+=`<div class="hr" style="left:${pc(x*60)}%"></div>`;
  r.es.forEach(e=>{const s=toM(e.deb),f=toM(e.fin);if(f<=s)return;const c=codeOf(e.client),k=isTrajet(e)?(e.du?"trajet":"nd"):c?c.k:"inter";

}
function axisHead(){const pc=m=>((m-AX0)/(AX1-AX0)*100);let h='<div class="axhead">';for(let x=6;x<24;x+=2)h+=`<span style="left:${pc(x*60)}%">${x}h</span>`;return h+"</div>"}
function legend(){return `<div class="legend"><span><i class="k-inter"></i>Intervention client</span><span><i class="k-trajet"></i>Trajet payé</span><span><i class="k-nd"></i>Trajet non dû</span><span><i class="k-depot"></i>Dépôt</span><span><i class="k-fourn"></i>Fournisseur</span><span><i class="k-repas"></i>Pause repas</span><span><i class="k-recup"></i>Récup</span><span><i class="k-conges"></i>Congés</span><span><i style="background:var(--surface);box-shadow:inset 0 -4px 0 var(--odk);border:1px solid var(--line)"></i>Heures majorées</span><span><i style="background:var(--o4);border:1px dashed var(--o2)"></i>Plage normale ${R.plageDeb}–${R.plageFin}</span></div>`}
/* répartition calculée sur le seul temps de travail payé ; pause et trajet non dû affichés à part */
const REP=[["inter","Interventions","k-inter"],["ecole","École / CFA","k-ecole"],["trajet","Trajet payé","k-trajet"],["depot","Dépôt","k-depot"],["atelier","Réparation atelier","k-atelier"],["fourn","Fournisseur","k-fourn"]];
const HORS=[["pause","Pause repas","k-repas"],["trajetND","Trajet non dû","k-nd"]];
function repartition(t){
  const tot=REP.reduce((a,[k])=>a+t[k],0)||1;
  const bar=REP.map(([k,l,c])=>t[k]?`<i class="${c}" style="width:${t[k]/tot*100}%" title="${l} : ${fmt(t[k])} (${Math.round(t[k]/tot*100)} %)"></i>`:"").join("");
  const leg=REP.map(([k,l,c])=>`<span><i class="${c}"></i>${l} <b>${H(t[k])}</b> <small>${Math.round(t[k]/tot*100)} %</small></span>`).join("")
    +`<span class="hors">Hors temps de travail : `+HORS.map(([k,l,c])=>`<i class="${c}"></i>${l} <b>${H(t[k])}</b>`).join(" &nbsp; ")+`</span>`;
  return {bar,leg,prod:Math.round(t.inter/tot*100)};
}

      return `<tr><td>${e.deb}</td><td>${e.fin}</td><td class="num">${dur?H(dur):"–"}</td><td class="num${e.decl&&toM(e.decl)!==dur?" hot":""}" title="${e.decl&&toM(e.decl)!==dur?"Temps déclaré différent des horaires":""}">${e.decl?H(toM(e.decl)):"–"}</td><td class="${c?"codes":""}">${esc(e.client)}${e.nom&&!c?`<small class="just">${esc(e.nom)}</small>`:""}</td><td>${cls}${e.maj?' <span class="pill o">majorée</span>':""}${e.chev?` <span class="pill o" title="Chevauche la saisie précédente : ${e.chev} min non comptées en double">chevauchement ${H(e.chev)}</span>`:""}</td><td>${eff}</td></tr>`}).join("")||'<tr><td colspan="7" class="hint">Aucune saisie ce jour-là.</td></tr>'}</tbody></table></div></div>`;

  }else{

      return `<tr class="click" data-week="${ymd(w.mon)}"><td>S${isoW(w.mon)} · du ${w.mon.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</td><td class="num"><b>${H(s.travail)}</b></td><td class="num">${P.contrat} h</td><td class="num${w.hs25?" hot":""}">${Hh(w.hs25)}</td><td class="num${w.hs50?" hot":""}">${Hh(w.hs50)}</td><td class="num${mj?" hot":""}">${H(mj)}</td><td class="num">${H(s.trajet)}</td><td class="num">${H(s.pause)}</td><td class="num">${s.panier||'<span class="z">–</span>'}</td><td class="num">${s.resto||'<span class="z">–</span>'}</td><td class="num">${s.perm?"1 sem.":'<span class="z">–</span>'}</td><td class="num">${H(s.recup)}</td><td class="num">${s.congesJ?s.congesJ+" j":'<span class="z">–</span>'}</td></tr>`}).join("")}</tbody></table></div><p class="hint">Cliquez sur une semaine pour l'ouvrir jour par jour. Le mois regroupe les semaines qui commencent dans le mois.</p></div>`;
  }
  return h;
}

  }
  doc.autoTable({startY:43,head,body,theme:"grid",styles:{font:"helvetica",fontSize:8.5,cellPadding:1.8,lineColor:[222,220,216],lineWidth:.2,textColor:[34,33,31]},

  const h2=box(14+cw+8,y,cw,"Majorations",[["Hors plage (+"+R.tHors+" %)",fm(t.hors)],["Nuit (+"+R.tNuit+" %)",fm(t.nuit)],["Samedi (+"+R.tSam+" %)",fm(t.sam)],["Dimanche (+"+R.tDim+" %)",fm(t.dim)],["Trajet non dû (non payé)",fm(t.trajetND)]]);
  y+=Math.max(h1,h2)+6;

function buildPDF(J,mode){
  const doc=new J({unit:"mm",format:"a4"});
  if(mode==="tech")pdfTech(doc,techPeriod(tech,per,ref),per,ref);
  else{const rows=equipeRows();rows.forEach((P,i)=>{if(i)doc.addPage();pdfTech(doc,P,per,ref)})}
  return doc;
}
async function downloadPDF(){
  const btn=$("#pdf");btn.disabled=true;const old=btn.textContent;btn.textContent="Préparation…";
  try{
    if(!window.jspdf)throw {code:"lib"};
    const doc=buildPDF(window.jspdf.jsPDF,tab==="tech"?"tech":"equipe");
    const name=(tab==="tech"?"Heures "+tech:"Heures equipe")+" - "+pdfTxt(label(per,ref)).replace(/[·\/]/g,"-")+".pdf";
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:doc.output("blob")})}
    else{const u=URL.createObjectURL(doc.output("blob")),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    toast("PDF prêt");
  }catch(e){
    const c=e&&e.code;
    if(c!=="declined")toast(c==="lib"?"Le module PDF ne s'est pas chargé, rechargez la page.":c==="unavailable"?"Le téléchargement n'est pas disponible dans cette vue.":"Le PDF n'a pas pu être créé.",true);
  }finally{btn.disabled=false;btn.textContent=old}
}

    bb.addEventListener("click",e=>{if(e.target.closest("[data-del]"))e.target.closest("tr").remove()});
    $("#b-save").addEventListener("click",()=>{const l=[...bb.querySelectorAll("tr")].map(tr=>{const g=f=>tr.querySelector(`[data-b="${f}"]`).value;return {date:g("date"),panier:+g("panier")||0,astreinte:+g("astreinte")||0,resto:+g("resto")||0}}).filter(b=>b.date);
      if(!l.length){toast("Gardez au moins une ligne de barème",true);return}
      BAR=l;try{localStorage.setItem("hx-bareme",JSON.stringify(l))}catch(e){}toast("Barème enregistré");render()});
    $("#pm-prev").addEventListener("click",()=>{primeRef=new Date(primeRef.getFullYear(),primeRef.getMonth()-1,1);render()});
    $("#pm-next").addEventListener("click",()=>{primeRef=new Date(primeRef.getFullYear(),primeRef.getMonth()+1,1);render()});
    document.querySelectorAll("input.pm").forEach(inp=>inp.addEventListener("change",()=>{const v=Math.max(0,Number(inp.value)||0),k=mkey(primeRef),t=inp.dataset.t;PRIMES[t]=PRIMES[t]||{};if(v)PRIMES[t][k]=v;else delete PRIMES[t][k];
      try{localStorage.setItem("hx-primes",JSON.stringify(PRIMES))}catch(e){}toast("Prime enregistrée");render()}));
  }
  if(tab==="tech"){
    const pm=document.querySelector("input.pmt");if(pm)pm.addEventListener("change",()=>{const v=Math.max(0,Number(pm.value)||0),k=pm.dataset.k;PRIMES[tech]=PRIMES[tech]||{};if(v)PRIMES[tech][k]=v;else delete PRIMES[tech][k];
      try{localStorage.setItem("hx-primes",JSON.stringify(PRIMES))}catch(e){}toast(v?`Prime de ${eur(v)} brut enregistrée pour ${tech}`:"Prime retirée");render()});
    const cp=document.querySelector("details.cpt");if(cp)cp.addEventListener("toggle",()=>ls2("cpt",cp.open?"1":"0"));
    document.querySelectorAll("input.pay").forEach(inp=>inp.addEventListener("change",()=>{const v=Math.max(0,Number(inp.value)||0);PAYEES[tech]=PAYEES[tech]||{};if(v)PAYEES[tech][inp.dataset.k]=v;else delete PAYEES[tech][inp.dataset.k];
      try{localStorage.setItem("hx-payees",JSON.stringify(PAYEES))}catch(e){}toast("Heures payées enregistrées, compteur recalculé");render()}));
  }
  if(tab==="techs"){
    const body=$("#t-body");
    $("#t-add").addEventListener("click",()=>{body.insertAdjacentHTML("beforeend",techRow({nom:"",org:"",type:"tech",contrat:35}));body.lastElementChild.querySelector("input").focus()});
    body.addEventListener("click",e=>{if(e.target.closest("[data-del]"))e.target.closest("tr").remove()});
    $("#t-save").addEventListener("click",()=>{const l=[...body.querySelectorAll("tr")].map(tr=>{const g=f=>tr.querySelector(`[data-f="${f}"]`);return {nom:g("nom").value.trim(),org:g("org").value.trim(),type:g("type").value,contrat:+g("contrat").value,mineur:g("type").value==="apprenti"&&g("mineur").checked}}).filter(t=>t.nom);
      if(!l.length){toast("Ajoutez au moins une personne",true);return}
      TECHS=l;try{localStorage.setItem("hx-techs",JSON.stringify(l))}catch(e){}fillTech();toast("Liste enregistrée");render()});
    $("#t-reset").addEventListener("click",()=>{TECHS=DEF_TECHS.map(t=>({...t}));try{localStorage.removeItem("hx-techs")}catch(e){}fillTech();render()});
  }
  if(tab==="regles"){
    $("#r-save").addEventListener("click",()=>{R={plageDeb:$("#r-pd").value,plageFin:$("#r-pf").value,nuitDeb:$("#r-nd").value,nuitFin:$("#r-nf").value,tHors:+$("#r-th").value,tNuit:+$("#r-tn").value,tSam:+$("#r-ts").value,tDim:+$("#r-td").value,base:+$("#r-base").value||35,demiCP:+$("#r-cp").value||4,trajetMode:$("#r-tm").value,trajetChoix:$("#r-tc").value};try{localStorage.setItem("hx-regles",JSON.stringify(R))}catch(e){}toast("Règles appliquées");render()});
    $("#r-reset").addEventListener("click",()=>{R={...DEF};try{localStorage.removeItem("hx-regles")}catch(e){}render()});
  }
}
function fillTech(){if(!TECHS.some(t=>t.nom===tech))tech=TECHS[0].nom;$("#tech").innerHTML=TECHS.map(t=>`<option${t.nom===tech?" selected":""}>${esc(t.nom)}</option>`).join("")}
fillTech();
$("#tech").addEventListener("change",e=>{tech=e.target.value;selDay=null;render()});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{tab=t.dataset.tab;try{localStorage.setItem("hx-tab",tab)}catch(e){}render()}));
$("#per").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;per=b.dataset.p;selDay=null;try{localStorage.setItem("hx-per",per)}catch(e){}render()});
$("#prev").addEventListener("click",()=>{ref=per==="semaine"?addD(ref,-7):new Date(ref.getFullYear(),ref.getMonth()-1,1);selDay=null;render()});
$("#next").addEventListener("click",()=>{ref=per==="semaine"?addD(ref,7):new Date(ref.getFullYear(),ref.getMonth()+1,1);selDay=null;render()});
$("#now").addEventListener("click",()=>{ref=new Date();selDay=null;render()});
$("#pdf").addEventListener("click",downloadPDF);
$("#view").addEventListener("click",e=>{
  const tr=e.target.closest("[data-tech]");if(tr){tech=tr.dataset.tech;$("#tech").value=tech;tab="tech";render();return}
  const wk=e.target.closest("[data-week]");if(wk){ref=new Date(wk.dataset.week+"T12:00");per="semaine";render();return}
  const d=e.target.closest("[data-day]");if(d){selDay=selDay===d.dataset.day?null:d.dataset.day;render()}
});
/* ouvre sur la semaine précédente, complète */
function sourceBadge(){const b=$("#src");if(!b)return;
  b.textContent=SOURCE?`Données Organilog · ${SOURCE.n} saisies`:"Maquette · données fictives";b.className="fake"+(SOURCE?" real":"");$("#imp-reset").hidden=!SOURCE}
const fi=$("#imp-file");
if(fi){
  $("#imp-btn").addEventListener("click",()=>fi.click());
  fi.addEventListener("change",()=>{const f=fi.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const txt=String(rd.result).replace(/^\uFEFF/,"");const r=applyImport(JSON.parse(txt),true);fillTech();
      if(SOURCE.from)ref=new Date(SOURCE.from+"T12:00");per="mois";tab="equipe";sourceBadge();render();
      toast(`${r.data.length} saisies importées${r.skip?` (${r.skip} non réalisées ignorées)`:""}`)}
      catch(e){toast("Ce fichier n'est pas un export Organilog lisible.",true)}fi.value=""};
    rd.readAsText(f,"utf-8")});
  $("#imp-reset").addEventListener("click",()=>{try{localStorage.removeItem("hx-import");localStorage.removeItem("hx-techs")}catch(e){}location.reload()});
}
ref=SOURCE&&SOURCE.from?new Date(SOURCE.from+"T12:00"):addD(new Date(),-7);
if(SOURCE)per="mois";
if(typeof window!=="undefined")window.__hx={buildPDF,set:(t,p,r,te)=>{tab=t;per=p;if(r)ref=r;if(te)tech=te},render,techPeriod,applyImport,fillTech,get:()=>({TECHS,SOURCE,n:DATA.length})};
sourceBadge();render();
})();
</script>
</body>
</html>
