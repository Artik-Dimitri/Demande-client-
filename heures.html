:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--g2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabsrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px 11px;cursor:pointer;font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}

.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}

.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--o4);color:var(--odk)}
.period{font-family:var(--f-display);font-size:20px;font-weight:600;min-width:200px;text-align:center}
.spacer{flex:1}

.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}

.days{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}

.tblwrap{overflow-x:auto}

.field{display:grid;gap:5px}

.note{border-left:3px solid var(--o1);padding:8px 12px;background:var(--o4);border-radius:0 6px 6px 0;font-size:14px;margin-bottom:16px}

<script>
/* =====================================================================
   RÉGLAGES DE LA VERSION EN LIGNE
   ===================================================================== */
const CONFIG = {
  tenantId: "14b03bce-aec8-408e-9686-c43ea4a503d8",
  clientId: "f66f2711-d9e4-4fd3-be11-57367c333c87",
  relais:   "https://red-sun-fb1f.d-blin.workers.dev",          // ex. https://relais-organilog.xxxx.workers.dev
  site:     "root",
  liste:    window.__SOC==="chassaing"?"Heures Chassaing - reglages":"Heures techniciens - reglages"
};
/* ===================================================================== */
(function(){
const H=window.__hx;if(!H)return;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SCOPES=["User.Read","Sites.ReadWrite.All"],SCOPES_ADMIN=["Sites.Manage.All"];
let msalApp=null,account=null,siteId=null,listId=null,items={},timers={},loading=false;

/* ---------- écran d'accueil ---------- */
const gate=document.createElement("div");gate.id="gate";document.body.appendChild(gate);
function showGate(title,text,btn,fn){
  gate.innerHTML=`<div class="gatecard"><img src="${document.querySelector(".logo")?document.querySelector(".logo").src:""}" alt="Artik" class="gatelogo"><h2>${esc(title)}</h2><p>${text}</p>${btn?`<button class="btn pdf" type="button" id="gate-btn">${esc(btn)}</button>`:""}</div>`;
  gate.hidden=false;if(btn)$("#gate-btn").addEventListener("click",fn);
}
function hideGate(){gate.hidden=true}

/* ---------- Microsoft ---------- */
async function token(scopes){
  try{return (await msalApp.acquireTokenSilent({scopes,account})).accessToken}
  catch(e){await msalApp.acquireTokenRedirect({scopes,account});throw new Error("redirect")}
}
function expSoon(t){try{const p=JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));return p.exp*1000<Date.now()+5*60e3}catch(e){return true}}
async function idToken(force){
  let r=await msalApp.acquireTokenSilent({scopes:["User.Read"],account,forceRefresh:!!force});
  if(!r.idToken||expSoon(r.idToken))r=await msalApp.acquireTokenSilent({scopes:["User.Read"],account,forceRefresh:true});
  return r.idToken;
}
async function gx(method,path,body,scopes){
  const t=await token(scopes||SCOPES);
  const r=await fetch(path.startsWith("http")?path:"https://graph.microsoft.com/v1.0"+path,{method,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((j.error&&j.error.message)||("Erreur "+r.status));e.status=r.status;throw e}
  return j;
}

/* ---------- réglages partagés (liste SharePoint) ---------- */
async function loadStore(){
  const s=await gx("GET",(CONFIG.site==="root"?"/sites/root":"/sites/"+CONFIG.site)+"?$select=id");siteId=s.id;
  let url=`/sites/${siteId}/lists?$select=id,displayName&$top=200`,found=null;
  while(url&&!found){const r=await gx("GET",url);found=(r.value||[]).find(l=>l.displayName===CONFIG.liste);url=r["@odata.nextLink"]}
  if(!found){
    const l=await gx("POST",`/sites/${siteId}/lists`,{displayName:CONFIG.liste,list:{template:"genericList"},columns:[{name:"Valeur",text:{allowMultipleLines:true,textType:"plain"}}]},SCOPES_ADMIN);
    listId=l.id;H.toast("Liste des réglages créée sur SharePoint");
  }else listId=found.id;
  let u=`/sites/${siteId}/lists/${listId}/items?$expand=fields&$top=200`,out={};
  while(u){const r=await gx("GET",u);(r.value||[]).forEach(it=>{const k=it.fields&&it.fields.Title;if(!k)return;items[k]=it.id;try{out[k]=JSON.parse(it.fields.Valeur||"null")}catch(e){}});u=r["@odata.nextLink"]}
  H.setShared(out);
}
async function saveKey(k,v){
  const fields={Valeur:JSON.stringify(v)};
  try{
    if(items[k])await gx("PATCH",`/sites/${siteId}/lists/${listId}/items/${items[k]}/fields`,fields);
    else{const r=await gx("POST",`/sites/${siteId}/lists/${listId}/items`,{fields:{Title:k,...fields}});items[k]=r.id}
  }catch(e){if(e.message!=="redirect")H.toast("Enregistrement partagé impossible : "+e.message,true)}
}
window.__hxSync=(k,v)=>{if(!listId)return;clearTimeout(timers[k]);timers[k]=setTimeout(()=>saveKey(k,v),500)};

/* ---------- données Organilog via le relais ---------- */
const p2=x=>String(x).padStart(2,"0"),ym=d=>d.getFullYear()+"-"+p2(d.getMonth()+1);
function monthsFrom(start){const out=[];let d=new Date(start.getFullYear(),start.getMonth(),1);const now=new Date();while(d<=now){out.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out}
async function fetchMonth(d,retry){
  const from=ym(d)+"-01",last=new Date(d.getFullYear(),d.getMonth()+1,0),to=ym(d)+"-"+p2(last.getDate());
  const r=await fetch(CONFIG.relais.replace(/\/$/,"")+`/?from=${from}&to=${to}`+(window.__SOC==="chassaing"?"&soc=chassaing":""),{headers:{Authorization:"Bearer "+await idToken(retry)}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&!retry)return fetchMonth(d,true);
  if(!r.ok){const e=new Error(j.error||("Erreur "+r.status));e.status=r.status;e.email=j.email;throw e}
  return j;
}
async function loadData(full){
  if(loading)return;loading=true;
  const btn=$("#sync");if(btn){btn.disabled=true;btn.textContent="Actualisation…"}
  try{
    const R=H.get().R,start=R.debutSuivi&&/^\d{4}-\d{2}-\d{2}$/.test(R.debutSuivi)?new Date(R.debutSuivi+"T12:00"):new Date(new Date().getFullYear(),new Date().getMonth(),1);
    const months=monthsFrom(start),now=new Date(),limit=new Date(now.getFullYear(),now.getMonth()-1,1);
    const merged={users:[],clients:[],interventions:[],absences:[],date_from:ym(months[0])+"-01",date_to:""};const seen={},absSeen={};
    for(const m of months){
      const key="hx-m-"+ym(m);let j=null;
      if(!full&&m<limit){try{j=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}if(j&&!("absences" in j))j=null /* mois mis en cache avant la lecture des absences */}
      if(!j){j=await fetchMonth(m);if(m<limit){try{localStorage.setItem(key,JSON.stringify(j))}catch(e){}}}
      if(j.users&&j.users.length)merged.users=j.users;
      merged.clients=merged.clients.concat(j.clients||[]);if(j.clients_debug)merged.clients_debug=j.clients_debug;
      (j.interventions||[]).forEach(i=>{seen[i.id]=i});
      (j.absences||[]).forEach(a=>{absSeen[a.id]=a});if(j.absences_error)merged.absences_error=j.absences_error;
      merged.date_to=j.date_to||merged.date_to;
    }
    merged.interventions=Object.values(seen);merged.absences=Object.values(absSeen);
    window.__rawOrg=merged;
    H.applyImport(merged,false);H.fillTech();H.sourceBadge();["#imp-btn","#imp-reset"].forEach(s=>{const x=$(s);if(x)x.hidden=true});
    const b=$("#src");if(b)b.textContent+=" · à jour à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    H.render();hideGate();
  }catch(e){
    if(e.message==="redirect")return;
    if(e.status===403)showGate("Accès non autorisé",`Le compte <b>${esc(e.email||"")}</b> n'a pas accès aux heures des techniciens. Demandez à Dimitri de l'ajouter.`,"Changer de compte",()=>msalApp.logoutRedirect({account}));
    else if(e.status===401)showGate("Connexion à renouveler","Votre connexion Microsoft a expiré.","Se reconnecter",()=>msalApp.loginRedirect({scopes:SCOPES}));
    else{H.toast("Organilog n'a pas pu être lu : "+e.message,true);hideGate()}
  }finally{loading=false;if(btn){btn.disabled=false;btn.textContent="Actualiser"}}
}

/* ---------- démarrage ---------- */
async function start(){
  const box=document.querySelector(".srcbox");
  if(box){$("#imp-btn").hidden=true;$("#imp-reset").hidden=true;
    box.insertAdjacentHTML("beforeend",`<button class="btn" type="button" id="sync">Actualiser</button><span class="who" id="who"></span><button class="btn" type="button" id="logout">Se déconnecter</button>`);
    $("#sync").addEventListener("click",()=>loadData(false));
    $("#logout").addEventListener("click",()=>msalApp&&msalApp.logoutRedirect({account}));
  }
  if(CONFIG.relais.startsWith("COLLER")){showGate("Réglages à compléter","Collez l'adresse du relais Cloudflare en haut du script de la page (voir le guide).");return}
  if(!window.msal){showGate("Connexion impossible","Le module de connexion Microsoft n'a pas pu se charger. Rechargez la page.");return}
  msalApp=new msal.PublicClientApplication({auth:{clientId:CONFIG.clientId,authority:"https://login.microsoftonline.com/"+CONFIG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
  let res=null;
  try{res=await msalApp.handleRedirectPromise()}catch(e){showGate("Connexion refusée",esc(e.message),"Réessayer",()=>msalApp.loginRedirect({scopes:SCOPES}));return}
  account=(res&&res.account)||msalApp.getAllAccounts()[0]||null;
  if(!account){showGate("Heures techniciens","Connectez-vous avec votre compte Microsoft de l'entreprise.","Se connecter",()=>msalApp.loginRedirect({scopes:SCOPES}));return}
  $("#who").textContent=account.name||account.username;
  if((account.username||"").toLowerCase()!=="d.blin@chassaing-technologies.fr"){const sel=document.querySelector('.tab[aria-selected=true]');document.querySelectorAll('.tab[data-tab="techs"],.tab[data-tab="montants"],.tab[data-tab="regles"]').forEach(t=>t.remove());if(sel&&!sel.isConnected){const f=document.querySelector('.tab');if(f)f.click()}}
  showGate("Chargement…","Lecture des réglages partagés et des interventions Organilog.");
  try{await loadStore()}catch(e){if(e.message==="redirect")return;showGate("Réglages partagés illisibles",esc(e.message),"Réessayer",()=>location.reload());return}
  H.render();
  await loadData(false);
}
if(window.__SOC==="chassaing"){const l=document.querySelector(".brand .logo");if(l)l.src=window.__LOGO_CH;const h=document.querySelector(".brand h1");if(h)h.textContent="Heures techniciens Chassaing"}
start();
})();
</script>

 return Object.keys(k).sort().map(key=>{const e=k[key],vs=[...e.vals.entries()].sort((a,b)=>b[1]-a[1]);return {key,n:e.n,tot:list.length,distinct:vs.length,ex:vs.slice(0,vs.length<=15?15:4)}})}

<style id="skin">
/* habillage commun « Espace équipe » (pages seules et portail) */
html.skin{--b1:#E4670A;--b2:#1F7FC4;--b3:#8E2344;--b4:#B8901A}
html.skin .wrap{padding-top:10px}
html.skin .brandline:not(.ab-line),html.skin .trial{display:none!important}
html.skin header.top{display:none!important}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:14px;padding:14px 18px;margin:4px 0 14px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--b1) 0 25%,var(--b2) 25% 50%,var(--b3) 50% 75%,var(--b4) 75%)}
.hero .hic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none;background:color-mix(in srgb,var(--acc) 14%,var(--surface))}
.hero h1{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;margin:0;letter-spacing:.2px}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hero .htx{min-width:0;flex:1 1 260px}
.hero .hact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.hero .hact>*{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
html.embed .hero .hact .who{display:none}
.hero .hact .who .me{color:var(--muted);font-size:13px}
html.skin .stats{gap:12px}
html.skin .stat{border-radius:14px;border-top:5px solid var(--sc,var(--b1));padding:12px 16px 14px;position:relative}
html.skin .stat:nth-child(4n+1){--sc:var(--b1)}html.skin .stat:nth-child(4n+2){--sc:var(--b2)}html.skin .stat:nth-child(4n+3){--sc:var(--b3)}html.skin .stat:nth-child(4n+4){--sc:var(--b4)}
html.skin .stat b{font-size:36px}
html.skin .stat span{font-size:13.5px}
html.skin .panel,html.skin .signes,html.skin .todo,html.skin .empty{border-radius:14px}
html.skin .panel{border-top:4px solid var(--acc)}
html.skin .card{border-radius:12px;transition:box-shadow .15s,transform .15s}
html.skin .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
html.skin .tabs .tab{font-size:21px}
html.skin .tabs .tab[aria-selected=true]{border-bottom-color:var(--acc)!important}
html.skin .btn.primary{border-radius:10px}
html.skin .filters select,html.skin .filters input:not([type=checkbox]){border-radius:10px}
html.skin .note{border-radius:12px}
@media (max-width:700px){html.skin .tabs .tab{font-size:17px;padding-left:8px;padding-right:8px}.hero{padding:12px 14px;gap:12px}.hero .hic{width:44px;height:44px;font-size:24px;border-radius:12px}.hero h1{font-size:26px}.hero .hact{margin-left:0;width:100%}}
.appbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.ab-line{display:grid!important;grid-template-columns:repeat(4,1fr);height:4px}
.ab-line i:nth-child(1){background:var(--b1)}.ab-line i:nth-child(2){background:var(--b2)}.ab-line i:nth-child(3){background:var(--b3)}.ab-line i:nth-child(4){background:var(--b4)}
.ab-row{display:flex;align-items:center;gap:14px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.ab-row .logos{display:flex;align-items:center;gap:12px;background:#fff;border-radius:8px;padding:3px 8px}
.ab-row .logos img{height:34px;width:auto;display:block}.ab-row .logos .sep{width:1px;height:26px;background:#DCDFE3}
.ab-tx{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.ab-tx small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ab-tx b{font-family:var(--f-display);font-size:19px}
@media (max-width:600px){.ab-row .logos img{height:24px}.ab-row{gap:10px}.ab-tx b{font-size:16px}}
@media (max-width:420px){.ab-tx{display:none}}
</style>
